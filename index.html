<script>
const PAGES = [{"chapter":"Prolog","title":"Ein ungewöhnlich ruhiger Morgen","subtitle":"Wenn sechs Fachleute eine Forschungsanlage betreten ...","blocks":[{"type":"narration","text":"Tief unter der Minecraft-Welt, verborgen zwischen mächtigen Gesteinsschichten, liegt eine Forschungsanlage, in der Wissenschaft, Magie und handwerklicher Einfallsreichtum aufeinandertreffen."},{"type":"narration","text":"Es ist ein ungewöhnlich ruhiger Morgen. Die Maschinen stehen still, die Öfen knistern leise, und irgendwo tropft Wasser in einen Eimer. Professor Kupferstein sitzt an seinem Schreibtisch und blättert in den Aufzeichnungen der letzten Forschungsarbeiten."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, ich möchte daran erinnern, dass wissenschaftlicher Fortschritt auf sorgfältiger Dokumentation beruht.","Unser Cobblestone-Generator funktioniert, Fäden und Eisengitter wurden beschafft. Als weitere Arbeitspunkte stehen Netherziegel und der Erzbrecher auf unseren Unterlagen."]},{"type":"narration","text":"Ein lautes metallisches Scheppern unterbricht ihn. Aus Richtung der Werkstatt ertönt eine Stimme, die selbst durch drei Steinwände noch deutlich zu hören wäre."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAAAART! Sach ma, wo haste denn meinen großen Schraubenschlüssel hingelegt?! Ich hab dir doch gesacht, dat Werkzeug gehört ordentlich an die Wand!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch selber inne Hand!"]},{"type":"narration","text":"Kurze Stille. Dann noch längere Stille."},{"type":"dialogue","speaker":"eckart","lines":["Meister?","Soll ich Ihnen trotzdem einen suchen?"]},{"type":"narration","text":"Professor Kupferstein nimmt seine Brille ab, putzt sie langsam und schreibt wortlos etwas in sein Notizbuch."}]},{"chapter":"Prolog","title":"Der Alles-wird-ordentlich-INATOR","subtitle":"Über Ordnung lässt sich streiten. Über Erfindungen erst recht.","blocks":[{"type":"narration","text":"In diesem Augenblick schlendert Werner in die Werkstatt. Er betrachtet das Durcheinander, grinst und lehnt sich an eine Werkbank."},{"type":"dialogue","speaker":"werner","lines":["Mensch, Röhrig! Wat brüllste denn hier so rum? Is doch noch früh am Tach!","Und du, Eckart, lass den Meister man suchen. Bewegung hält jung, nä?"]},{"type":"narration","text":"Plötzlich ertönt aus dem angrenzenden Forschungstrakt ein triumphierender Ruf."},{"type":"dialogue","speaker":"doofen","lines":["BEHOLD! Meine neueste Erfindung! Der absolut revolutionäre, wissenschaftlich nahezu perfekte ...","Ähm ... Moment. Wie hatte ich ihn noch mal genannt?"]},{"type":"narration","text":"Er dreht einen zerknitterten Zettel um."},{"type":"dialogue","speaker":"doofen","lines":["AH, JA! Der Alles-wird-endlich-ordentlich-sortiert-INATOR!","Mit diesem genialen Apparat werde ich sämtliche Unordnung in dieser Forschungsanlage beseitigen! Und danach erobere ich natürlich die gesamte Tri-State-Area! HAHAHA!"]},{"type":"narration","text":"Meister Röhrig schaut Werner an. Werner schaut Eckart an. Eckart schaut auf den Schraubenschlüssel in Röhrigs Hand. Professor Kupferstein legt seinen Füllfederhalter zur Seite. Niemand sagt ein Wort."},{"type":"narration","text":"Dann kommt aus einer dunklen Ecke des Labors ein tiefes, theatralisches Räuspern."},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei sämtlichen rostigen Ritterrüstungen meiner Ahnen! Ein Gerät, das Ordnung schafft? In DIESEM Labor?","Mein lieber Doktor, da wäre selbst die königliche Schlossverwaltung überfordert!","Und ich hoffe INSTÄNDIG, dass dieses Ding nicht wieder explodiert. Meine letzte Geisterrobe riecht noch immer nach verkohltem Redstone!"]},{"type":"narration","text":"Dr. Doofenshmirtz öffnet empört den Mund. Werner beginnt zu lachen. Eckart versucht unauffällig, den Schraubenschlüssel aus Meister Röhrigs Hand zu nehmen. Der Meister bemerkt es."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! NU LASS DOCH MAL MEIN WERKZEUG IN RUHE!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, Sie ham doch gerade ...","Ja, Meister."]}]},{"chapter":"Prolog","title":"Ein Augenblick der Ruhe","subtitle":"Die wissenschaftliche Disziplin hält vier Sekunden.","blocks":[{"type":"narration","text":"Professor Kupferstein steht auf. Er geht langsam zum großen Forschungstisch, legt sein Notizbuch darauf und schaut der Reihe nach in die Gesichter seiner Kollegen."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren."]},{"type":"narration","text":"Niemand reagiert."},{"type":"dialogue","speaker":"kupferstein","lines":["MEINE HERREN!"]},{"type":"narration","text":"Schlagartig verstummen alle."},{"type":"dialogue","speaker":"kupferstein","lines":["Wir haben hier eine bemerkenswerte Forschungsanlage. Wir haben Materialien, Werkzeuge, Maschinen und eine ganze Welt voller ungelöster Fragen.","Was wir allerdings dringend benötigen, ist ein Mindestmaß an wissenschaftlicher Disziplin."]},{"type":"narration","text":"Doofenshmirtz hebt vorsichtig einen Finger."},{"type":"dialogue","speaker":"doofen","lines":["Gilt das auch für meine Inatoren?"]},{"type":"dialogue","speaker":"kupferstein","lines":["GANZ BESONDERS für Ihre Inatoren!"]},{"type":"narration","text":"Hui Buh beginnt lautlos zu kichern. Werner setzt sich auf eine Kiste. Eckart findet endlich einen freien Platz für seinen Schraubenschlüssel. Meister Röhrig kontrolliert misstrauisch, ob dieser auch ordentlich liegt."},{"type":"narration","text":"Professor Kupferstein schlägt das Forschungsbuch auf der nächsten freien Seite auf. Mit sorgfältiger Handschrift setzt er eine neue Überschrift darunter: „Aygon-Forschungschroniken: Die nächsten Entdeckungen“."},{"type":"narration","text":"Sechs höchst unterschiedliche Gestalten versammeln sich um den Tisch. Und zum ersten Mal an diesem Morgen herrscht tatsächlich Stille. Jedenfalls für ungefähr vier Sekunden."},{"type":"dialogue","speaker":"eckart","lines":["Meister?"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN NU SCHON WIEDER, ECKART?!"]},{"type":"dialogue","speaker":"eckart","lines":["Wer macht eigentlich Kaffee?"]},{"type":"end","text":"Fortsetzung folgt ..."}]},{"chapter":"Hörspiel-Test","title":"Die Sache mit dem Schraubenschlüssel","subtitle":"Ein kurzer Stimmtest mit unserem Forschungsteam · keine neue Forschung","blocks":[{"type":"narration","text":"Ein leises Klirren hallt durch die Werkstatt. Meister Röhrig starrt auf den Arbeitstisch. Eckart steht neben ihm und versucht, möglichst unschuldig auszusehen."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! Wo is denn nu schon wieder mein Schraubenschlüssel?!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch inner Hand!"]},{"type":"narration","text":"Werner lehnt sich grinsend gegen eine Kiste. Professor Kupferstein hebt langsam den Blick von seinen Unterlagen."},{"type":"dialogue","speaker":"werner","lines":["Jau, Röhrig. Manchmal is dat Werkzeug näher als man denkt!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, könnten wir wenigstens einen einzigen Morgen ohne Werkzeugdiskussion beginnen?"]},{"type":"dialogue","speaker":"doofen","lines":["Ausgezeichnet! Dann stelle ich euch meinen völlig neuen Schraubenschlüssel-Such-INATOR vor!"]},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei meinen klappernden Ritterrüstungen! Hier braucht man wahrlich keine Geister, um Dinge verschwinden zu lassen!"]},{"type":"narration","text":"Eckart betrachtet den Schlüssel in der Hand des Meisters. Werner lacht leise. Für einen Augenblick herrscht Frieden im Labor."},{"type":"end","text":"Ende der Hörspielprobe"}]}];
const CAST = {"kupferstein":{"name":"Prof. Kupferstein","img":"bilder/prof_kupferstein.webp"},"roehrig":{"name":"Meister Röhrig","img":"bilder/meister_roehrig.webp"},"eckart":{"name":"Eckart","img":"bilder/eckart.webp"},"werner":{"name":"Werner","img":"bilder/werner.webp"},"doofen":{"name":"Dr. Doofenshmirtz","img":"bilder/dr_doofenshmirtz.webp"},"huibuh":{"name":"Hui Buh","img":"bilder/hui_buh.webp"}};

function elt(tag, cls, text) { const el=document.createElement(tag); if(cls)el.className=cls; if(text!==undefined)el.textContent=text;return el; }
function add(parent,...children){ for(const child of children)parent.appendChild(child);return parent;}
function openModal(content){modalContents.replaceChildren(content);overlay.classList.add('open');document.body.style.overflow='hidden';document.getElementById('modal-close').focus()}
function closeModal(){overlay.classList.remove('open');document.body.style.overflow=''}
function portraitModal(key){const person=CAST[key];if(!person)return; const div=elt('div','lightbox');const img=elt('img');img.src=person.img;img.alt='Originalporträt von '+person.name;add(div,img,elt('p','',person.name));openModal(div)}
function addNarration(parent,text){parent.appendChild(elt('p','narration',text))}
function addDialogue(parent,block){const person=CAST[block.speaker];if(!person)return;
 const card=elt('section','dialogue');const btn=elt('button','portrait-button');btn.type='button';btn.setAttribute('aria-label','Porträt von '+person.name+' vergrößern');const img=elt('img','portrait');img.src=person.img;img.alt=person.name;img.width=252;img.height=252;img.loading='eager';img.decoding='async';btn.appendChild(img);btn.addEventListener('click',()=>portraitModal(block.speaker));
 const right=elt('div');add(right,elt('div','speaker',person.name));const speech=elt('div','speech');block.lines.forEach(line=>speech.appendChild(elt('p','',line)));right.appendChild(speech);add(card,btn,right);parent.appendChild(card);
}
function updateChrome(){ document.getElementById('progress-bar').style.width=((current+1)/(PAGES.length+1)*100)+'%';document.getElementById('prev').disabled=current<0;document.getElementById('next').disabled=current>=PAGES.length-1;document.getElementById('next').textContent=current===-1?'Buch öffnen →':current===PAGES.length-1?'Ende des Prologs':'Weiter →';document.getElementById('page-count').textContent=current===-1?'Titelblatt':`Seite ${current+1} von ${PAGES.length}`;}
function render(){root.replaceChildren();
 if(current===-1){const cover=elt('section','cover');const wrap=elt('div');add(wrap,elt('div','cover-mark','✧'),elt('span','ribbon','BAND I  ·  DER PROLOG'),elt('h1','', 'Aygon'),elt('div','cover-sub','Forschungschroniken'),elt('div','ornament','✦'),elt('p','deck','Sechs Spezialisten. Ein unterirdisches Labor. Eine Sammlung höchst ungewöhnlicher Forschungsabenteuer, bei denen wissenschaftliche Disziplin manchmal nur vier Sekunden hält.'));const b=elt('button','big-button','Die Geschichte beginnen');b.onclick=()=>go(0);wrap.appendChild(b);wrap.appendChild(elt('small','','Interaktives Leseexemplar · Alle Bilder lokal · Keine Internetverbindung nötig'));cover.appendChild(wrap);root.appendChild(cover);}
 else {const page=PAGES[current];add(root,elt('div','eyebrow',page.chapter+'  /  Seite '+(current+1)),elt('h1','chapter-title',page.title),elt('p','subtitle',page.subtitle),elt('div','ornament','✦'));
 for(const b of page.blocks){if(b.type==='narration')addNarration(root,b.text);else if(b.type==='dialogue')addDialogue(root,b);else if(b.type==='end')root.appendChild(elt('div','finish',b.text));}
 const footer=elt('div','page-foot');add(footer,elt('span','','AYGON · EINE REISE DURCH DIE ZEIT'),elt('span','','Fiktive Rahmenszene · Keine neuen Versuchsergebnisse'));root.appendChild(footer);
 }
 updateChrome();window.scrollTo({top:0,behavior:'smooth'});
}
function go(page){stopReading();current=Math.min(PAGES.length-1,Math.max(-1,page));render();updateAudioButtons();}
document.getElementById('prev').onclick=()=>go(current-1);
document.getElementById('next').onclick=()=>current<PAGES.length-1&&go(current+1);
document.getElementById('home').onclick=()=>go(-1);
document.getElementById('toc').onclick=()=>{const list=elt('div','index-list');const cover=elt('button','index-item');add(cover,elt('span','index-num','0'),elt('span','','Titelblatt'));cover.onclick=()=>{closeModal();go(-1)};list.appendChild(cover);PAGES.forEach((p,i)=>{const b=elt('button','index-item');const t=elt('span');add(t,elt('strong','',p.title),elt('small','',p.subtitle));add(b,elt('span','index-num',String(i+1)),t);b.onclick=()=>{closeModal();go(i)};list.appendChild(b)});const out=elt('div');add(out,elt('h2','','Inhaltsverzeichnis'),list);openModal(out)};
document.getElementById('cast').onclick=()=>{const out=elt('div');out.appendChild(elt('h2','','Unsere Forschungsgruppe'));const grid=elt('div','cast-grid');for(const [key,p]of Object.entries(CAST)){const card=elt('button','cast-card');const img=elt('img');img.src=p.img;img.alt=p.name;img.loading='lazy';add(card,img,elt('strong','',p.name));card.onclick=()=>portraitModal(key);grid.appendChild(card)}out.appendChild(grid);openModal(out)};
textToggle.onclick=()=>{portraitsVisible=!portraitsVisible;document.body.classList.toggle('view-text',!portraitsVisible);textToggle.textContent=portraitsVisible?'🖼 Bilder: an':'▤ Bilder: aus';textToggle.setAttribute('aria-pressed',String(!portraitsVisible));};
settingsSize.onclick=()=>{fontScale=fontScale===1?1.15:fontScale===1.15?1.3:1;document.documentElement.style.setProperty('--font-scale',fontScale);settingsSize.textContent='A± Schrift '+Math.round(fontScale*100)+'%';};
document.getElementById('modal-close').onclick=closeModal;
overlay.addEventListener('click',ev=>{if(ev.target===overlay)closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();return}if(overlay.classList.contains('open'))return;if(ev.key==='ArrowRight'&&current<PAGES.length-1)go(current+1);if(ev.key==='ArrowLeft'&&current>=0)go(current-1)});
render();

// Vorlesefunktion: Browser-Sprachausgabe, keine externe Bibliothek.
const synthesisSupported=('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
const speakEngine=synthesisSupported?window.speechSynthesis:null;
const readButton=document.getElementById('read-start');
const pauseButton=document.getElementById('read-pause');
const stopButton=document.getElementById('read-stop');
const voiceChoice=document.getElementById('voice-choice');
const speedChoice=document.getElementById('speed-choice');
const autoNext=document.getElementById('auto-next');
const speechStatus=document.getElementById('audio-status');
// Lokaler Hörspielmodus: vorhandene deutsche Stimmen, pro Rolle unterschiedliche Klangfarben.
const CAST_PROFILES={
 narrator:{name:'Erzähler',pitch:1,rate:.92,prefer:'warm',gender:'neutral'},
 kupferstein:{name:'Prof. Kupferstein',pitch:.93,rate:.91,prefer:'m',gender:'male'},
 roehrig:{name:'Meister Röhrig',pitch:.81,rate:1.02,prefer:'m',gender:'male'},
 eckart:{name:'Eckart',pitch:1.17,rate:1.07,prefer:'m',gender:'male'},
 werner:{name:'Werner',pitch:.92,rate:1.12,prefer:'m',gender:'male'},
 doofen:{name:'Dr. Doofenshmirtz',pitch:1.23,rate:1.12,prefer:'m',gender:'male'},
 huibuh:{name:'Hui Buh',pitch:.84,rate:.88,prefer:'m',gender:'male'}
};
const roleChoices={};
const roleHints={narrator:'Warm, ruhig',kupferstein:'Sachlich, bedacht',roehrig:'Kernig und laut',eckart:'Jugendlich, etwas nervös',werner:'Locker und flott',doofen:'Aufgedreht und exzentrisch',huibuh:'Tief und theatralisch'};
const castMode=document.getElementById('cast-mode');
function germanVoices(){return lastVoiceList.filter(v=>/^de(?:-|$)/i.test(v.lang))}
function voiceForRole(key){
 const available=germanVoices();const chosen=lastVoiceList.find(v=>v.voiceURI===roleChoices[key]);
 if(chosen)return chosen;
 const basic=lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(!available.length)return basic||null;
 const idx={narrator:0,kupferstein:1,roehrig:2,eckart:3,werner:4,doofen:5,huibuh:6}[key]||0;
 return available[idx%available.length];
}
function openCasting(){
 const modal=elt('div');add(modal,elt('h2','','🎭 Rollenbesetzung'),elt('p','','Für jede Figur kannst du eine verfügbare deutsche Browserstimme wählen. Auch bei nur einer Stimme unterscheiden sich Tonhöhe und Tempo. Das sind keine aufgenommenen Synchronstimmen.'));
 const voices=germanVoices();
 if(!voices.length)modal.appendChild(elt('p','','Keine deutschen Stimmen erkannt. Die Systemstimme wird verwendet.'));
 const list=elt('div','casting-grid');
 for(const [key,profile] of Object.entries(CAST_PROFILES)){
  const row=elt('div','casting-row'); const left=elt('div');add(left,elt('strong','',profile.name),elt('small','',roleHints[key]));
  const sel=elt('select');sel.setAttribute('aria-label','Stimme für '+profile.name);
  sel.appendChild(new Option('Automatische Besetzung',''));
  for(const voice of voices)sel.appendChild(new Option(`${voice.name} (${voice.lang})`,voice.voiceURI));
  sel.value=roleChoices[key]||'';
  sel.addEventListener('change',()=>{roleChoices[key]=sel.value});
  const preview=elt('button','audio-btn','▶ Test');preview.type='button';preview.onclick=()=>{
    if(!speakEngine)return;stopReading();
    const ut=new SpeechSynthesisUtterance(key==='narrator'?'Tief unter der Minecraft-Welt liegt das Aygon-Forschungslabor.':key==='roehrig'?'Eckart! Wo ist denn mein Schraubenschlüssel?':key==='eckart'?'Aber Meister, den ham Sie doch in der Hand!':key==='huibuh'?'Bei meinen klappernden Ritterrüstungen!':`Guten Morgen! Hier spricht ${profile.name}.`);
    const picked=voiceForRole(key);if(picked){ut.voice=picked;ut.lang=picked.lang}else ut.lang='de-DE';
    ut.pitch=profile.pitch;ut.rate=profile.rate*(parseFloat(speedChoice.value)||1);
    speakEngine.speak(ut);
  };
  add(row,left,sel,preview);list.appendChild(row)
 }
 modal.appendChild(list);openModal(modal);
}
document.getElementById('cast-settings').onclick=openCasting;
document.getElementById('jump-demo').onclick=()=>go(PAGES.length-1);
let speechSession=0, speechItems=[], speechCursor=0, speechRunning=false, speechPaused=false, lastVoiceList=[];
function setAudioStatus(text){speechStatus.textContent=text}
function clearSpeaking(){document.querySelectorAll('.speaking-block').forEach(el=>el.classList.remove('speaking-block'))}
function updateAudioButtons(){
 readButton.disabled=!synthesisSupported||current<0;
 pauseButton.disabled=!synthesisSupported||!speechRunning;
 stopButton.disabled=!synthesisSupported||!speechRunning;
 pauseButton.textContent=speechPaused?'▶ Fortsetzen':'⏸ Pause';
 readButton.textContent=speechRunning?'↻ Neu vorlesen':'▶ Vorlesen';
}
function stopReading(){
 speechSession++; speechRunning=false;speechPaused=false;speechItems=[];speechCursor=0;
 if(speakEngine){try{speakEngine.cancel()}catch(error){}}
 clearSpeaking();setAudioStatus(synthesisSupported?'Bereit zum Vorlesen':'Keine Sprachausgabe verfügbar');updateAudioButtons();
}
function populateVoices(){
 if(!speakEngine)return;
 const all=speakEngine.getVoices();
 if(!all.length){voiceChoice.replaceChildren(new Option('Systemstimme (automatisch)',''));return}
 lastVoiceList=all;
 const prev=voiceChoice.value;
 const sorted=[...all].sort((a,b)=>{const aDe=a.lang.toLowerCase().startsWith('de')?0:1;const bDe=b.lang.toLowerCase().startsWith('de')?0:1;return aDe-bDe||a.name.localeCompare(b.name)});
 voiceChoice.replaceChildren(...sorted.map(v=>new Option(`${v.name} (${v.lang})`,v.voiceURI)));
 let chosen=sorted.find(v=>v.voiceURI===prev) || sorted.find(v=>v.lang.toLowerCase()==='de-de') || sorted.find(v=>v.lang.toLowerCase().startsWith('de')) || sorted[0];
 voiceChoice.value=chosen.voiceURI;
}
function collectSpeechItems(){
 const out=[];
 // Die visuellen Abschnitte liefern die Reihenfolge. Jedes Sprecherporträt bleibt im Text sichtbar.
 for(const el of root.querySelectorAll('.narration,.dialogue')){
   if(el.classList.contains('narration')){out.push({element:el,text:el.textContent.trim(),role:"narrator"})}
   else{
     const who=el.querySelector('.speaker')?.textContent.trim()||'';
     const words=[...el.querySelectorAll('.speech p')].map(x=>x.textContent.trim()).filter(Boolean).join(' ');
     out.push({element:el,text:words,role:el.querySelector(".speaker")?.textContent.trim()===CAST.kupferstein.name?"kupferstein":Object.keys(CAST).find(key=>CAST[key].name===who)||"narrator",who});
   }
 }
 return out.filter(item=>item.text);
}
function speakNext(session){
 if(session!==speechSession||!speechRunning)return;
 clearSpeaking();
 if(speechCursor>=speechItems.length){
    const shouldContinue=autoNext.checked&&current<PAGES.length-1;
    speechRunning=false; speechPaused=false;
    if(shouldContinue){go(current+1);playReading();return}
    setAudioStatus('Seite vollständig vorgelesen');updateAudioButtons();return;
 }
 const item=speechItems[speechCursor];
 item.element.classList.add('speaking-block');
 // Leseabschnitt nur dann sichtbar machen, wenn er außerhalb des Fensters liegt.
 const rect=item.element.getBoundingClientRect();
 if(rect.bottom>window.innerHeight-40||rect.top<85)item.element.scrollIntoView({behavior:'smooth',block:'center'});
 const utterance=new SpeechSynthesisUtterance(item.text);
 utterance.lang='de-DE';utterance.rate=parseFloat(speedChoice.value)||1;utterance.pitch=1;utterance.volume=1;
 const profile=CAST_PROFILES[item.role]||CAST_PROFILES.narrator;
 const chosen=castMode.checked?voiceForRole(item.role):lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(castMode.checked){utterance.pitch=profile.pitch;utterance.rate=(parseFloat(speedChoice.value)||1)*profile.rate;}
 if(chosen){utterance.voice=chosen;utterance.lang=chosen.lang;}
 utterance.onstart=()=>{if(session!==speechSession)return;setAudioStatus(`Abschnitt ${speechCursor+1} von ${speechItems.length}`)};
 utterance.onend=()=>{if(session!==speechSession)return;speechCursor++;speakNext(session)};
 utterance.onerror=(event)=>{
   if(session!==speechSession)return;
   if(event.error==='canceled'||event.error==='interrupted')return;
   speechRunning=false;speechPaused=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe fehlgeschlagen: '+(event.error||'unbekannter Fehler'));
 };
 try{speakEngine.speak(utterance)}catch(err){speechRunning=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe konnte nicht starten')}
}
function playReading(){
 if(!synthesisSupported){setAudioStatus('Dieser Browser unterstützt keine Vorlesefunktion');return}
 if(current<0){go(0)}
 stopReading();
 // Eine deutsche Stimme kann auch erst nach dem Laden des Buchs erscheinen.
 populateVoices();
 speechItems=collectSpeechItems();speechCursor=0;
 if(!speechItems.length){setAudioStatus('Auf dieser Seite gibt es keinen Vorlesetext');return}
 speechRunning=true;speechPaused=false;const session=speechSession;
 updateAudioButtons();setAudioStatus('Vorlesen wird gestartet …');speakNext(session);
}
readButton.addEventListener('click',playReading);
pauseButton.addEventListener('click',()=>{
 if(!speechRunning||!speakEngine)return;
 if(speechPaused){speakEngine.resume();speechPaused=false;setAudioStatus('Vorlesen fortgesetzt')}
 else{speakEngine.pause();speechPaused=true;setAudioStatus('Vorlesen pausiert')}
 updateAudioButtons();
});
stopButton.addEventListener('click',stopReading);
if(speakEngine){populateVoices();if(speakEngine.addEventListener)speakEngine.addEventListener('voiceschanged',populateVoices)}
else{setAudioStatus('Sprachausgabe hier nicht verfügbar');voiceChoice.disabled=true;speedChoice.disabled=true;autoNext.disabled=true}
updateAudioButtons();

</script>
</body>
</html>
