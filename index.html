<script>
const PAGES = [{"chapter":"Prolog","title":"Ein ungewöhnlich ruhiger Morgen","subtitle":"Wenn sechs Fachleute eine Forschungsanlage betreten ...","blocks":[{"type":"narration","text":"Tief unter der Minecraft-Welt, verborgen zwischen mächtigen Gesteinsschichten, liegt eine Forschungsanlage, in der Wissenschaft, Magie und handwerklicher Einfallsreichtum aufeinandertreffen."},{"type":"narration","text":"Es ist ein ungewöhnlich ruhiger Morgen. Die Maschinen stehen still, die Öfen knistern leise, und irgendwo tropft Wasser in einen Eimer. Professor Kupferstein sitzt an seinem Schreibtisch und blättert in den Aufzeichnungen der letzten Forschungsarbeiten."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, ich möchte daran erinnern, dass wissenschaftlicher Fortschritt auf sorgfältiger Dokumentation beruht.","Unser Cobblestone-Generator funktioniert, Fäden und Eisengitter wurden beschafft. Als weitere Arbeitspunkte stehen Netherziegel und der Erzbrecher auf unseren Unterlagen."]},{"type":"narration","text":"Ein lautes metallisches Scheppern unterbricht ihn. Aus Richtung der Werkstatt ertönt eine Stimme, die selbst durch drei Steinwände noch deutlich zu hören wäre."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAAAART! Sach ma, wo haste denn meinen großen Schraubenschlüssel hingelegt?! Ich hab dir doch gesacht, dat Werkzeug gehört ordentlich an die Wand!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch selber inne Hand!"]},{"type":"narration","text":"Kurze Stille. Dann noch längere Stille."},{"type":"dialogue","speaker":"eckart","lines":["Meister?","Soll ich Ihnen trotzdem einen suchen?"]},{"type":"narration","text":"Professor Kupferstein nimmt seine Brille ab, putzt sie langsam und schreibt wortlos etwas in sein Notizbuch."}]},{"chapter":"Prolog","title":"Der Alles-wird-ordentlich-INATOR","subtitle":"Über Ordnung lässt sich streiten. Über Erfindungen erst recht.","blocks":[{"type":"narration","text":"In diesem Augenblick schlendert Werner in die Werkstatt. Er betrachtet das Durcheinander, grinst und lehnt sich an eine Werkbank."},{"type":"dialogue","speaker":"werner","lines":["Mensch, Röhrig! Wat brüllste denn hier so rum? Is doch noch früh am Tach!","Und du, Eckart, lass den Meister man suchen. Bewegung hält jung, nä?"]},{"type":"narration","text":"Plötzlich ertönt aus dem angrenzenden Forschungstrakt ein triumphierender Ruf."},{"type":"dialogue","speaker":"doofen","lines":["BEHOLD! Meine neueste Erfindung! Der absolut revolutionäre, wissenschaftlich nahezu perfekte ...","Ähm ... Moment. Wie hatte ich ihn noch mal genannt?"]},{"type":"narration","text":"Er dreht einen zerknitterten Zettel um."},{"type":"dialogue","speaker":"doofen","lines":["AH, JA! Der Alles-wird-endlich-ordentlich-sortiert-INATOR!","Mit diesem genialen Apparat werde ich sämtliche Unordnung in dieser Forschungsanlage beseitigen! Und danach erobere ich natürlich die gesamte Tri-State-Area! HAHAHA!"]},{"type":"narration","text":"Meister Röhrig schaut Werner an. Werner schaut Eckart an. Eckart schaut auf den Schraubenschlüssel in Röhrigs Hand. Professor Kupferstein legt seinen Füllfederhalter zur Seite. Niemand sagt ein Wort."},{"type":"narration","text":"Dann kommt aus einer dunklen Ecke des Labors ein tiefes, theatralisches Räuspern."},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei sämtlichen rostigen Ritterrüstungen meiner Ahnen! Ein Gerät, das Ordnung schafft? In DIESEM Labor?","Mein lieber Doktor, da wäre selbst die königliche Schlossverwaltung überfordert!","Und ich hoffe INSTÄNDIG, dass dieses Ding nicht wieder explodiert. Meine letzte Geisterrobe riecht noch immer nach verkohltem Redstone!"]},{"type":"narration","text":"Dr. Doofenshmirtz öffnet empört den Mund. Werner beginnt zu lachen. Eckart versucht unauffällig, den Schraubenschlüssel aus Meister Röhrigs Hand zu nehmen. Der Meister bemerkt es."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! NU LASS DOCH MAL MEIN WERKZEUG IN RUHE!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, Sie ham doch gerade ...","Ja, Meister."]}]},{"chapter":"Prolog","title":"Ein Augenblick der Ruhe","subtitle":"Die wissenschaftliche Disziplin hält vier Sekunden.","blocks":[{"type":"narration","text":"Professor Kupferstein steht auf. Er geht langsam zum großen Forschungstisch, legt sein Notizbuch darauf und schaut der Reihe nach in die Gesichter seiner Kollegen."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren."]},{"type":"narration","text":"Niemand reagiert."},{"type":"dialogue","speaker":"kupferstein","lines":["MEINE HERREN!"]},{"type":"narration","text":"Schlagartig verstummen alle."},{"type":"dialogue","speaker":"kupferstein","lines":["Wir haben hier eine bemerkenswerte Forschungsanlage. Wir haben Materialien, Werkzeuge, Maschinen und eine ganze Welt voller ungelöster Fragen.","Was wir allerdings dringend benötigen, ist ein Mindestmaß an wissenschaftlicher Disziplin."]},{"type":"narration","text":"Doofenshmirtz hebt vorsichtig einen Finger."},{"type":"dialogue","speaker":"doofen","lines":["Gilt das auch für meine Inatoren?"]},{"type":"dialogue","speaker":"kupferstein","lines":["GANZ BESONDERS für Ihre Inatoren!"]},{"type":"narration","text":"Hui Buh beginnt lautlos zu kichern. Werner setzt sich auf eine Kiste. Eckart findet endlich einen freien Platz für seinen Schraubenschlüssel. Meister Röhrig kontrolliert misstrauisch, ob dieser auch ordentlich liegt."},{"type":"narration","text":"Professor Kupferstein schlägt das Forschungsbuch auf der nächsten freien Seite auf. Mit sorgfältiger Handschrift setzt er eine neue Überschrift darunter: „Aygon-Forschungschroniken: Die nächsten Entdeckungen“."},{"type":"narration","text":"Sechs höchst unterschiedliche Gestalten versammeln sich um den Tisch. Und zum ersten Mal an diesem Morgen herrscht tatsächlich Stille. Jedenfalls für ungefähr vier Sekunden."},{"type":"dialogue","speaker":"eckart","lines":["Meister?"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN NU SCHON WIEDER, ECKART?!"]},{"type":"dialogue","speaker":"eckart","lines":["Wer macht eigentlich Kaffee?"]},{"type":"end","text":"Fortsetzung folgt ..."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Das große Trockenlegen","subtitle":"Teil 1: Regen, eine heimliche Idee und eine sehr stille Werkstatt","blocks":[{"type":"narration","text":"Ein neuer Tag beginnt im unterirdischen Aygon-Forschungslabor. Über der Minecraft-Welt hängen schwere Regenwolken. Bald trommelt der Regen auf den Boden, während tief darunter sechs Kollegen noch friedlich schlafen. Nur der Forschungsleiter ist schon wach."},{"type":"narration","text":"Er steht am Treppenabgang zur Werkstatt und betrachtet das Ergebnis der letzten Umbauarbeiten. Es ist nicht alles schlecht, aber die Wege sind eng, die Arbeitsplätze ungünstig verteilt und das viele Wasser stört. Vor allem aber hatte man bereits Ärger mit Endermen gehabt. Deshalb soll die Werkstatt niedriger und übersichtlicher werden."},{"type":"dialogue","speaker":"leader","lines":["Nein, meine lieben Freunde. Wir wollen hier forschen und keine Unterwasserexpedition veranstalten. Und auf unerwartete Besuche von Endermen kann ich ebenfalls verzichten."]},{"type":"narration","text":"Der Forschungsleiter lässt den Blick über die Wände wandern. Dann bleibt er gedankenverloren vor dem altbekannten Erzwäscher stehen. Das charakteristische Gesicht an der Maschine blickt ihn an, als wollte es fragen, weshalb sie schon wieder umziehen muss."},{"type":"dialogue","speaker":"leader","lines":["Warte mal ... wenn ich den Raum niedriger halte und den Kessel ein Stück in den Boden einlasse, bleibt der Erzwäscher benutzbar, ohne so hoch in den Raum zu ragen. Ja, genau so machen wir das!"]},{"type":"narration","text":"Die Idee gefällt ihm. Während draußen der Regen zunimmt und seine Kollegen immer noch schlafen, holt er Werkzeug und beginnt mit der Arbeit."},{"type":"narration","text":"Steinblöcke werden herausgenommen und neu gesetzt. Ein heller, engerer Zugang entsteht; eine Holztür trennt die Treppe von der Werkstatt. Die Decke bleibt bewusst niedrig, denn die früheren Schwierigkeiten mit den Endermen sollen sich nicht wiederholen."},{"type":"narration","text":"Das Wasser wird aus den störenden Bereichen entfernt. Der Forschungsleiter gestaltet die trockenen Laufwege neu, passt die Beleuchtung an und verteilt die Arbeitsstationen so, dass sie trotz der geringeren Raumhöhe gut erreichbar bleiben."},{"type":"narration","text":"Besondere Aufmerksamkeit erhält der Erzwäscher. Sein Kessel wird tiefer in den Boden eingesetzt. Das auffällige Gesicht der Maschine bleibt sichtbar, aber die gesamte Konstruktion wirkt nun deutlich weniger hoch."},{"type":"dialogue","speaker":"leader","lines":["So. Du bist immer noch unser Erzwäscher und kein geheimnisvoller Wächter. Aber wenigstens stehst du jetzt nicht mehr mitten im Weg."]},{"type":"narration","text":"Anschließend kontrolliert er den angrenzenden Bereich. Der Cobblestone-Generator steht weiterhin im hinteren, separaten Raum. Auch der Schmelzkessel hat seinen festen Platz. Hier wird heute nichts erforscht oder neu ausprobiert; es geht ausschließlich darum, die Werkstatt vernünftig einzurichten."},{"type":"narration","text":"Als er schließlich fertig ist, leuchten die Fackeln auf helle Steinwände und einen trockenen Boden. Der Forschungsleiter tritt zurück und nickt zufrieden."},{"type":"dialogue","speaker":"leader","lines":["Na also. Geht doch! Und diesmal hat mir niemand erklärt, dass ein zusätzlicher Hebel die Lösung für sämtliche Probleme wäre."]},{"type":"narration","text":"Er löscht sein Arbeitslicht am Gang, lässt die Werkstatt in Ruhe und beschließt, die Überraschung bis zum nächsten Morgen für sich zu behalten."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Die Überraschung hinter der Tür","subtitle":"Teil 2: Sechs Kollegen, eine neue Werkstatt und die große Wasserfrage","blocks":[{"type":"narration","text":"Am nächsten Morgen ist im Forschungslabor die gewohnte Geräuschkulisse zurückgekehrt. Werner sitzt mit einer Tasse Kaffee am Tisch. Professor Kupferstein blättert in seinen Notizen. Hui Buh schwebt verschlafen über den Stühlen, während Dr. Doofenshmirtz bereits eine neue Erfindung skizziert."},{"type":"narration","text":"Meister Röhrich durchsucht seinen Werkzeugkasten. Eckart steht in sicherem Abstand daneben."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WO IS MEIN SCHRAUBENSCHLÜSSEL?!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch gestern selbst weggelegt!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ABER WO?!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Vielleicht hat er sich aus Angst vor dir versteckt, Röhrich!"]},{"type":"narration","text":"In diesem Moment kommt der Forschungsleiter herein. Sein zufriedenes Lächeln macht die Kollegen sofort misstrauisch."},{"type":"dialogue","speaker":"leader","lines":["Guten Morgen, meine lieben Freunde! Ich habe eine Überraschung für euch. Wenn ihr mir bitte folgen würdet?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Mir sind in der vergangenen Nacht ungewöhnliche Arbeitsgeräusche aufgefallen. Nun bin ich allerdings gespannt."]},{"type":"dialogue","speaker":"eckart","lines":["Ich hab gedacht, dat sind wieder Monster!"]},{"type":"dialogue","speaker":"huibuh","lines":["Monster? In unserem Labor? Eine Unverschämtheit! Für gepflegte Schreckensauftritte bin immer noch ich zuständig!"]},{"type":"dialogue","speaker":"doofen","lines":["Eine Überraschung! Ist es eine neue Maschine? Ein Geheimlabor? Vielleicht mein lang ersehnter Selbstzerstörungs-Inator?"]},{"type":"dialogue","speaker":"roehrig","lines":["DOOFENSHMIRTZ! HIER ZERSTÖRT SICH HEUTE ÜBERHAUPT NIX!"]},{"type":"narration","text":"Der Forschungsleiter führt die Gruppe zur Holztür am Treppenabgang. Er öffnet sie, und die Kollegen steigen hintereinander hinunter. Unten angekommen bleiben alle wie angewurzelt stehen."},{"type":"narration","text":"Ein trockener Steinboden, helle Wände, mehrere Fackeln und übersichtliche Arbeitsplätze liegen vor ihnen. Nichts erinnert mehr an die störenden Wasserflächen."},{"type":"dialogue","speaker":"eckart","lines":["Äh, Meister? WO IS DAT GANZE WASSER HIN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN FÜR WASSER, ECKAT? DAT IS DOCH NICH MEHR DA!"]},{"type":"dialogue","speaker":"werner","lines":["Hömma! Hier kann man ja plötzlich laufen, ohne Schwimmflügel anzuziehen!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rostigen Rasselketten! Welch eine Verwandlung! Das ist ja beinahe eine ehrwürdige Forschungsanstalt!"]},{"type":"dialogue","speaker":"leader","lines":["Genau das war der Plan. Ich habe das Wasser entfernt, die Zugänge verbessert und die Werkstatt neu angeordnet."]},{"type":"dialogue","speaker":"eckart","lines":["Ja, aber ... WOHIN haben Sie dat Wasser gebracht?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT WASSER HAT NICH GEKÜNDIGT UND AUCH KEINE NEUE ADRESSE HINTERLASSEN!"]},{"type":"narration","text":"Werner lacht so laut, dass er sich am nächsten Arbeitstisch festhalten muss. Professor Kupferstein geht inzwischen langsam durch den Raum und begutachtet die Umbauten."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Arbeitswege sind deutlich übersichtlicher. Und die geringere Raumhöhe ist offenbar eine bewusste Entscheidung."]},{"type":"dialogue","speaker":"leader","lines":["Richtig. Wir hatten schließlich schon Probleme mit Endermen. Deshalb habe ich den Raum verkleinert und die Maschinen möglichst platzsparend angeordnet."]},{"type":"narration","text":"Eckart starrt an die niedrige Decke."},{"type":"dialogue","speaker":"eckart","lines":["Meister, heißt dat, die Endermen müssen jetzt draußen bleiben?"]},{"type":"dialogue","speaker":"werner","lines":["Na, Eckat, vielleicht müssen sie an der Tür erst den Kopf einziehen!"]},{"type":"dialogue","speaker":"roehrig","lines":["UND DU ZIEHST JETZT MAL DEINEN EIGENEN KOPF EIN, WERNER!"]},{"type":"narration","text":"Der Forschungsleiter kann sich ein Lachen nicht verkneifen. So ordentlich der Raum nun auch aussieht: Seine Kollegen haben sich kein bisschen verändert."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Der Erzwäscher und die große Wasserfrage","subtitle":"Teil 3: Eine tiefergelegte Maschine und sechs sehr unterschiedliche Meinungen","blocks":[{"type":"narration","text":"Dann fällt Hui Buhs Blick auf das große, bekannte Gesicht einer Maschine in der Werkstatt. Er bleibt davor schweben und legt den Kopf schief."},{"type":"dialogue","speaker":"huibuh","lines":["Moment! Dieses Gesicht kenne ich doch! Aber ... stand das nicht vorher ein wenig höher?"]},{"type":"dialogue","speaker":"doofen","lines":["Eine schrecklich geniale Idee! Ein tiefergelegter Maschinenwächter! Daraus könnte ich einen Alles-beobachten-und-den-Nachbarn-erschrecken-Inator entwickeln!"]},{"type":"dialogue","speaker":"leader","lines":["Nein, Herr Doktor. Das ist nach wie vor unser altbekannter Erzwäscher. Ich habe lediglich seinen Kessel ein Stück in den Boden eingesetzt, damit die gesamte Maschine bei der niedrigen Decke weniger weit nach oben ragt."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine vernünftige bauliche Anpassung. Die Maschine bleibt dieselbe; nur ihre Aufstellung wurde verändert."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER ERZWÄSCHER IS TIEFERGELEGT!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT HAM WA GERADE GEHÖRT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Fehlen bloß noch die breiten Reifen und 'n Auspuff!"]},{"type":"dialogue","speaker":"doofen","lines":["Ein Erzwäscher mit Sportfahrwerk! Hervorragend! Das könnte sogar mein nächster Inator werden!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU MACHST AN DEM DING GAR NIX!"]},{"type":"narration","text":"Der Forschungsleiter zeigt den Kollegen anschließend den Weg in den hinteren Raum. Dort befindet sich weiterhin der Cobblestone-Generator, ordentlich vom übrigen Werkstattbereich getrennt."},{"type":"dialogue","speaker":"leader","lines":["Hier hinten steht unser Cobblestone-Generator. An ihm habe ich jetzt keinen neuen Versuch durchgeführt. Es geht nur darum, dass wir besser an alles herankommen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Sehr gut. Wir trennen also die bauliche Verbesserung von den eigentlichen Funktionstests. Das sollte auch in unseren Aufzeichnungen so stehen."]},{"type":"dialogue","speaker":"eckart","lines":["Und wenn hier wieder Wasser auftaucht?"]},{"type":"dialogue","speaker":"werner","lines":["Denn kriegt's 'n eigenes Zimmer, Eckat!"]},{"type":"narration","text":"Als Nächstes geht es zum Schmelzkessel. Sein dunkler, oben offener Kessel steht an seinem vorgesehenen Platz im trockenen Arbeitsbereich."},{"type":"dialogue","speaker":"leader","lines":["Und hier haben wir unseren Schmelzkessel. Auch der gehört natürlich weiterhin zur Werkstatt. Ich habe die Umgebung freigeräumt, damit wir uns bei der Arbeit nicht gegenseitig auf die Füße treten."]},{"type":"dialogue","speaker":"huibuh","lines":["Wie wohltuend! Eine Werkstatt, in der man umhergeistern kann, ohne plötzlich in einem Wasserbecken gespiegelt zu werden!"]},{"type":"dialogue","speaker":"doofen","lines":["Ich könnte den Schmelzkessel mit einem automatischen Konfettiwerfer kombinieren. Für besonders feierliche Metallverarbeitung!"]},{"type":"dialogue","speaker":"roehrig","lines":["WENN DU DA KONFETTI REINWIRFST, SCHMELZ ICH DIR DEINEN INATOR GLEICH MIT EIN!"]},{"type":"narration","text":"Eckart entdeckt unterdessen die Eisentür und ihren Knopf. Er nähert sich langsam, als wäre er einem kostbaren wissenschaftlichen Fundstück auf der Spur."},{"type":"dialogue","speaker":"eckart","lines":["Meister?"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber ich hab doch noch gar nix gesagt!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU STEHST VOR 'NEM KNOPF, ECKAT! DAT REICHT MIR SCHON!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Pass auf, Eckat, dat is bestimmt die Klingel vom Finanzamt!"]},{"type":"dialogue","speaker":"eckart","lines":["Echt jetzt?!"]},{"type":"dialogue","speaker":"roehrig","lines":["WERNER! HÖR AUF, DEM JUNGEN SO 'N BLÖDSINN ZU ERZÄHLEN!"]},{"type":"narration","text":"Schließlich versammelt der Forschungsleiter seine Kollegen wieder in der Werkstatt. Der Regen draußen hat nachgelassen, und die Fackeln werfen warmes Licht auf den frisch geordneten Steinboden."},{"type":"dialogue","speaker":"leader","lines":["Nun, meine lieben Freunde. Was sagt ihr zu unserer neuen Werkstatt?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine sehr gelungene Verbesserung. Für unsere kommenden Versuche haben wir jetzt wesentlich übersichtlichere Arbeitsbedingungen."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein prachtvolles unterirdisches Refugium! Ich bin begeistert!"]},{"type":"dialogue","speaker":"werner","lines":["Jo, saubere Arbeit. Endlich keine Schwimmwesten mehr beim Handwerken!"]},{"type":"dialogue","speaker":"doofen","lines":["Großartig! Und ich habe schon siebenundvierzig Vorschläge, wie man alles wieder umbauen könnte!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN!"]},{"type":"dialogue","speaker":"doofen","lines":["Aber Sie kennen die Vorschläge doch noch gar nicht!"]},{"type":"dialogue","speaker":"roehrig","lines":["DAT MACHT'S JA GERADE SO GEFÄHRLICH!"]},{"type":"narration","text":"Meister Röhrich betrachtet die niedrige Decke, den tiefer eingesetzten Erzwäscher und die ordentlich verteilten Arbeitsplätze. Schließlich nickt er anerkennend."},{"type":"dialogue","speaker":"roehrig","lines":["Also, Herr Forschungsleiter, dat muss ich Ihnen lassen: Dat ham Sie ordentlich hingekriegt. Hier kann man endlich wieder vernünftig arbeiten."]},{"type":"dialogue","speaker":"leader","lines":["Vielen Dank, Meister Röhrich. Dann können wir ja bald unsere nächsten Experimente beginnen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER!"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN NU NOCH?!"]},{"type":"dialogue","speaker":"eckart","lines":["Wenn die Werkstatt jetzt ganz trocken is ... wo sollen wir denn dann die Fische halten?"]},{"type":"narration","text":"Absolute Stille. Professor Kupferstein lässt sein Notizbuch sinken. Hui Buh bleibt mitten in der Luft stehen. Werner prustet los."},{"type":"dialogue","speaker":"doofen","lines":["Fische? Natürlich! Mein neuer Fisch-auf-Knopfdruck-Inator!"]},{"type":"dialogue","speaker":"roehrig","lines":["EEEECKAAAAAT!!!"]},{"type":"narration","text":"Und während Werner vor Lachen kaum noch stehen kann, ist eines sicher: Die neue Aygon-Werkstatt ist trocken, niedriger, besser organisiert und bereit für die nächste Forschung. Gegen das Chaos ihrer Bewohner hilft allerdings auch der beste Umbau nicht."},{"type":"end","text":"Ende des ersten Werkstattkapitels"}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Wozu hatten wir eigentlich den Steingenerator gebaut?","subtitle":"Teil 1: Ein Forschungsleiter sucht den roten Faden","blocks":[{"type":"narration","text":"In der neu eingerichteten Aygon-Werkstatt ist wieder Ruhe eingekehrt. Der Erzwäscher steht tiefer im Boden, der Schmelzkessel an seinem Platz und der Cobblestone-Generator wartet im hinteren Raum auf Arbeit. Doch der Forschungsleiter steht nachdenklich vor seinen Kollegen."},{"type":"dialogue","speaker":"leader","lines":["Nun gut, meine Herren! Der Umbau ist gelungen. Aber ich habe eine Frage: Wo waren wir eigentlich mit unserer Forschung stehen geblieben? Ich erinnere mich noch an den Cobblestone-Generator, nur nicht mehr daran, weshalb wir ihn gebaut haben."]},{"type":"narration","text":"Professor Kupferstein legt seinen Stift zur Seite. Werner stellt die Kaffeetasse ab. Eckart reißt die Augen auf."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER CHEF HAT VERGESSEN, WARUM WIR STEINE MACHEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU VERGISST DOCH SELBER MANCHMAL, WARUM DU 'N RAUM BETRETEN HAST!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hol mal die Forschungsakten, Kupferstein, bevor Eckat anfängt, jeden Bruchstein einzeln zu verhören!"]},{"type":"narration","text":"Professor Kupferstein zieht das Forschungsjournal heran und schlägt die Seiten über die letzten Arbeiten auf."},{"type":"dialogue","speaker":"kupferstein","lines":["Der Cobblestone-Generator wurde gebaut, damit wir Bruchstein fortlaufend gewinnen können, ohne jedes Mal neue Vorkommen suchen zu müssen. Das Auffangsystem hatten wir bereits erprobt: Bei einem dokumentierten Test wurden siebzehn Bruchsteine abgebaut und alle siebzehn eingesammelt."]},{"type":"dialogue","speaker":"leader","lines":["Ach ja! Und die Steine waren nicht einfach nur für die Bauarbeiten gedacht."]},{"type":"dialogue","speaker":"kupferstein","lines":["Richtig. Wir brauchten eine dauerhafte Rohstoffquelle für weitere Verarbeitungsschritte und schließlich für unseren geplanten Erzbrecher. Dafür fehlten uns noch bestimmte Bauteile."]},{"type":"dialogue","speaker":"doofen","lines":["Ein Erzbrecher? Ich hätte da auch einen ALLES-ZU-KIESELZERKLEINER-INATOR! Er besitzt sogar einen Hebel, der absolut nichts bewirkt!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN LASS DEN HEBEL AUCH IN RUHE!"]},{"type":"narration","text":"Der Professor blättert weiter. In den Notizen stehen bereits hergestellte Eisengitter, die beschafften Fäden und die noch offenen Netherziegel-Bauteile."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Eisengitter wurden bereits hergestellt. Auch unsere Spinnenexpedition zur Beschaffung weiterer Fäden ist abgeschlossen. Der nächste Engpass war die Netherziegelverarbeitung. Wir sollten also zuerst die dafür benötigten Rohstoffe herstellen."]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen rostigen Rasselketten! Ein Forschungsjournal, das gegen Gedächtnislücken hilft. Welch vortreffliche Erfindung!"]},{"type":"dialogue","speaker":"werner","lines":["Jo, solange Eckat dat Buch nich aus Versehen in den Ofen steckt!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WER STECKT DENN 'N BUCH IN DEN OFEN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WENN DU SCHON SO FRAGST, KRIEG ICH ANGST!"]},{"type":"narration","text":"Der Forschungsleiter betrachtet den Gang zum Generator und muss grinsen. Der rote Faden ist wiedergefunden. Es fehlt jetzt nicht an Ideen, sondern an Material."},{"type":"dialogue","speaker":"leader","lines":["Dann wissen wir ja wieder, weshalb wir so viel Bruchstein brauchen. An die Arbeit, meine Freunde!"]},{"type":"narration","text":"Professor Kupferstein trägt das nächste Vorhaben sorgfältig ein: Bruchstein zu Stein brennen, den Stein wie vorgesehen im Komposter zu Netherrack verarbeiten und daraus die benötigten Netherziegel gewinnen."}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Fünfundzwanzig Steine und eine zerbrochene Spitzhacke","subtitle":"Teil 2: Der Ofen glüht, der Generator liefert und der Komposter überrascht","blocks":[{"type":"narration","text":"Wenig später brennt in der Forschungswerkstatt der Ofen. Der Forschungsleiter hat fünfundzwanzig Bruchsteine hineingelegt. Kohle sorgt für die nötige Hitze."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren! Während die Steine brennen, kann ich gleich neuen Bruchstein beschaffen. Wir wollen die Wartezeit ja nicht vertrödeln."]},{"type":"dialogue","speaker":"werner","lines":["Joa! Der Ofen arbeitet, du arbeitest, und Eckat ... na, der könnte vielleicht mal das Arbeiten beobachten!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH KANN AUCH ARBEITEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN HÖR AUF ZU BRÜLLEN UND LASS DEN GENERATOR IN RUHE LAUFEN!"]},{"type":"narration","text":"Der Forschungsleiter geht in den hinteren Raum zum Cobblestone-Generator. Immer wieder baut er nachwachsenden Bruchstein ab, während der Ofen in der Werkstatt weiterglüht. Die Zeit vergeht. Schließlich gibt die Spitzhacke ihren letzten Schlag ab und zerbricht."},{"type":"dialogue","speaker":"leader","lines":["Na wunderbar. Die Spitzhacke ist hinüber. Dann schauen wir doch einmal, was unser Generator in der Zwischenzeit geliefert hat."]},{"type":"narration","text":"In der Auffangtruhe liegen siebenundfünfzig Bruchsteine. Der Forschungsleiter sieht zufrieden auf den Vorrat."},{"type":"dialogue","speaker":"kupferstein","lines":["Siebenundfünfzig Bruchsteine in der Truhe. Das ist ein erfreulicher Zwischenstand. Die Werkzeughaltbarkeit sollten wir für spätere Arbeitsabläufe allerdings im Blick behalten."]},{"type":"dialogue","speaker":"doofen","lines":["Werkzeughaltbarkeit? Genau dafür habe ich meinen NIE-WIEDER-EINE-SPITZHACKE-ANFASSEN-INATOR entworfen!"]},{"type":"dialogue","speaker":"werner","lines":["Und wat macht der?"]},{"type":"dialogue","speaker":"doofen","lines":["Das weiß ich noch nicht. Aber der Name ist hervorragend!"]},{"type":"dialogue","speaker":"roehrig","lines":["ERST MAL BRAUCHEN WIR 'NE NORMALE NEUE SPITZHACKE!"]},{"type":"narration","text":"Als der Forschungsleiter zum Ofen zurückkehrt, müssen nur noch fünf der ursprünglich fünfundzwanzig Bruchsteine gebrannt werden. Kurz darauf ist der Durchlauf vollständig abgeschlossen. Fünfundzwanzig Steine sind fertig."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön. Alle fünfundzwanzig Steine sind durchgebrannt. Jetzt folgt unser nächster Verarbeitungsschritt im Komposter."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! STEINE IN 'N KOMPOSTER? DAT IS DOCH KEIN GEMÜSE!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IS UNSERE FORSCHUNG, NICH DEIN SALATBEET!"]},{"type":"narration","text":"Der Forschungsleiter verarbeitet die fünfundzwanzig Steine im Komposter. Am Ende liegen sechs Netherrack vor ihm. Ein weiterer tatsächlich durchgeführter Schritt ist erfolgreich dokumentiert."},{"type":"dialogue","speaker":"kupferstein","lines":["Ergebnis des Versuchs: fünfundzwanzig gebrannte Steine eingesetzt, sechs Netherrack erhalten. Ein Stein bleibt bei der rechnerischen Zuordnung von vier Steinen pro Netherrack übrig. Die Ausbeute dieses Durchlaufs ist bestätigt."]},{"type":"dialogue","speaker":"huibuh","lines":["Welch wundersame Verwandlung! Erst ein grauer Stein, dann ein gebrannter Stein, und nun etwas, das nach einem Ausflug in die Unterwelt aussieht!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hauptsache, Eckat steckt nicht als Nächstes seinen Stiefel in den Komposter!"]},{"type":"dialogue","speaker":"eckart","lines":["Wieso sollte ich dat denn machen?"]},{"type":"dialogue","speaker":"roehrig","lines":["FRAG DAT LIEBER NICH, ECKAT!"]},{"type":"narration","text":"Professor Kupferstein notiert die Zahlen sorgfältig: fünfundzwanzig Steine verarbeitet, sechs Netherrack gewonnen, eine Spitzhacke beim Nachschubabbau verschlissen. Die eigentliche Herstellung der Netherziegel steht noch aus."}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Werner, die Kohle und die vier fehlenden Netherrack","subtitle":"Teil 3: Materialrechnung statt Inator, der nächste Ofendurchlauf ist vorbereitet","blocks":[{"type":"narration","text":"Noch ehe jemand den nächsten Ofen beschickt, hebt der Forschungsleiter die Hand. Er erinnert seine Kollegen an eine Rechnung, die längst im Forschungsjournal stehen müsste."},{"type":"dialogue","speaker":"leader","lines":["Mein lieber Herr Doktor Kupferstein, wir hatten den Materialbedarf doch schon früher nachgeschaut! Für den Erzbrecher brauchen wir einen Netherziegelzaun, einen Dispenser und zwei Eisengitter."]},{"type":"narration","text":"Professor Kupferstein sieht nach und nickt. Die Angaben für den Netherziegelzaun sind ebenfalls bereits festgehalten."},{"type":"dialogue","speaker":"leader","lines":["Für den Zaun brauchen wir zwei einzelne Netherziegel und zwei Netherziegelblöcke. In jedem Block stecken vier Netherziegel. Das macht insgesamt zehn."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ganz richtig. Zwei plus zweimal vier ergibt zehn Netherziegel. Da wir bisher sechs Netherrack hergestellt haben, fehlen uns noch vier Stück für diese Materialplanung."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DEM CHEF FEHLEN VIER STEINE!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN, ECKAT! VIER NETHERRACK! DAT IS NICHT DATSELBE!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Und du brauchst auch nich versuchen, die vier aus dem Boden zu schütteln!"]},{"type":"narration","text":"Der Forschungsleiter betrachtet seinen neuen Bruchsteinvorrat. Er hat fünfundfünfzig Blöcke für den nächsten Ofendurchlauf vorgesehen. Im Ofen sind noch vier Stück Kohle vorhanden."},{"type":"dialogue","speaker":"leader","lines":["Dann würde ich jetzt die fünfundfünfzig Bruchsteine in den Ofen geben. Mal sehen, ob die vier Kohle wenigstens genug Stein für die fehlenden vier Netherrack liefern. Werner, du bist doch unser Rechengenie!"]},{"type":"narration","text":"Werner zieht einen Bleistift hervor und malt vier große Kreise auf ein Stück Papier."},{"type":"dialogue","speaker":"werner","lines":["Na, Chef, dat is einfach: Ein Netherrack kostet vier Steine. Vier Netherrack mal vier Steine macht sechzehn. Dafür brauchen wir sechzehn gebrannte Steine."]},{"type":"dialogue","speaker":"kupferstein","lines":["Und ein Stück Kohle reicht im gewöhnlichen Ofen für acht Schmelzvorgänge. Zwei Kohle genügen also für sechzehn Bruchsteine. Vier Kohle könnten insgesamt zweiunddreißig Bruchsteine schmelzen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DANN REICHT DAT JA!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND WAT FÜR 'N WUNDER: WIR HABEN HEUTE SOGAR OHNE EXPLOSION GERECHNET!"]},{"type":"dialogue","speaker":"doofen","lines":["Ohne Explosion? Wie enttäuschend. Ich könnte den Ofen mit meinem UNENDLICH-KOHLE-AUS-DEM-NICHTS-INATOR verbessern!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dann lass uns erst mal gucken, ob du überhaupt Kohle von Konfetti unterscheiden kannst!"]},{"type":"dialogue","speaker":"huibuh","lines":["Wie beruhigend! Ein gewaltiger Vorrat Bruchstein, ein planvoller Forschungsleiter und ein Ofen, der nur noch angefeuert werden muss. Ich halte mich vorsichtshalber trotzdem in der Nähe des Ausgangs auf!"]},{"type":"narration","text":"Professor Kupferstein notiert die Rechnung unter dem letzten Versuch: vier weitere Netherrack erfordern bei der besprochenen Umwandlung sechzehn gebrannte Steine. Vier Stück Kohle hätten dafür genügend Brenndauer. Ein neuer Schmelz- oder Komposterdurchlauf wurde an dieser Stelle aber noch nicht als abgeschlossen gemeldet."},{"type":"dialogue","speaker":"kupferstein","lines":["Damit sind unsere nächsten Handgriffe klar. Zuerst die fehlenden sechzehn Steine bereitstellen und in vier weitere Netherrack umwandeln. Erst danach prüfen wir die Herstellung der Netherziegel und schließlich des Netherziegelzauns."]},{"type":"dialogue","speaker":"leader","lines":["Ausgezeichnet, meine Freunde! Dann haben wir endlich wieder einen vernünftigen Arbeitsplan."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! UND WER MACHT DIE NÄCHSTE SPITZHACKE?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IST JETZT DEINE ERSTE VERNÜNFTIGE FRAGE!"]},{"type":"narration","text":"Werner lacht, Professor Kupferstein lächelt zufrieden, und irgendwo hinter der Werkstatt wartet der Cobblestone-Generator geduldig auf seinen nächsten Einsatz. Der Forschungsfaden ist wieder aufgenommen."},{"type":"end","text":"Fortsetzung folgt: Die fehlenden Netherziegel"}]},{"chapter":"Hörspiel-Test","title":"Die Sache mit dem Schraubenschlüssel","subtitle":"Ein kurzer Stimmtest mit unserem Forschungsteam · keine neue Forschung","blocks":[{"type":"narration","text":"Ein leises Klirren hallt durch die Werkstatt. Meister Röhrig starrt auf den Arbeitstisch. Eckart steht neben ihm und versucht, möglichst unschuldig auszusehen."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! Wo is denn nu schon wieder mein Schraubenschlüssel?!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch inner Hand!"]},{"type":"narration","text":"Werner lehnt sich grinsend gegen eine Kiste. Professor Kupferstein hebt langsam den Blick von seinen Unterlagen."},{"type":"dialogue","speaker":"werner","lines":["Jau, Röhrig. Manchmal is dat Werkzeug näher als man denkt!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, könnten wir wenigstens einen einzigen Morgen ohne Werkzeugdiskussion beginnen?"]},{"type":"dialogue","speaker":"doofen","lines":["Ausgezeichnet! Dann stelle ich euch meinen völlig neuen Schraubenschlüssel-Such-INATOR vor!"]},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei meinen klappernden Ritterrüstungen! Hier braucht man wahrlich keine Geister, um Dinge verschwinden zu lassen!"]},{"type":"narration","text":"Eckart betrachtet den Schlüssel in der Hand des Meisters. Werner lacht leise. Für einen Augenblick herrscht Frieden im Labor."},{"type":"end","text":"Ende der Hörspielprobe"}]}];

const CAST_PROFILES={
 narrator:{name:'Erzähler',pitch:1,rate:.92,prefer:'warm',gender:'neutral'},
 kupferstein:{name:'Prof. Kupferstein',pitch:.93,rate:.91,prefer:'m',gender:'male'},
 roehrig:{name:'Meister Röhrig',pitch:.81,rate:1.02,prefer:'m',gender:'male'},
 eckart:{name:'Eckart',pitch:1.17,rate:1.07,prefer:'m',gender:'male'},
 werner:{name:'Werner',pitch:.92,rate:1.12,prefer:'m',gender:'male'},

 huibuh:{name:'Hui Buh',pitch:.84,rate:.88,prefer:'m',gender:'male'}
};
const roleChoices={};
const roleHints={narrator:'Warm, ruhig',kupferstein:'Sachlich, bedacht',roehrig:'Kernig und laut',eckart:'Jugendlich, etwas nervös',werner:'Locker und flott',doofen:'Aufgedreht und exzentrisch',huibuh:'Tief und theatralisch'};
const castMode=document.getElementById('cast-mode');
function germanVoices(){return lastVoiceList.filter(v=>/^de(?:-|$)/i.test(v.lang))}
function voiceForRole(key){
 const available=germanVoices();const chosen=lastVoiceList.find(v=>v.voiceURI===roleChoices[key]);
 if(chosen)return chosen;
 const basic=lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(!available.length)return basic||null;
 const idx={narrator:0,kupferstein:1,roehrig:2,eckart:3,werner:4,doofen:5,huibuh:6}[key]||0;
 return available[idx%available.length];
}
function openCasting(){
 const modal=elt('div');add(modal,elt('h2','','🎭 Rollenbesetzung'),elt('p','','Für jede Figur kannst du eine verfügbare deutsche Browserstimme wählen. Auch bei nur einer Stimme unterscheiden sich Tonhöhe und Tempo. Das sind keine aufgenommenen Synchronstimmen.'));
 const voices=germanVoices();
 if(!voices.length)modal.appendChild(elt('p','','Keine deutschen Stimmen erkannt. Die Systemstimme wird verwendet.'));
 const list=elt('div','casting-grid');
 for(const [key,profile] of Object.entries(CAST_PROFILES)){
  const row=elt('div','casting-row'); const left=elt('div');add(left,elt('strong','',profile.name),elt('small','',roleHints[key]));
  const sel=elt('select');sel.setAttribute('aria-label','Stimme für '+profile.name);
  sel.appendChild(new Option('Automatische Besetzung',''));
  for(const voice of voices)sel.appendChild(new Option(`${voice.name} (${voice.lang})`,voice.voiceURI));
  sel.value=roleChoices[key]||'';
  sel.addEventListener('change',()=>{roleChoices[key]=sel.value});
  const preview=elt('button','audio-btn','▶ Test');preview.type='button';preview.onclick=()=>{
    if(!speakEngine)return;stopReading();
    const ut=new SpeechSynthesisUtterance(key==='narrator'?'Tief unter der Minecraft-Welt liegt das Aygon-Forschungslabor.':key==='roehrig'?'Eckart! Wo ist denn mein Schraubenschlüssel?':key==='eckart'?'Aber Meister, den ham Sie doch in der Hand!':key==='huibuh'?'Bei meinen klappernden Ritterrüstungen!':`Guten Morgen! Hier spricht ${profile.name}.`);
    const picked=voiceForRole(key);if(picked){ut.voice=picked;ut.lang=picked.lang}else ut.lang='de-DE';
    ut.pitch=profile.pitch;ut.rate=profile.rate*(parseFloat(speedChoice.value)||1);
    speakEngine.speak(ut);
  };
  add(row,left,sel,preview);list.appendChild(row)
 }
 modal.appendChild(list);openModal(modal);
}

let speechSession=0, speechItems=[], speechCursor=0, speechRunning=false, speechPaused=false, lastVoiceList=[];

 readButton.disabled=!synthesisSupported||current<0;
 pauseButton.disabled=!synthesisSupported||!speechRunning;
 stopButton.disabled=!synthesisSupported||!speechRunning;
 pauseButton.textContent=speechPaused?'▶ Fortsetzen':'⏸ Pause';

}
function stopReading(){
 speechSession++; speechRunning=false;speechPaused=false;speechItems=[];speechCursor=0;
 if(speakEngine){try{speakEngine.cancel()}catch(error){}}
 clearSpeaking();setAudioStatus(synthesisSupported?'Bereit zum Vorlesen':'Keine Sprachausgabe verfügbar');updateAudioButtons();
}
function populateVoices(){
 if(!speakEngine)return;
 const all=speakEngine.getVoices();
 if(!all.length){voiceChoice.replaceChildren(new Option('Systemstimme (automatisch)',''));return}
 lastVoiceList=all;
 const prev=voiceChoice.value;
 const sorted=[...all].sort((a,b)=>{const aDe=a.lang.toLowerCase().startsWith('de')?0:1;const bDe=b.lang.toLowerCase().startsWith('de')?0:1;return aDe-bDe||a.name.localeCompare(b.name)});
 voiceChoice.replaceChildren(...sorted.map(v=>new Option(`${v.name} (${v.lang})`,v.voiceURI)));
 let chosen=sorted.find(v=>v.voiceURI===prev) || sorted.find(v=>v.lang.toLowerCase()==='de-de') || sorted.find(v=>v.lang.toLowerCase().startsWith('de')) || sorted[0];
 voiceChoice.value=chosen.voiceURI;
}
function collectSpeechItems(){
 const out=[];
 // Die visuellen Abschnitte liefern die Reihenfolge. Jedes Sprecherporträt bleibt im Text sichtbar.
 for(const el of root.querySelectorAll('.narration,.dialogue')){
   if(el.classList.contains('narration')){out.push({element:el,text:el.textContent.trim(),role:"narrator"})}
   else{
     const who=el.querySelector('.speaker')?.textContent.trim()||'';
     const words=[...el.querySelectorAll('.speech p')].map(x=>x.textContent.trim()).filter(Boolean).join(' ');
     out.push({element:el,text:words,role:el.querySelector(".speaker")?.textContent.trim()===CAST.kupferstein.name?"kupferstein":Object.keys(CAST).find(key=>CAST[key].name===who)||"narrator",who});
   }
 }
 return out.filter(item=>item.text);
}
function speakNext(session){
 if(session!==speechSession||!speechRunning)return;
 clearSpeaking();
 if(speechCursor>=speechItems.length){
    const shouldContinue=autoNext.checked&&current<PAGES.length-1;
    speechRunning=false; speechPaused=false;
    if(shouldContinue){go(current+1);playReading();return}
    setAudioStatus('Seite vollständig vorgelesen');updateAudioButtons();return;
 }
 const item=speechItems[speechCursor];
 item.element.classList.add('speaking-block');
 // Leseabschnitt nur dann sichtbar machen, wenn er außerhalb des Fensters liegt.
 const rect=item.element.getBoundingClientRect();
 if(rect.bottom>window.innerHeight-40||rect.top<85)item.element.scrollIntoView({behavior:'smooth',block:'center'});
 const utterance=new SpeechSynthesisUtterance(item.text);
 utterance.lang='de-DE';utterance.rate=parseFloat(speedChoice.value)||1;utterance.pitch=1;utterance.volume=1;
 const profile=CAST_PROFILES[item.role]||CAST_PROFILES.narrator;
 const chosen=castMode.checked?voiceForRole(item.role):lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(castMode.checked){utterance.pitch=profile.pitch;utterance.rate=(parseFloat(speedChoice.value)||1)*profile.rate;}
 if(chosen){utterance.voice=chosen;utterance.lang=chosen.lang;}
 utterance.onstart=()=>{if(session!==speechSession)return;setAudioStatus(`Abschnitt ${speechCursor+1} von ${speechItems.length}`)};
 utterance.onend=()=>{if(session!==speechSession)return;speechCursor++;speakNext(session)};
 utterance.onerror=(event)=>{
   if(session!==speechSession)return;
   if(event.error==='canceled'||event.error==='interrupted')return;
   speechRunning=false;speechPaused=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe fehlgeschlagen: '+(event.error||'unbekannter Fehler'));
 };
 try{speakEngine.speak(utterance)}catch(err){speechRunning=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe konnte nicht starten')}
}
function playReading(){
 if(!synthesisSupported){setAudioStatus('Dieser Browser unterstützt keine Vorlesefunktion');return}
 if(current<0){go(0)}
 stopReading();
 // Eine deutsche Stimme kann auch erst nach dem Laden des Buchs erscheinen.
 populateVoices();
 speechItems=collectSpeechItems();speechCursor=0;
 if(!speechItems.length){setAudioStatus('Auf dieser Seite gibt es keinen Vorlesetext');return}
 speechRunning=true;speechPaused=false;const session=speechSession;
 updateAudioButtons();setAudioStatus('Vorlesen wird gestartet …');speakNext(session);
}
readButton.addEventListener('click',playReading);
pauseButton.addEventListener('click',()=>{
 if(!speechRunning||!speakEngine)return;
 if(speechPaused){speakEngine.resume();speechPaused=false;setAudioStatus('Vorlesen fortgesetzt')}
 else{speakEngine.pause();speechPaused=true;setAudioStatus('Vorlesen pausiert')}
 updateAudioButtons();
});
stopButton.addEventListener('click',stopReading);
if(speakEngine){populateVoices();if(speakEngine.addEventListener)speakEngine.addEventListener('voiceschanged',populateVoices)}
else{setAudioStatus('Sprachausgabe hier nicht verfügbar');voiceChoice.disabled=true;speedChoice.disabled=true;autoNext.disabled=true}
updateAudioButtons();

</script>
