{"type":"narration","text":"Der Forschungsleiter nimmt den fertigen Werfer aus dem Inventar und stellt ihn mittig an die vorgesehene Stelle in der Kammer."},{"type":"dialogue","speaker":"leader","lines":["In die Mitte kommt zuerst unser Werfer."]},{"type":"narration","text":"KLACK! Der Werfer sitzt."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Grundkomponente steht. Jetzt folgen die Eisengitter."]},{"type":"dialogue","speaker":"leader","lines":["Daneben kommen unsere zwei Eisengitter."]},{"type":"narration","text":"KLACK! KLACK! Die seitlichen Metallgitter stehen an ihren Positionen."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAT SIEHT JA SCHON WIE 'NE RICHTIGE MASCHINE AUS!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! WEIL DAT EINE WERDEN SOLL!"]},{"type":"narration","text":"Schließlich nimmt der Forschungsleiter einen Netherziegelzaun in die Hand. Der dunkle Zaun bildet das letzte Teil der Multiblock-Konstruktion."},{"type":"dialogue","speaker":"leader","lines":["Und nun, meine Herren, setzen wir den Netherziegelzaun oben drauf. Aufgepasst!"]},{"type":"narration","text":"KLACK! Der Zaun wird platziert. Im selben Moment erscheint eine grüne Meldung im Minecraft-Chat: „Zusammengebaut: Erzbrecher“. Der Slimefun-Aufbau wurde erfolgreich erkannt."},{"type":"dialogue","speaker":"leader","lines":["ERFOLG, MEINE HERREN! WIR HABEN UNSEREN ERZBRECHER!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Die Erfolgsmeldung ist eindeutig: Die Multiblock-Konstruktion wurde korrekt zusammengesetzt und erkannt. Ein wichtiger Meilenstein!"]},{"type":"dialogue","speaker":"eckart","lines":["MEEEEISTER! DER GERÄT IS FERTIG!!!"]},{"type":"dialogue","speaker":"roehrig","lines":["JAAAA, ECKAT! ICH HAB'S GESEHEN!!!"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! NACH ALL DEM STEINEKLOPPEN STEHT DER GERÄT TATSÄCHLICH DA!"]},{"type":"dialogue","speaker":"doofen","lines":["Und ausgerechnet heute haben wir keinen einzigen meiner Inatoren benötigt. Eine bemerkenswerte Leistung!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rostigen Rasselketten! Die Aygon-Forschung hat ein weiteres technisches Wunderwerk hervorgebracht!"]},{"type":"narration","text":"Der Forschungsleiter blickt zufrieden auf den neuen Erzbrecher. Der Werfer bildet das Herzstück, zwei Eisengitter stehen daneben, darüber ragt der dunkle Netherziegelzaun. Um die Maschine herum erstreckt sich die frisch ausgehöhlte und beleuchtete Kammer."},{"type":"dialogue","speaker":"kupferstein","lines":["Man bedenke nur den Weg bis hierher: Bruchstein sammeln, Stein brennen, Netherrack herstellen, Netherziegel gewinnen, den falsch berechneten Zaun korrigieren, den Bogen anfertigen und Redstone aus Hui Buhs Schatzkammer holen ..."]},{"type":"dialogue","speaker":"eckart","lines":["UND HOLZ HOLEN! MIT 'NEM PHANTOM DRAUSSEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["UND DEN RAUM AUSKLÖPPEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Und jedes Mal is irgendwat anderes ausgegangen!"]},{"type":"dialogue","speaker":"huibuh","lines":["Doch all diese Mühen haben sich gelohnt."]},{"type":"dialogue","speaker":"doofen","lines":["Vor allem, weil es dabei erstaunlich wenige Explosionen gab!"]},{"type":"narration","text":"Ein kurzer, stolzer Augenblick der Ruhe erfüllt die Maschinenkammer. Dann meldet sich Professor Kupferstein erneut zu Wort."},{"type":"dialogue","speaker":"kupferstein","lines":["Herr Forschungsleiter, eine wichtige Unterscheidung sollten wir für unser Forschungsjournal festhalten: Der Erzbrecher ist erfolgreich aufgebaut. Seine eigentliche Funktion haben wir aber noch nicht praktisch getestet."]},{"type":"dialogue","speaker":"leader","lines":["Ganz richtig, Herr Professor. Der Aufbau ist geschafft. Der erste Verarbeitungstest kommt als Nächstes!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WAT MACHT DER GERÄT DENN EIGENTLICH?"]},{"type":"dialogue","speaker":"roehrig","lines":["DER GERÄT BRICHT ERZ, ECKAT!"]},{"type":"dialogue","speaker":"eckart","lines":["UND KRIEGT DER GERÄT DANN AUCH FEIERABEND?"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! DER GERÄT IST SCHWEISSFREI UND ARBEITET OHNE PAUSE!"]},{"type":"dialogue","speaker":"roehrig","lines":["EEEECKAAAAAT!"]},{"type":"narration","text":"Die Forschungskollegen lachen, während die Fackeln warm über die neue Maschine leuchten. Ein neuer Abschnitt der Aygon-Forschung kann beginnen. Der Aufbau ist erfolgreich bestätigt, der praktische Erzbrecher-Test bleibt noch offen."},{"type":"end","text":"Fortsetzung folgt: Der erste Funktionstest von „der Gerät“"}]},{"chapter":"Kapitel 5 · Sand, Seelensand und Geduld","title":"Der Gerät bekommt seine erste Arbeit","subtitle":"Ein funktionierender Aufbau ist noch lange kein Produktionstest.","blocks":[{"type":"narration","text":"Der frisch zusammengesetzte Erzbrecher steht in seiner eigenen Kammer. Der Forschungsleiter blickt auf die Maschine, dann auf die Steinbestände. Nach dem großen Bauprojekt soll nun endlich etwas produziert werden."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, der Erzbrecher ist aufgebaut. Aber jetzt soll er auch beweisen, dass er etwas kann! Für die Nether-Goldwaschpfanne brauchen wir Sand. Sehr viel Sand."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ganz richtig. Wir trennen in unserem Journal den erfolgreichen Aufbau von der tatsächlichen Herstellung. Bisher kennen wir nur die grüne Erfolgsmeldung."]},{"type":"dialogue","speaker":"eckart","lines":["Meister, wieso muss dat schöne Gerät denn jetzt schon wieder Steine fressen?"]},{"type":"dialogue","speaker":"roehrig","lines":["WEIL DAT 'N ERZBRECHER IS, ECKAT! WAT SOLL ER DENN SONST MACHEN? SUPPE KOCHEN?"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Steinbrechersuppe. Schön mit 'nem Löffel Kies."]},{"type":"narration","text":"Der Forschungsleiter hat fleißig vorgearbeitet. Drei Stapel Bruchstein liegen bereit. Vom vorigen Versuch befinden sich noch vier Bruchsteine in der Maschine. Ehe er die Produktion startet, prüft er den Inhalt und legt die Rohstoffe ein."},{"type":"dialogue","speaker":"leader","lines":["Drei Stacks Bruchstein kommen jetzt in den Erzbrecher. Und später kontrollieren wir genau, wie viel Sand wir daraus gewinnen."]},{"type":"narration","text":"Ein Klick auf den Netherziegelzaun setzt die Maschine in Gang. Metall schlägt dumpf auf Stein, ein raues Knirschen wandert durch die Kammer. Nach und nach wird der Vorrat kleiner."},{"type":"dialogue","speaker":"doofen","lines":["Eine vollautomatische Steinzermalmungsanlage! Fast so genial wie mein Stein-zu-Konfetti-INATOR. Wobei das Konfetti leider immer noch aus Stein besteht."]},{"type":"dialogue","speaker":"huibuh","lines":["Bei allen knirschenden Kerkertüren! Ich hoffe, Sie produzieren hier keine Staubwolke bis in meine Schatzkammer!"]},{"type":"dialogue","speaker":"leader","lines":["Wir werden sehen, was am Ende tatsächlich herauskommt. Hier wird nichts schöngerechnet."]},{"type":"narration","text":"Der erste Verarbeitungstest läuft. Die Forschungstruppe hat endlich einen praktischen Grund, dem Gerät einen eigenen Raum gegeben zu haben."}]},{"chapter":"Kapitel 5 · Sand, Seelensand und Geduld","title":"Neunzehnmal Sand und eine neue Hoffnung","subtitle":"Vom Bruchstein zur ersten Charge für die Nether-Wäsche","blocks":[{"type":"narration","text":"Als das letzte Rattern verstummt, öffnet der Forschungsleiter den Werfer und zeigt seinen Kollegen den Inhalt."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren. Wir haben jetzt neunzehn Sand. Das ist der Ertrag, den wir vor uns sehen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Dann notiere ich: Der Erzbrecher arbeitet und produziert Sand. Die genaue Ausbeute dieser Charge ist dokumentiert, nicht aus einer Rezeptbeschreibung geraten."]},{"type":"dialogue","speaker":"eckart","lines":["Neunzehn? Meister, dat klingt nach 'ner Menge!"]},{"type":"dialogue","speaker":"roehrig","lines":["FÜR 'NEN SANDKASTEN VIELLEICHT! WIR BRAUCHEN DEN KRAM DOCH FÜR DIE FORSCHUNG!"]},{"type":"dialogue","speaker":"werner","lines":["Immerhin muss keiner 'ne Wüste plündern. Das is doch schon mal wat."]},{"type":"narration","text":"Doch der Sand allein genügt nicht. Die geplante Nether-Goldwaschpfanne benötigt weitere Materialien. Im Lager liegt noch ein einzelner Netherziegel, aber die verlangten fünf sind damit längst nicht erreicht."},{"type":"dialogue","speaker":"leader","lines":["Wir haben noch einen Netherziegel übrig. Für die neue Goldwaschpfanne brauchen wir fünf und dazu unsere bisherige Goldwaschpfanne. Also werden noch welche hergestellt."]},{"type":"narration","text":"Wieder wird Netherrack vorbereitet, wieder wandert es durch den Ofen. Der Forschungsleiter besorgt das nötige Holz, als der Brennstoff zur Neige geht. Nach der zusätzlichen Runde hat die Gruppe genügend Netherziegel für den Bau."},{"type":"dialogue","speaker":"huibuh","lines":["Es ist wahrlich erstaunlich, wie oft wir für ein einziges Werkzeug den halben Berg umsortieren."]},{"type":"dialogue","speaker":"doofen","lines":["Ich könnte dafür den Nie-wieder-Holz-holen-INATOR erfinden! Ein kleiner Haken: Er benötigt zuerst fünfhundert Holzstämme."]},{"type":"dialogue","speaker":"eckart","lines":["Meister, den brauchen wir besser nich."]},{"type":"dialogue","speaker":"roehrig","lines":["DA HASTE AUSNAHMSWEISE RECHT, ECKAT!"]},{"type":"narration","text":"Draußen an der erweiterten Werkbank entsteht schließlich die Nether-Goldwaschpfanne. Sie ist nun tatsächlich hergestellt. Damit kann der nächste Verarbeitungsschritt beginnen."}]},{"chapter":"Kapitel 5 · Sand, Seelensand und Geduld","title":"Neun Seelensand und kein Leuchtsteinstaub","subtitle":"Der erste Versuch in der Nether-Goldwaschpfanne","blocks":[{"type":"narration","text":"Zurück im Labor legt der Forschungsleiter die Sandvorräte bereit und benutzt den Komposter, um Sand in Seelensand umzuwandeln."},{"type":"dialogue","speaker":"leader","lines":["Schaut her! Aus unserem Sand sind neun Seelensand geworden. Die bauen wir auf und benutzen jetzt die neue Nether-Goldwaschpfanne."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ein sauberer Versuch: Das Material ist vorhanden, das Werkzeug wurde hergestellt, nun beobachten wir das tatsächliche Ergebnis."]},{"type":"narration","text":"Die neun Blöcke werden gesetzt. Der Forschungsleiter geht mit der Pfanne von Block zu Block. Wo kurz zuvor noch dunkelbrauner Seelensand stand, erscheinen verarbeitete Gegenstände."},{"type":"dialogue","speaker":"eckart","lines":["Meeeeister? Is da Leuchtsteinstaub bei?"]},{"type":"dialogue","speaker":"roehrig","lines":["NU LASS DEN CHEF ERST MAL NACHGUCKEN, ECKAT!"]},{"type":"narration","text":"Der Forschungsleiter zählt die Beute sorgfältig durch. Andere Materialien sind dabei, unter anderem Netherquarz und Goldklumpen. Doch ausgerechnet das erhoffte Leuchtsteinstaubkorn fehlt."},{"type":"dialogue","speaker":"leader","lines":["Leider nein, meine Herren. Kein Leuchtsteinstaub. Der Versuch hat uns andere Materialien gebracht, aber nicht das, was wir für die Rüstung brauchen."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Dat is wohl die alte Forscherregel: Man kriegt alles, bloß nich dat, wat man gerade sucht."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein Jammer! Wäre es königliches Gold gewesen, hätte ich wenigstens einen Grund zur Freude."]},{"type":"dialogue","speaker":"kupferstein","lines":["Das Ergebnis ist nicht nutzlos. Wir haben die Nether-Goldwaschpfanne erfolgreich benutzt. Nur die gewünschte Ausbeute blieb bei diesem Durchgang aus."]},{"type":"dialogue","speaker":"leader","lines":["Genau. Funktioniert hat sie. Aber wir müssen offenbar noch einen anderen Weg finden, an genügend Seelensand oder Leuchtsteinstaub zu kommen."]},{"type":"narration","text":"So endet der erste Waschversuch mit einer wichtigen Erkenntnis: Die Technik funktioniert, der gesuchte Stoff ist jedoch noch nicht gewonnen."}]},{"chapter":"Kapitel 6 · Günther, Gold und Geduld","title":"Günther könnte unsere Rettung sein","subtitle":"Eine Alternative zum endlosen Steinabbau","blocks":[{"type":"narration","text":"Die Stimmung im Labor schwankt zwischen Entschlossenheit und Müdigkeit. Die nächste Ladung Seelensand würde erneut Bruchstein, Sand und Zeit verlangen. Da bringt der Forschungsleiter einen ungewöhnlichen Vorschlag vor."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir könnten wieder stundenlang Steine kloppen. Oder wir besuchen Günther. Er stammt aus dem Nether und handelt vielleicht mit Materialien, die wir gerade brauchen."]},{"type":"dialogue","speaker":"eckart","lines":["Den Günther? Unseren Günther? Den mit der langen Nase und den schlechten Manieren?"]},{"type":"dialogue","speaker":"werner","lines":["Jou, vielleicht hat er ja Leuchtsteinstaub hinterm Tresen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ein Versuch ist vertretbar. Doch halten wir fest: Welche Gegenstände Günther uns wirklich gibt, wissen wir erst nach dem Handel."]},{"type":"dialogue","speaker":"leader","lines":["Einen Stack Goldbarren lassen wir unberührt. Die anderen zweiunddreißig dürfen wir für die Forschung einsetzen."]},{"type":"dialogue","speaker":"huibuh","lines":["ZWEIUNDDREISSIG GOLD BARREN?! Bei den güldenen Kronjuwelen! Ich verlange wenigstens eine ordentliche Buchführung!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU HÖRST DEM SCHATZMEISTER ZU! KEIN GOLD INNE HOSENTASCHE STECKEN!"]},{"type":"dialogue","speaker":"eckart","lines":["ICH HAB DOCH GAR NIX GEMACHT, MEISTER!"]},{"type":"dialogue","speaker":"doofen","lines":["Handeln mit einem Netherbewohner! Das klingt nach meinem Zufallsbeute-INATOR. Der gibt für jedes Goldstück einen Gegenstand aus. Meistens einen gebrauchten Teelöffel."]},{"type":"narration","text":"Die Entscheidung ist gefallen. Statt die Arbeitsschritte künstlich in die Länge zu ziehen, will die Gruppe den vorhandenen Goldvorrat gezielt einsetzen. Ob daraus wirklich die gesuchten Stoffe werden, ist noch offen."}]},{"chapter":"Kapitel 6 · Günther, Gold und Geduld","title":"Zweiunddreißig Goldbarren für Günther","subtitle":"Regen, Tauschgeschäfte und eine erstaunliche Inventarliste","blocks":[{"type":"narration","text":"Draußen schlägt Regen auf den Waldboden. Der Forschungsleiter führt die Mannschaft an die Oberfläche, wo Günther in seiner steinernen Unterkunft wartet."},{"type":"dialogue","speaker":"leader","lines":["Hallo Günther! Wir kommen dich wieder besuchen. Wir möchten gern mit dir handeln. Vielleicht hast du etwas für unsere Forschung."]},{"type":"narration","text":"Günther mustert die Besucher schweigend. Sein Blick ruht auf dem Goldbarren. Dann dreht er sich um, nimmt das Gold an sich und wirft einen Gegenstand zurück."},{"type":"dialogue","speaker":"eckart","lines":["Na, wat isses? Wat hat er gegeben?"]},{"type":"dialogue","speaker":"leader","lines":["Eine Feuerkugel. Weiter geht's."]},{"type":"narration","text":"Goldbarren um Goldbarren wechselt den Besitzer. Es folgt Obsidian, später Kies, dann weitere Waren. Das Inventar wird voller, aber jeder einzelne Tausch bleibt ein kleines Glücksspiel."},{"type":"dialogue","speaker":"huibuh","lines":["Ich verfolge diese Transaktion mit allergrößter Aufmerksamkeit! Zweiunddreißig Goldbarren dürfen nicht einfach aus dem königlichen Register verschwinden!"]},{"type":"dialogue","speaker":"werner","lines":["Keine Sorge, Hui Buh. Dafür kriegste bestimmt 'nen schönen Stapel Kies."]},{"type":"dialogue","speaker":"huibuh","lines":["KIES?! FÜR GOLD?!"]},{"type":"narration","text":"Nach dem letzten Handel werden die Gegenstände geordnet und einzeln gezählt. Der Forschungsleiter verliest das vollständige Ergebnis."},{"type":"dialogue","speaker":"leader","lines":["Vier Feuerkugeln, zwei Obsidian, zweiunddreißig Kies, achtzehn Leder, siebzehn Netherquarz, drei Enderperlen, zweimal seltsamer Netherschleim und vierundvierzig Schwarzstein."]},{"type":"dialogue","speaker":"leader","lines":["Dazu Eisenstiefel mit Seelenläufer I, achtzehn Netherziegel, ein ausgetrockneter Ghast, zweiundzwanzig Eisenklumpen, acht Seelensand, neun Spektralpfeile und ein Wurftrank der Feuerresistenz."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine umfangreiche, dokumentierte Handelsausbeute. Vor allem acht Seelensand sind für unseren nächsten Versuch unmittelbar relevant."]},{"type":"dialogue","speaker":"eckart","lines":["Und was machen wir mit dem ausgetrockneten Gast? Kriegt der 'n Glas Wasser?"]},{"type":"dialogue","speaker":"roehrig","lines":["GHAST, ECKAT! DAT IS 'N GHAST!"]},{"type":"dialogue","speaker":"doofen","lines":["Ein ausgetrockneter Ghast? Wundervoll! Endlich jemand, der meinen Dehydrierungs-INATOR vielleicht zu schätzen weiß!"]},{"type":"narration","text":"Der Handel liefert nützliche Rohstoffe und acht zusätzliche Seelensand. Leuchtsteinstaub gehört allerdings nicht zur aufgezählten Ausbeute. Die Mannschaft bricht mit einem vollen Inventar und gemischten Gefühlen auf."}]},{"chapter":"Kapitel 6 · Günther, Gold und Geduld","title":"Die grüne Sprengladung vor der Haustür","subtitle":"Ein Rückzug ohne Diskussion","blocks":[{"type":"narration","text":"Der Regen lässt nach. Die Kollegen treten vor die Unterkunft und schauen in den Morgen. Zwischen Bäumen und Wiese steht plötzlich eine grüne Gestalt."},{"type":"dialogue","speaker":"leader","lines":["Ein Creeper! Rückzug, Männer! Die grüne Sprengladung kommt!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER HAT UNS GESEHEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN STEH NICH DA RUM, ECKAT! LAUF!"]},{"type":"dialogue","speaker":"werner","lines":["Jou, Leute, die Diskussion vertagen wir besser. Dat Ding hat 'ne kurze Zündschnur."]},{"type":"narration","text":"Der Forschungsleiter besitzt in diesem Augenblick keine einsatzbereite Waffe. Die Gruppe zieht sich rasch die Treppe hinunter zurück. Hinter ihnen bleibt die Gefahr an der Oberfläche zurück."},{"type":"dialogue","speaker":"huibuh","lines":["Bei sämtlichen scheppernden Schlossketten! Nicht schon wieder eine Explosion in der Nähe meiner Schätze!"]},{"type":"dialogue","speaker":"leader","lines":["Wir gehen das Risiko nicht ein. Unten sind wir vorerst sicher."]},{"type":"dialogue","speaker":"kupferstein","lines":["Dann arbeiten wir zunächst mit den vorhandenen Materialien weiter. Die Außenlage bleibt unklar; wir müssen keinen neuen Zwischenfall provozieren."]},{"type":"narration","text":"Im Labor werden die acht beim Handel erhaltenen Seelensand für die Nether-Goldwaschpfanne vorbereitet. Erneut richtet sich alle Hoffnung auf den seltenen Leuchtsteinstaub."},{"type":"dialogue","speaker":"leader","lines":["Bitte wenigstens ein bisschen Leuchtsteinstaub ..."]},{"type":"narration","text":"Doch die erneute Ausbeute enthält keinen Leuchtsteinstaub. Das wiederholte Pech wird im Forschungsbuch vermerkt, ohne daraus einen künstlichen Erfolg zu machen."},{"type":"dialogue","speaker":"eckart","lines":["Meeeeister, dat wird wohl nix mit dem goldenen Licht?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT LICHT IS NICHT GOLDEN! DAT HEISST LEUCHTSTEIN!"]},{"type":"dialogue","speaker":"werner","lines":["Dat is trotzdem 'ne ziemlich dunkle Aussicht."]},{"type":"narration","text":"Der Forschungsleiter steht vor der Wahl: ein riskanter Ausflug in den Nether oder weitere mühsame Materialproduktion."}]},{"chapter":"Kapitel 6 · Günther, Gold und Geduld","title":"Drei Stacks und dreizehn","subtitle":"Die große Bruchsteinaktion hinter den Kulissen","blocks":[{"type":"narration","text":"Weil weder der Handel noch die bisherigen Waschversuche den erhofften Leuchtsteinstaub gebracht haben, fällt zunächst eine pragmatische Entscheidung: Der Forschungsleiter beschafft neuen Bruchstein. Die eigentliche Szene ruht währenddessen."},{"type":"narration","text":"Die Minuten ziehen vorbei. Die Spitzhacke schlägt immer wieder auf den Cobblestone-Generator. Hinzu kommen einige Restbestände, die noch in Hui Buhs Schatzkammer lagen."},{"type":"dialogue","speaker":"huibuh","lines":["Ich bestätige ausdrücklich: Diese Bruchsteine waren ordnungsgemäß eingelagert. Es handelte sich nicht um einen unerlaubten Überfall auf meine Schatztruhe!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Eine amtlich genehmigte Stein-Entnahme!"]},{"type":"narration","text":"Nach langer Arbeit steht der Forschungsleiter wieder vor den anderen. Er zeigt das Inventar und zählt vor."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir haben jetzt drei volle Stacks Bruchstein und dreizehn weitere Stücke. Mehr als genug für einen neuen Durchgang."]},{"type":"dialogue","speaker":"kupferstein","lines":["Drei mal vierundsechzig plus dreizehn: zweihundertfünf Bruchstein aus dieser Sammlung. Zusätzlich liegen im Erzbrecher noch vier vom vorigen Durchgang."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER CHEF HAT DEN GANZEN BERG WEGGEKLOPPT!"]},{"type":"dialogue","speaker":"roehrig","lines":["NA DANN PASS AUF, DAT DU NICHT AUCH NOCH DEN REST WEGKLOPPST, ECKAT!"]},{"type":"dialogue","speaker":"doofen","lines":["Zweihundertfünf Bruchsteine! Mein Zähl-INATOR hätte das in nur drei Stunden errechnet."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Der Professor hat's schon fertig."]},{"type":"narration","text":"Sämtliche neuen Bruchsteine werden zusammen mit den vier Reststücken in die nächste Charge einbezogen. Die Ausgangsmenge ist damit klar: insgesamt zweihundertneun Bruchsteine."}]},{"chapter":"Kapitel 6 · Günther, Gold und Geduld","title":"Zweihundertneun Steine, sechsundzwanzig Sand","subtitle":"Noch ein Produktionslauf, noch eine ernüchternde Pfanne","blocks":[{"type":"narration","text":"Der Forschungsleiter legt die vier Reststücke und die neu gesammelten Stapel in den Erzbrecher. Das vertraute Knirschen beginnt erneut. Etwa zehn bis fünfzehn Sekunden später ist die Maschine fertig."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren. Die Arbeit ist getan. Ergebnis: sechsundzwanzig Sand."]},{"type":"dialogue","speaker":"kupferstein","lines":["Das notieren wir exakt: zweihundertneun Bruchsteine standen diesem Lauf zur Verfügung, daraus wurden sechsundzwanzig Sand gewonnen."]},{"type":"dialogue","speaker":"eckart","lines":["Meister! Für so wenig Sand ham wa so lange Stein gekloppt?"]},{"type":"dialogue","speaker":"roehrig","lines":["WIR HAM NICHT GEKLOPPT, ECKAT! DER CHEF HAT GEKLOPPT!"]},{"type":"dialogue","speaker":"werner","lines":["Jou. Und dat sollte man ihm vielleicht mal danken."]},{"type":"narration","text":"Der Forschungsleiter bringt den Sand zum Komposter. Bei der Umwandlung liegen nachher dreizehn Seelensand bereit. Diese werden aufgestellt, eingesammelt und für den nächsten Waschversuch verwendet."},{"type":"dialogue","speaker":"leader","lines":["Dreizehn Seelensand. Jetzt heißt es Daumen drücken."]},{"type":"dialogue","speaker":"huibuh","lines":["Ich drücke sämtliche geisterhaften Daumen, die mir zur Verfügung stehen!"]},{"type":"dialogue","speaker":"doofen","lines":["Und ich aktiviere den Glücksverstärkungs-INATOR! ... Moment. Er hat keine Batterien."]},{"type":"narration","text":"Ein Block nach dem anderen wird verarbeitet. Wieder erscheinen Rohstoffe, und wieder kontrolliert der Forschungsleiter jeden Gegenstand genau."},{"type":"dialogue","speaker":"leader","lines":["Kein Leuchtsteinstaub. Wieder nichts. Das wird langsam wirklich sehr zeitaufwendig."]},{"type":"dialogue","speaker":"kupferstein","lines":["Die Methode ist ausführbar, aber die gewünschte Ausbeute ist durch diese Versuchsreihe nicht eingetreten. Weitere identische Durchgänge wären eine Entscheidung über den Zeitaufwand, kein neues Experiment."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Dreihundert Seiten Steinbrechen liest doch irgendwann keiner mehr."]},{"type":"narration","text":"Das Labor wird still. Zum ersten Mal an diesem Tag überlegt der Forschungsleiter nicht, wie er noch mehr Steine beschaffen kann, sondern wie er die Forschung sinnvoll fortsetzen möchte."}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Ein bewusster Schnitt im Forschungsbuch","subtitle":"Warum der administrative Eingriff keine normale Herstellung ist","blocks":[{"type":"narration","text":"Zwischen Erzbrecher, Ofen und Komposter bleibt die Forschungstruppe stehen. Der Forschungsleiter betrachtet die Maschinen, dann die sorgfältig protokollierten Fehlschläge. Schließlich erklärt er seine Entscheidung."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, im Überlebensmodus ist die Beschaffung dieser Glowstone-Rüstung ohne einen Ausflug in den Nether enorm aufwendig. Wir haben den Weg mehrfach praktisch ausprobiert."]},{"type":"dialogue","speaker":"leader","lines":["Würden wir jetzt Szene um Szene Steine kloppen, Sand gewinnen, Seelensand herstellen und auf Leuchtsteinstaub hoffen, würde unser Hörbuch nur noch aus Wiederholungen bestehen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine wichtige Unterscheidung: Die Versuche mit dem Erzbrecher, dem Komposter und der Nether-Goldwaschpfanne sind tatsächlich durchgeführt worden. Ihre beobachteten Ergebnisse bleiben unverändert dokumentiert."]},{"type":"dialogue","speaker":"leader","lines":["Richtig. Aber für die nächste Forschungsetappe benutze ich jetzt meine administrativen Rechte und gebe uns die benötigten Leuchtsteinblöcke. Das ist kein im Überlebensmodus erzielter Fund."]},{"type":"dialogue","speaker":"huibuh","lines":["Eine außerordentliche, amtlich verkündete Materialzuteilung! Damit kann ich leben. Hauptsache, die Schatzkammer wird nicht schon wieder leergeräumt."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Besser ein ehrlicher Schnitt als zwanzig Folgen mit derselben Spitzhacke."]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! HASTE GEHÖRT? KEINE ZWANZIG FOLGEN STEINEKLOPPEN!"]},{"type":"dialogue","speaker":"eckart","lines":["Schade, Meister. Ich hatte mich schon ans Zuschauen gewöhnt."]},{"type":"dialogue","speaker":"doofen","lines":["Man könnte es auch den Zeitspar-INATOR nennen! Er überspringt alle langweiligen Schritte und ... ach, Sie haben schon einen besseren Weg gefunden."]},{"type":"narration","text":"Der Forschungsleiter nutzt den Minecraft-Administrationsbefehl, um sich dreiundzwanzig Leuchtsteinblöcke zu geben. Die Herkunft dieses Materials wird ausdrücklich als administrative Hilfe festgehalten."},{"type":"narration","text":"Damit ist kein Rohstoffexperiment vorweggenommen oder nachträglich als erfolgreich erklärt. Stattdessen erhält das Forschungsbuch ein neues Ziel: die Rüstung herstellen und ihre wirklichen Effekte überprüfen."}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Vier Rüstungsteile und eine helle Rechnung","subtitle":"Was das Slimefun-Handbuch zeigt und was noch ungetestet ist","blocks":[{"type":"narration","text":"Das Slimefun-Handbuch liegt offen auf dem Forschungstisch. Der Forschungsleiter blättert durch die Anleitungen der Glowstone-Rüstung. Die Bilder zeigen die vertrauten Formen eines vollständigen Rüstungssets."},{"type":"dialogue","speaker":"leader","lines":["Schaut euch das an, meine Herren. Helm, Brustpanzer, Beinschutz und Stiefel. Alle vier bestehen aus Leuchtstein."]},{"type":"dialogue","speaker":"kupferstein","lines":["Laut den im Handbuch sichtbaren Mustern werden fünf Leuchtsteinblöcke für den Helm, acht für den Brustpanzer, sechs für die Beinschienen und vier für die Stiefel benötigt. Zusammen wären das dreiundzwanzig Blöcke."]},{"type":"dialogue","speaker":"eckart","lines":["Vierundzwanzig?! Meister, dafür hätten wa ja noch 'ne ganze Weile im Steinbruch gestanden!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND IRGENDWANN HÄTTEST DU DIE GANZEN STEINE ZÄHLEN MÜSSEN!"]},{"type":"dialogue","speaker":"werner","lines":["Jou, da kriegt der Spruch vom schweren Rüstungsbau 'ne neue Bedeutung."]},{"type":"narration","text":"Im Handbuch ist bei den vier Rüstungsteilen jeweils Nachtsicht als Wirkung aufgeführt. Doch der Forschungsleiter mahnt zur Vorsicht."},{"type":"dialogue","speaker":"leader","lines":["Das sind erst einmal die Angaben im Handbuch. Wir wissen noch nicht, ob man dafür die ganze Rüstung tragen muss oder ob schon ein einzelnes Teil funktioniert."]},{"type":"dialogue","speaker":"kupferstein","lines":["Exakt. Rezeptanzeige und Forschungseintrag sind nicht mit einem erfolgreichen Herstellungs- oder Funktionstest gleichzusetzen."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein Leuchtsteinhelm! Bei meinen blank polierten Rüstungen! Damit könnte man gewiss eindrucksvoll durch die Schlossflure schreiten."]},{"type":"dialogue","speaker":"doofen","lines":["Ich bevorzuge persönlich den Beleuchte-die-gesamte-Tri-State-Area-INATOR. Aber ein Helm ist natürlich leichter zu transportieren."]},{"type":"narration","text":"Die Entscheidung fällt auf einen kontrollierten ersten Versuch: Zunächst wird ausschließlich der Glowstone-Helm hergestellt. Über Brustpanzer, Beinschutz und Stiefel sollen erst spätere tatsächliche Tests Auskunft geben."}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Der erste Helm aus Leuchtstein","subtitle":"Die Rüstungsschmiede liefert ein echtes Ergebnis","blocks":[{"type":"narration","text":"Im Labor ist die Rüstungsschmiede vorbereitet. Der Forschungsleiter nimmt fünf Leuchtsteinblöcke und ordnet sie nach dem Rezept für den Helm an."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir kennen das Rezept, aber noch nicht die Wirkung aus eigener Erfahrung. Jetzt fertigen wir zuerst den Helm."]},{"type":"dialogue","speaker":"eckart","lines":["Meister, müssen wir die Sonnenbrillen aufsetzen?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IS 'N HELM, KEINE SONNENFINSTERNIS!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Abwarten, Röhrig. Dat Ding heißt immerhin Glowstone."]},{"type":"narration","text":"Die Maschine nimmt die Zutaten an. Ein kurzer Augenblick vergeht, in dem alle Augen auf den Ausgabeschacht gerichtet sind."},{"type":"dialogue","speaker":"leader","lines":["Aufgepasst! Und ... fertig! Da ist er tatsächlich. Der Glowstone-Helm!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Damit ist die Herstellung des ersten Rüstungsteils bestätigt. Der Helm wurde erfolgreich in der Rüstungsschmiede erzeugt."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein herrlich glänzendes Kleinod! Ich hätte allerdings eine gewisse Vorliebe für eine Krone."]},{"type":"dialogue","speaker":"doofen","lines":["Pah! Ein einfacher Helm. Mein Helmkombinator-INATOR kann vier Helme gleichzeitig tragen! Der Nachteil ist die Kopfhöhe von drei Metern."]},{"type":"dialogue","speaker":"eckart","lines":["Meister, der Helm sieht aus, als hätt einer 'ne Lampe uffm Kopp."]},{"type":"dialogue","speaker":"roehrig","lines":["NA UND? SOLANG ER NICHT VOM KOPP FÄLLT!"]},{"type":"narration","text":"Der Forschungsleiter hält den Helm noch einen Moment in der Hand. Die Herstellung ist geschafft. Doch der eigentliche Funktionstest beginnt erst jetzt."},{"type":"dialogue","speaker":"leader","lines":["Also gut, Männer. Jetzt wird ausprobiert, was passiert, wenn ich ihn aufsetze."]}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Plötzlich leuchtet der Forschungsleiter!","subtitle":"Ein Helm, zwei sichtbare Effekte","blocks":[{"type":"narration","text":"Der Forschungsleiter steht mitten im Maschinenraum. Neben ihm befinden sich der Cobblestone-Generator und die schweren Werkstattgeräte. Er nimmt den neuen Glowstone-Helm und setzt ihn vorsichtig auf."},{"type":"dialogue","speaker":"leader","lines":["Wenn ich gleich anfange zu leuchten und ihr nichts mehr sehen könnt, dann sagt bitte Bescheid!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH BIN BEREIT!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN MACH DEINE AUGEN AUF, ECKAT!"]},{"type":"narration","text":"Der Helm sitzt. Zunächst betrachtet der Forschungsleiter nur seine Rüstung. Dann fallen ihm zwei neue Symbole im Effektbereich auf. Er öffnet das Inventar, um sie genauer anzusehen."},{"type":"dialogue","speaker":"leader","lines":["Moment mal. Nachtsicht ... und Leuchten? Das ist ja erstaunlich! Ich dachte, der Helm hätte nur Nachtsicht."]},{"type":"dialogue","speaker":"kupferstein","lines":["Interessant. Auf Ihrem Bildschirm sind beide Effekte tatsächlich aktiv. Der angezeigte Restwert liegt in diesem Moment bei etwa zweiundzwanzig Sekunden."]},{"type":"dialogue","speaker":"werner","lines":["Jou, zwei Effekte zum Preis von einem Helm. Dat is doch 'n ordentliches Angebot."]},{"type":"dialogue","speaker":"huibuh","lines":["LEUCHTEN?! Bei sämtlichen Gespensterlaternen! Wenn ich so etwas trüge, könnte ich mich ja überhaupt nicht mehr würdevoll im Dunkeln verstecken!"]},{"type":"dialogue","speaker":"doofen","lines":["Das ist es! Der Sichtbar-mach-INATOR! ... Wie bitte? Der Helm kann das bereits? Ich sollte vielleicht häufiger die Handbücher lesen."]},{"type":"dialogue","speaker":"leader","lines":["Ich kenne die Nachtsicht. Aber was bewirkt dieser zusätzliche Leuchten-Effekt eigentlich? Das müssen wir genauer betrachten."]},{"type":"narration","text":"Ein Blick auf die dritte Person zeigt den Forschungsleiter mit hell umrandeter Ausrüstung. Der erste Funktionstest liefert damit zwei konkrete Beobachtungen: Nachtsicht und Leuchten sind beim Tragen des Glowstone-Helms aktiv."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Beobachtung ist eindeutig. Allerdings dürfen wir aus diesem einzelnen Test noch keine Aussagen über sämtliche anderen Rüstungsteile ableiten."]},{"type":"narration","text":"Die ganze Truppe beugt sich über das Forschungsjournal. Aus einem vermeintlich einfachen Helm ist plötzlich eine interessante technische Frage geworden."}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Ein leuchtender Helm und die Frage der Fairness","subtitle":"Was später auf dem Aygon-Server erlaubt sein soll","blocks":[{"type":"narration","text":"Die Diskussion führt die Forscher über das Labor hinaus. Der Forschungsleiter denkt an den späteren Aygon-RPG-Server, an Spielergruppen, Dungeons und die Auswirkungen ungewöhnlicher Rüstungseffekte."},{"type":"dialogue","speaker":"leader","lines":["Wenn Leuchten eine Figur sogar durch Wände sichtbar macht, könnte das Spielern später Vorteile verschaffen. Wir sollten überlegen, ob diese Rüstung auf unserem Server erlaubt sein soll."]},{"type":"dialogue","speaker":"kupferstein","lines":["Das ist eine berechtigte Frage für die Spielbalance. Die Funktionsweise des Minecraft-Leuchten-Effekts ist bekannt, aber seine praktische Zulassung hängt von den jeweiligen Spielregeln ab."]},{"type":"dialogue","speaker":"werner","lines":["Jou. In 'nem Dungeon, wo man seine Kollegen wiederfinden muss, wär dat vielleicht sogar ganz praktisch."]},{"type":"dialogue","speaker":"huibuh","lines":["Aber in meiner Schatzkammer möchte ich nicht, dass jeder jeden heimlichen Schatzwächter sofort durch die Mauer erkennt!"]},{"type":"dialogue","speaker":"doofen","lines":["Ganz genau! Heimliche Überraschungen funktionieren nur, wenn sie überraschend bleiben. Sagt der Erfinder des Überraschungs-INATORS."]},{"type":"dialogue","speaker":"eckart","lines":["Meister, heißt das, wir dürfen den Helm nu tragen oder nich?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT ENTSCHEIDET SICH SPÄTER!"]},{"type":"dialogue","speaker":"leader","lines":["In gewissen Dungeons könnte das in Ordnung sein, aber nicht in allen. Das entscheiden wir später und nicht heute mitten im Versuch."]},{"type":"dialogue","speaker":"kupferstein","lines":["Also notieren wir die Frage als offen. Keine pauschale Freigabe und kein allgemeines Verbot, bevor die vorgesehenen Einsatzgebiete geprüft wurden."]},{"type":"narration","text":"So bleibt die Regelentscheidung bewusst vertagt. Der Helm ist hergestellt und sein erster Effektbefund dokumentiert; über den Einsatz auf dem künftigen Server wird später entschieden."}]},{"chapter":"Kapitel 7 · Das Licht der Forschung","title":"Die große Pausensitzung","subtitle":"Wenn selbst Forscher, Geister und Inatoren Hunger bekommen","blocks":[{"type":"narration","text":"Noch drei Teile der Glowstone-Rüstung stehen für spätere Herstellungs- und Funktionstests aus. Doch nach all den Werkzeugen, Erzbrechergeräuschen, Goldgeschäften und entgangenen Leuchtsteinstaubkörnern meldet sich beim Forschungsleiter ein sehr menschliches Bedürfnis: Hunger."},{"type":"dialogue","speaker":"leader","lines":["Meine Freunde, bevor wir die nächsten Rüstungsteile herstellen, machen wir jetzt eine Pause. Ihr könnt essen, Kaffee oder Tee trinken. Eckart darf sich auch ein Bier gönnen. Ich gehe in meine Küche und schalte die Heißluftfritteuse ein."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine ausgezeichnete Entscheidung. Wissenschaft erfordert Konzentration, und ein leerer Magen ist kein zuverlässiges Forschungsinstrument."]},{"type":"dialogue","speaker":"roehrig","lines":["JA, VERDAMMT NOCH MAL! ENDLICH PAUSE! ECKAT! MACH MA KAFFEE!"]},{"type":"dialogue","speaker":"eckart","lines":["Wieso Kaffee, Meister? Der Forschungsleiter hat doch gesacht, ich darf mir 'n Bier gönnen!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN HOL DIR DEIN BIER! ABER BRING MIR VORHER MEINEN KAFFEE!"]},{"type":"narration","text":"Werner lässt sich gemütlich auf einen Stuhl fallen und betrachtet den fertigen Glowstone-Helm, der sicher auf dem Forschungstisch liegt."},{"type":"dialogue","speaker":"werner","lines":["Jou, ich mach mir erst mal 'n Käsebrot. Danach können wir ja gucken, wat die anderen Leuchtklamotten noch so draufhaben."]},{"type":"dialogue","speaker":"doofen","lines":["Eine Pause? Hervorragend! Ich präsentiere den vollautomatischen PAUSEN-INATOR! Er verhindert, dass während der Pause gearbeitet wird. Moment ... warum hat er jetzt die Kaffeemaschine ausgeschaltet?"]},{"type":"narration","text":"Aus Richtung der Werkstatt ertönt ein entsetzter Ruf."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WENN DAT DING MEINEN KAFFEE NOCH EINMAL ABSCHALTET, FLIEGT ES RAUS!"]},{"type":"dialogue","speaker":"huibuh","lines":["Und wer bewacht währenddessen die königlichen Schätze?! Ich kann doch nicht zugleich Schatzmeister sein und eine wohlverdiente Teepause einlegen!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Doch, Hui Buh. Sie trinken Ihren Tee einfach in der Schatzkammer."]},{"type":"dialogue","speaker":"huibuh","lines":["Eine geradezu GEISTREICHE Idee!"]},{"type":"narration","text":"Die Forschungsanlage kommt zur Ruhe. Die Ofenflammen flackern, die Maschinen stehen still. Auf dem Tisch wartet das Forschungsjournal neben dem ersten erfolgreich getesteten Glowstone-Helm."},{"type":"dialogue","speaker":"eckart","lines":["Jo, Meister. Prost."]},{"type":"narration","text":"Für diese Sitzung ist die Arbeit beendet. Der Glowstone-Helm ist hergestellt und auf Nachtsicht sowie Leuchten getestet. Brustpanzer, Beinschutz und Stiefel bleiben für spätere echte Versuche offen. Die Forschungsfreunde gönnen sich ihre Pause."}]},{"chapter":"Kapitel 8 · Pommes, Geister und neue Freunde","title":"Die Pommeskonferenz","subtitle":"Ein Forschungsplan zwischen Kaffee, Käsebrot und Heißluftfritteuse","blocks":[{"type":"narration","text":"Die Forschungspause ist in vollem Gange. Der Forschungsleiter hat die Heißluftfritteuse hinter sich gelassen und sitzt nun mit einer Schüssel frisch zubereiteter Pommes am Tisch. Meister Röhrich genießt seinen Kaffee, Werner sein Käsebrot und Eckart sein wohlverdientes Bier. Der Glowstone-Helm liegt sicher verwahrt in der Werkstatt."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, während wir hier gemütlich beisammensitzen, möchte ich unsere nächsten Forschungsschritte besprechen. Der Helm wurde hergestellt und getestet. Aber sollen wir die anderen drei Rüstungsteile einzeln untersuchen, oder lieber alles herstellen und danach das vollständige Set prüfen? Für unser Hörbuch ist das schließlich wichtig."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine berechtigte Überlegung, Herr Forschungsleiter. Wir wollen die Experimente sauber dokumentieren, aber nicht drei nahezu identische Hörbuchfolgen erzeugen."]},{"type":"dialogue","speaker":"werner","lines":["Jou, sonst lesen unsere Zuhörer hinterher eine Fortsetzung namens Die Rückkehr des linken Stiefels."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DÜRFEN WIR DENN SCHON WIEDER LEUCHTEN?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! ERST MAL LASSEN WIR DEN CHEF SEINE POMMES ESSEN!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Mein Vorschlag: Wir stellen Brustpanzer, Beinschutz und Stiefel in einer zusammenhängenden Versuchsszene her. Dann prüfen wir jedes Stück einzeln, warten zwischen den Tests, bis die Effekte abgeklungen sind, und untersuchen zuletzt die vollständige Rüstung."]},{"type":"dialogue","speaker":"leader","lines":["Genau so. Wissenschaftlich vollständig, aber für das Hörbuch ohne ständige Wiederholungen."]},{"type":"dialogue","speaker":"doofen","lines":["Eine ausgezeichnete Entscheidung! Mein ABKÜRZUNGS-INATOR könnte uns außerdem sämtliche Versuche ersparen. Man erfährt dann allerdings auch nichts."]},{"type":"dialogue","speaker":"werner","lines":["Na, da bleiben wir lieber beim Professor."]},{"type":"dialogue","speaker":"huibuh","lines":["Und zum Schluss darf ich hoffentlich wieder ein wertvolles Rüstungsset in meiner Sammlung begrüßen!"]},{"type":"narration","text":"Der Forschungsleiter nickt und nimmt sich eine weitere Pommes. Der Plan steht. Doch ehe die Forschung fortgesetzt wird, soll die Pause noch etwas ganz anderes bereithalten."}]},{"chapter":"Kapitel 8 · Pommes, Geister und neue Freunde","title":"Der große Ketchup-Zwischenfall","subtitle":"Eine Flasche, ein Teller und eine sehr eigenwillige Dosierung","blocks":[{"type":"narration","text":"Eckart betrachtet die Pommesschüssel mit unverhohlenem Interesse. Der Forschungsleiter bemerkt seinen Blick und schiebt die Schüssel freundlich in die Tischmitte."},{"type":"dialogue","speaker":"leader","lines":["Eckart, bedien dich ruhig. Für alle ist genug da! Und wenn jemand Ketchup möchte: Die Flasche steht gleich neben der Schüssel."]},{"type":"dialogue","speaker":"eckart","lines":["WIRKLICH, CHEF? POMMES MIT KETCHUP?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT KANN MAN AUCH IN ZIMMERLAUTSTÄRKE SAGEN!"]},{"type":"narration","text":"Eckart nimmt einen Teller, greift ein paar Pommes und dreht die Ketchupflasche um. Er drückt. Nichts geschieht. Er drückt stärker. Wieder nichts."},{"type":"dialogue","speaker":"eckart","lines":["Meister? Dat Ketchup is kaputt."]},{"type":"dialogue","speaker":"roehrig","lines":["WAT SOLL DENN AN KETCHUP KAPUTT SEIN?"]},{"type":"narration","text":"Eckart drückt ein drittes Mal. Mit einem lauten Pfffft landet ein stattlicher roter Klecks mitten auf seinem Teller."},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! ECKAT! DAS SIND JA POMMES IM KETCHUPBAD!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber die schmecken trotzdem!"]},{"type":"dialogue","speaker":"doofen","lines":["Eine unkontrollierte Ketchup-Entladung! Genau deswegen habe ich einst meinen KETCHUP-DOSIER-INATOR erfunden."]},{"type":"dialogue","speaker":"kupferstein","lines":["Bitte sagen Sie mir, dass er nicht explodiert ist."]},{"type":"dialogue","speaker":"doofen","lines":["Nein! Er hat lediglich alle Pommes im Umkreis von drei Kilometern rot gefärbt."]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rasselnden Ketten! Welch erschreckender Angriff auf die königliche Tischkultur!"]},{"type":"narration","text":"Auch Hui Buh schwebt neugierig zu der Schüssel. Er versucht, eine Pommes aufzuheben. Sie fällt durch seine durchsichtigen Finger."},{"type":"dialogue","speaker":"huibuh","lines":["Unfassbar! Ich kann uralte Schlösser heimsuchen, aber eine einzelne Pommes entzieht sich meiner gespenstischen Hand!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Da fehlt wohl noch der POMMES-FESTHALTE-INATOR!"]},{"type":"narration","text":"Ein fröhliches Gelächter erfüllt den Aufenthaltsraum. Die Forschung ist für den Moment vergessen."}]},{"chapter":"Kapitel 8 · Pommes, Geister und neue Freunde","title":"Der Geist im Pommesparadies","subtitle":"Ein weißes Köpfchen zwischen den letzten Kartoffelstäbchen","blocks":[{"type":"narration","text":"Allmählich leert sich die große Schüssel. Der Forschungsleiter greift nach den letzten Pommes, doch mitten zwischen den goldgelben Stäbchen entdeckt er etwas Merkwürdiges. Etwas Weißes. Etwas fast Durchsichtiges. Er zieht überrascht die Hand zurück."},{"type":"dialogue","speaker":"leader","lines":["HUCH! Was ist denn das?"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! IS 'NE SPINNE IN DEN POMMES?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! LASS IHN DOCH ERST MAL NACHSEHEN!"]},{"type":"narration","text":"Der Forschungsleiter beugt sich erneut über die Schüssel. Zwei große Augen schauen ihm entgegen. Sie zwinkern. Dann erscheint ein winziges, freundliches Lächeln auf einem milchig-perlmuttfarbenen Gesicht."},{"type":"dialogue","speaker":"leader","lines":["Mensch, Casper! Hast du mich erschreckt!"]},{"type":"narration","text":"Das kleine Gespenst verschwindet augenblicklich hinter einer langen Pommes. Einen Herzschlag später wagt sich erst ein Auge, dann das ganze Köpfchen wieder hervor."},{"type":"dialogue","speaker":"casper","lines":["E-Entschuldigung. Ich ... ich wollte dich wirklich nicht erschrecken."]},{"type":"dialogue","speaker":"leader","lines":["Das hast du nur ganz unerwartet gemacht, mein Kleiner!"]},{"type":"dialogue","speaker":"casper","lines":["Es hat so lecker gerochen ... und ihr habt alle so gelacht. Da wollte ich nur schauen, was euch so glücklich macht."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Ein Pommes-Poltergeist! Den findet man auch nich alle Tage!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! CASPER WOHNT INNE POMMESSCHÜSSEL!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DER WOHNT DA NICH! DER HAT SICH BLOSS VERSTECKT!"]},{"type":"dialogue","speaker":"huibuh","lines":["Ein junger Geist, der aus einer Pommesschüssel auftaucht! Äußerst originell. Auch wenn meine eigenen Auftritte gewöhnlich mit rasselnden Ketten beginnen."]},{"type":"narration","text":"Casper schaut sich schüchtern im Raum um. Ein leiser Schatten von Sorge huscht über sein Gesicht."},{"type":"dialogue","speaker":"casper","lines":["Seid ... seid ihr jetzt böse? Darf ich trotzdem noch ein bisschen bei euch bleiben?"]},{"type":"narration","text":"Der Forschungsleiter stellt die Schüssel sanft ab und wendet sich dem kleinen Geist zu."}]},{"chapter":"Kapitel 8 · Pommes, Geister und neue Freunde","title":"Du darfst bleiben, Casper","subtitle":"Manchmal ist Freundlichkeit das größte Gespensterkunststück","blocks":[{"type":"dialogue","speaker":"leader","lines":["Mein lieber Casper, nur weil ich erschrocken bin, heißt das doch nicht, dass ich dir böse bin. Stell dir vor, du entdeckst plötzlich eine weiße, durchsichtige Flüssigkeit in deiner Pommesschüssel, und beim zweiten Hinsehen zwinkern dich zwei Augen an! Da zuckt man eben zusammen."]},{"type":"narration","text":"Casper kichert ganz leise. Der Forschungsleiter lächelt."},{"type":"dialogue","speaker":"leader","lines":["Und selbstverständlich darfst du bei uns bleiben! Hui Buh zeigt dir bestimmt seine Schätze und führt dich durch die Forschungsanlage. Wenn du möchtest, darfst du auch bei unseren Experimenten dabei sein."]},{"type":"dialogue","speaker":"casper","lines":["Auch ... auch wenn ich manchmal ängstlich bin?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Natürlich! Gute Wissenschaftler brauchen Neugier und Aufmerksamkeit, nicht unbedingt laute Stimmen."]},{"type":"dialogue","speaker":"leader","lines":["Ich habe außerdem von deinen drei größeren Brüdern gehört: Fetzo, Stinky und Schleimi. Sie erschrecken gerne Menschen, und sie haben dich oft geärgert, weil du das nicht möchtest. Das fand ich nicht in Ordnung."]},{"type":"narration","text":"Casper zieht den kleinen Schal enger um seine Schultern. Seine Augen wandern verlegen über den Tisch."},{"type":"dialogue","speaker":"casper","lines":["Sie haben immer gesagt, dass ein richtiges Gespenst schrecklich sein muss. Aber wenn jemand wegen mir Angst bekommt, tut mir das leid."]},{"type":"dialogue","speaker":"leader","lines":["Dann ist das eben deine Art, Casper. Du musst dich nicht ändern, nur weil deine Brüder etwas anderes behaupten. Wir freuen uns, dass du so bist, wie du bist. Und ein kleiner, unbeabsichtigter Schreckmoment ab und zu ist doch kein Unglück. Nicht wahr, Eckart?"]},{"type":"dialogue","speaker":"eckart","lines":["Ja, Chef. Ich erschreck mich schließlich auch dauernd. Meistens, wenn der Meister meinen Namen ruft!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAAAAAT!"]},{"type":"narration","text":"Eckart fährt zusammen. Die ganze Runde lacht, sogar Casper."},{"type":"dialogue","speaker":"huibuh","lines":["Mein junger Freund, ein Gespenst muss nicht furchterregend sein, um ein richtiges Gespenst zu sein. Manchmal ist ein freundliches Lächeln das größere Kunststück."]},{"type":"dialogue","speaker":"casper","lines":["W-wirklich?"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meiner königlichen Geisterehre! Und wenn du magst, zeige ich dir nachher höchstpersönlich meine Schatzkammer."]},{"type":"dialogue","speaker":"casper","lines":["Das würde ich sehr gerne."]},{"type":"narration","text":"Die kleine Geistergestalt schwebt ein Stück höher und lächelt. Diesmal versteckt Casper sich nicht mehr zwischen den Pommes. Er ist einfach bei seinen neuen Freunden."}]},{"chapter":"Kapitel 8 · Pommes, Geister und neue Freunde","title":"Ding, Dong, Däng!","subtitle":"Die Pause endet, das Forschungslabor ruft","blocks":[{"type":"narration","text":"Ein friedlicher Augenblick liegt über dem Aufenthaltsraum. Dann ertönt plötzlich eine Glocke."},{"type":"narration","text":"DING! DONG! DÄNG!"},{"type":"narration","text":"Der Forschungsleiter schaut auf die Uhr und reibt sich überrascht die Augen."},{"type":"dialogue","speaker":"leader","lines":["Na hui! Schon vorbei? Das ging aber schnell mit der Pause. Beim Quatschen vergeht die Zeit! Nun gut, Leute. Die weitere Forschung ruft. Auf ans Werk!"]},{"type":"dialogue","speaker":"roehrig","lines":["NA ENDLICH! ECKAT! AUFRÄUMEN! WIR MÜSSEN WIEDER AN DIE ARBEIT!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister! Ich hab doch gerade erst nach der letzten Pommes gesucht!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Die letzte Pommes war Casper."]},{"type":"dialogue","speaker":"casper","lines":["I-ich war aber keine richtige Pommes ..."]},{"type":"dialogue","speaker":"huibuh","lines":["Natürlich nicht, mein junger Freund! Ein Nachwuchsgeist von solch vortrefflichen Manieren ist weit kostbarer."]},{"type":"dialogue","speaker":"doofen","lines":["Sehr gut! Dann schalte ich meinen FORSCHUNGS-WIEDERAUFNAHME-INATOR ein!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU SCHALTEST GAR NIX EIN!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Zur Erinnerung: Wir stellen zunächst die drei fehlenden Glowstone-Rüstungsteile her. Anschließend folgen ihre Einzelprüfungen und zuletzt der Test des vollständigen Sets."]},{"type":"dialogue","speaker":"casper","lines":["Darf ich mitkommen? Ich würde gern zusehen ... und vielleicht bei den Aufzeichnungen helfen."]},{"type":"dialogue","speaker":"leader","lines":["Natürlich, Casper. Komm mit."]},{"type":"narration","text":"Gemeinsam verlassen die Forscher den Aufenthaltsraum. Die warmen Stimmen, das Klappern der Tassen und der Duft der Pommes bleiben zurück. Vor ihnen liegt die vertraute Werkzeugfabrik mit ihrer Rüstungsschmiede und dem flackernden Ofenfeuer."},{"type":"dialogue","speaker":"werner","lines":["Na denn, Chef. Die Mannschaft is wieder vollständig. Kann losgehen."]},{"type":"narration","text":"Der Forschungsleiter legt das Slimefun-Handbuch bereit. Auf der Werkbank wartet die nächste Forschungsaufgabe."}]},{"chapter":"Kapitel 9 · Vier Teile, zwei Wirkungen","title":"Die Schmiede spricht dreimal","subtitle":"Brustpanzer, Beinschutz und Stiefel werden Wirklichkeit","blocks":[{"type":"narration","text":"In der unterirdischen Werkzeugfabrik merkt der Forschungsleiter zunächst, wie hell ihm der Raum mit dem Glowstone-Helm vorkommt. Er setzt den bereits getesteten Helm ab und bereitet die nächsten Versuche vor."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir beginnen mit dem Brustpanzer. Acht Leuchtsteinblöcke kommen in die Rüstungsschmiede. Achtet auf die Geräusche!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Anordnung überprüft. Das Rezept ist vollständig."]},{"type":"narration","text":"Ein Klick auf den Amboss setzt den Vorgang in Gang. Die Schmiede knirscht und klappert auf ihre ganz eigene Weise. Wenige Augenblicke später liegt tatsächlich ein goldgelber Glowstone-Brustpanzer im Ausgabefach."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön! Der Brustpanzer ist hergestellt. Kein Fehler im Serverlog."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! JETZT HAT DER CHEF 'NE LEUCHTENDE JACKE!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IS 'N BRUSTPANZER!"]},{"type":"narration","text":"Der Forschungsleiter legt das neue Stück ins Inventar und ordnet sechs weitere Leuchtsteinblöcke für den Beinschutz an."},{"type":"dialogue","speaker":"leader","lines":["Weiter geht's mit den Beinen. Noch einmal klicken ..."]},{"type":"narration","text":"Die Schmiede rumpelt erneut. Auch diesmal erscheint das erwartete Rüstungsteil."},{"type":"dialogue","speaker":"kupferstein","lines":["Glowstone-Beinschutz: erfolgreich hergestellt. Die Beschreibung nennt Nachtsicht und zwei Rüstungspunkte."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Schon zwei Stücke. Dat geht heute aber richtig flott."]},{"type":"dialogue","speaker":"doofen","lines":["Das wäre ein guter Moment für meinen LEUCHTHOSEN-INATOR!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN, DOKTOR!"]},{"type":"narration","text":"Die letzten vier Leuchtsteinblöcke werden in zwei senkrechten Reihen für die Stiefel eingelegt. Noch ein Klick, noch ein metallisches Rattern. Dann erscheinen auch die Glowstone-Stiefel."},{"type":"dialogue","speaker":"leader","lines":["Das war's, meine Freunde. Brustpanzer, Beinschutz und Stiefel erfolgreich hergestellt! Alle vier Teile liegen jetzt im Inventar. Im Serverlog gab es dabei keine Fehler."]},{"type":"dialogue","speaker":"casper","lines":["Das sieht ... richtig schön aus. So viel goldenes Licht."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein wahrhaft würdiger neuer Schatz!"]},{"type":"narration","text":"Professor Kupferstein notiert den Materialbedarf: fünf Blöcke für den früheren Helm, acht für den Brustpanzer, sechs für den Beinschutz und vier für die Stiefel. Zusammen dreiundzwanzig Leuchtsteinblöcke, die ausdrücklich administrativ bereitgestellt worden waren."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Herstellung aller vier Teile ist bestätigt. Aber die Wirkungen der drei neuen Stücke müssen wir noch selbst untersuchen."]},{"type":"narration","text":"Die Mannschaft tritt etwas zurück. Aus vier erfolgreichen Herstellungsversuchen soll nun eine vollständige Funktionsprüfung werden."}]},{"chapter":"Kapitel 9 · Vier Teile, zwei Wirkungen","title":"Der Brustpanzer und die Sache mit den Sekunden","subtitle":"Warum ein guter Forscher zwischen zwei Versuchen wartet","blocks":[{"type":"narration","text":"Vor Beginn des nächsten Tests legt der Forschungsleiter seine Ausrüstung so zurecht, dass die Glowstone-Rüstungsteile einzeln angelegt werden können. Die Mannschaft beobachtet gespannt die Effektanzeige."},{"type":"dialogue","speaker":"leader","lines":["Beim Helm haben wir Leuchten und Nachtsicht gesehen. Jetzt ziehen wir ausschließlich den Glowstone-Brustpanzer an und schauen, ob wieder dasselbe passiert."]},{"type":"narration","text":"KLICK!"},{"type":"narration","text":"Kaum ist der Brustpanzer angelegt, erscheinen die zwei vertrauten Symbole: Leuchten und Nachtsicht. Die Anzeige weist in diesem Moment ungefähr achtundzwanzig Sekunden aus."},{"type":"dialogue","speaker":"leader","lines":["Jawohl! Genau dieselben beiden Effekte. Auch der Brustpanzer funktioniert allein."]},{"type":"dialogue","speaker":"kupferstein","lines":["Der Einzeltest ist positiv. Damit wissen wir, dass man für Nachtsicht und Leuchten nicht zwingend das vollständige Rüstungsset braucht."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAT IS JA WIE DER HELM, BLOSS FÜR'N BAUCH!"]},{"type":"dialogue","speaker":"roehrig","lines":["BRUST, ECKAT! DAT TEIL GEHÖRT AN DIE BRUST!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Wenigstens passt dat Ding nich uffn Kopp."]},{"type":"narration","text":"Der Forschungsleiter legt den Brustpanzer wieder ab. Die Symbole verschwinden nicht sofort; für eine kurze Zeit bleiben die Effekte noch aktiv."},{"type":"dialogue","speaker":"leader","lines":["Jetzt warten wir. Der Rest läuft ungefähr zweiundzwanzig Sekunden weiter. Wir beginnen erst mit dem nächsten Rüstungsteil, wenn die Effekte vollständig weg sind."]},{"type":"dialogue","speaker":"kupferstein","lines":["Genau deshalb machen wir diese Pause zwischen den Versuchen. Sonst könnten wir die Wirkung eines Rüstungsteils fälschlich dem nächsten zuschreiben."]},{"type":"narration","text":"Die letzten Sekunden verstreichen. Schließlich erlischt die Nachtsicht. Die Werkstatt wirkt wieder deutlich dunkler."},{"type":"dialogue","speaker":"casper","lines":["Jetzt kann man den Unterschied wirklich sehen ..."]},{"type":"dialogue","speaker":"huibuh","lines":["Eine seltene Gelegenheit, bei der ich die Dunkelheit ausdrücklich begrüße!"]},{"type":"narration","text":"Der erste neue Einzeltest ist beendet. Professor Kupferstein setzt ein Häkchen hinter den Brustpanzer."}]},{"chapter":"Kapitel 9 · Vier Teile, zwei Wirkungen","title":"Leuchthose und Leuchtstiefel","subtitle":"Zwei kurze Versuche, derselbe eindeutige Befund","blocks":[{"type":"narration","text":"Als Nächstes nimmt der Forschungsleiter den Glowstone-Beinschutz zur Hand."},{"type":"dialogue","speaker":"leader","lines":["Jetzt kommen die Beine. Alles wieder dunkel, der vorige Effekt ist abgeklungen. Und ... anlegen!"]},{"type":"narration","text":"Die Rüstung sitzt. Sofort erscheinen erneut Leuchten und Nachtsicht. Die zuvor dunklere Umgebung ist durch den Nachtsichteffekt wieder klar erkennbar."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER CHEF TRÄGT 'NE LEUCHTHOSE!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND SIE FUNKTIONIERT!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Beinschutz: dieselben beiden Effekte bestätigt. Keine weitere Wirkung beobachtet."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Bislang bleibt die Sache schön übersichtlich."]},{"type":"narration","text":"Der Forschungsleiter legt den Beinschutz wieder ab und wartet erneut, bis die Restzeit der Effekte abgelaufen ist. Dann blickt er auf die letzten beiden goldgelben Rüstungsteile für die Füße."},{"type":"dialogue","speaker":"leader","lines":["So, als letzter Einzeltest kommen die Glowstone-Stiefel dran."]},{"type":"narration","text":"KLICK!"},{"type":"narration","text":"Auch die Stiefel aktivieren Nachtsicht und Leuchten. Auf dem Bildschirm erscheinen erneut genau die beiden bereits bekannten Statuseffekte."},{"type":"dialogue","speaker":"casper","lines":["Sogar die Schuhe können das?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Ja, Casper. Das ist nun nicht mehr nur eine Vermutung, sondern durch den Versuch bestätigt."]},{"type":"dialogue","speaker":"doofen","lines":["Schuhe mit Nachtsicht! Mein NACHTSCHUH-INATOR hätte dafür einen ganzen Schrank gebraucht!"]},{"type":"dialogue","speaker":"huibuh","lines":["Dann bin ich erleichtert, dass die Stiefel nur einen kleinen Platz in meiner Schatztruhe beanspruchen werden."]},{"type":"narration","text":"Die Stiefel werden abgelegt. Die Forschungsgruppe wartet, bis Leuchten und Nachtsicht erneut verschwunden sind."},{"type":"dialogue","speaker":"leader","lines":["So. Auch dieser Effekt ist verklungen. Jetzt kommt endlich die eigentliche Frage: Was passiert mit dem kompletten Set?"]},{"type":"narration","text":"Professor Kupferstein schlägt eine neue Seite in seinem Notizbuch auf. Alle drei neu hergestellten Rüstungsteile haben ihre Einzeltests bestanden."}]},{"chapter":"Kapitel 9 · Vier Teile, zwei Wirkungen","title":"Die wandelnde Straßenlaterne","subtitle":"Das vollständige Glowstone-Set zeigt seine Wirkung","blocks":[{"type":"narration","text":"Der Forschungsleiter steht mitten im Werkstattgang. Er hat alle vier Teile der Glowstone-Rüstung bereitgelegt. Diesmal will er sie zusammen anziehen und prüfen, ob ein besonderer Effekt hinzukommt."},{"type":"dialogue","speaker":"leader","lines":["Jetzt das komplette Set. Helm, Brustpanzer, Beinschutz und Stiefel. Alle auf einmal!"]},{"type":"narration","text":"Ein Klick nach dem anderen. Der Helm sitzt, die Brustplatte folgt, dann Beinschutz und Stiefel. Schließlich steht der Forschungsleiter vollständig in leuchtendem Gelb vor seinen Kollegen."},{"type":"dialogue","speaker":"eckart","lines":["MEEEEISTER! JETZT IS DER CHEF 'NE WANDELNDE STRASSENLATERNE!"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! Dat sieht aus, als hätte die Sonne persönlich 'ne Rüstungsschmiede besucht!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rasselnden Ketten! Welch prachtvoller Anblick! Allerdings würde jeder heimliche Spukauftritt damit im Keim erstickt."]},{"type":"dialogue","speaker":"casper","lines":["Ich ... ich finde das sehr schön. Die Rüstung sieht richtig freundlich aus."]},{"type":"dialogue","speaker":"doofen","lines":["Jetzt müssen doch mindestens acht Effekte erscheinen! Schließlich sind es vier Teile mit je zwei Effekten!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Das ist nicht die Art, wie wir hier rechnen, Doktor. Wir schauen auf die tatsächliche Anzeige."]},{"type":"narration","text":"Der Forschungsleiter prüft seine Effekte sorgfältig. Dort stehen weiterhin nur zwei Einträge: Leuchten und Nachtsicht. Kein neuer zusätzlicher Statuseffekt erscheint."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, das ist das Ergebnis! Auch beim vollständigen Rüstungsset keine weiteren Effekte. Nur Leuchten und Nachtsicht."]},{"type":"dialogue","speaker":"kupferstein","lines":["Damit sind die grundlegenden Statuseffekte nachgewiesen. Jedes der vier Einzelteile genügt für diese beiden Wirkungen, und das vollständige Set bringt im beobachteten Versuch keine zusätzliche Statuswirkung."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DENN HÄTTEN WIR DOCH AUCH BLOSS EINEN HELM BAUEN KÖNNEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WIR WOLLTEN DOCH DIE GANZE RÜSTUNG ERFORSCHEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Aber dat hat er diesmal gar nich so unrecht."]},{"type":"narration","text":"Professor Kupferstein notiert das Ergebnis, ohne weitere Fähigkeiten zu behaupten. Die Rüstung wurde vollständig hergestellt und ihre sichtbaren Statuseffekte sind getestet. Andere denkbare Eigenschaften wären eigene Untersuchungen."},{"type":"dialogue","speaker":"kupferstein","lines":["Für unsere heutige Prüfung ist das ein sauberer Abschluss. Nun dürfen die vier Stücke in die Sammlung unseres Schatzmeisters."]},{"type":"narration","text":"Hui Buh richtet sich bei diesen Worten stolz auf. Seine Schatzkammer wartet."}]},{"chapter":"Kapitel 10 · Ein neuer Schatz für Hui Buh","title":"Die lange Treppe in die Vergangenheit","subtitle":"Wo jede Stufe an ein gemeinsames Bauprojekt erinnert","blocks":[{"type":"narration","text":"Der Forschungsleiter legt die Glowstone-Rüstung wieder ab. Helm, Brustpanzer, Beinschutz und Stiefel befinden sich ordentlich nebeneinander in seiner Schnellzugriffsleiste."},{"type":"dialogue","speaker":"leader","lines":["Nun denn, meine Herren! Die Rüstungsprüfung ist abgeschlossen. Unser lieber Hui Buh bekommt wieder ein neues Artefakten-Set. Folgt mir alle! Und Eckart, pass auf, dass du auf der langen Treppe nicht stolperst!"]},{"type":"dialogue","speaker":"eckart","lines":["Ja, Chef! Ich kenn die Treppe doch inzwischen!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Und genau deswegen sollste aufpassen."]},{"type":"narration","text":"Die Gruppe geht durch den hellen Werkstattgang und erreicht die lange Steintreppe, die tief unter die Forschungsanlage führt. Fackeln leuchten an den Wänden. An manchen Stellen ist das Licht der Nachtsicht bereits wieder verblasst."},{"type":"dialogue","speaker":"leader","lines":["Hier ist es ja noch hell. Moment ... jetzt nicht mehr. Gut, dann weiter hinunter."]},{"type":"dialogue","speaker":"casper","lines":["Hui Buh? Ist deine Schatzkammer wirklich so tief unter der Erde?"]},{"type":"dialogue","speaker":"huibuh","lines":["Aber selbstverständlich, mein kleiner Freund! Die wertvollsten Schätze verdienen den würdigsten Aufbewahrungsort."]},{"type":"dialogue","speaker":"casper","lines":["Und ... ist das auch sicher vor Creepern?"]},{"type":"dialogue","speaker":"huibuh","lines":["VOR ALLEM vor Creepern!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! NICHT AUF DER TREPPE RUMTRÖDELN!"]},{"type":"dialogue","speaker":"eckart","lines":["ICH TRÖDEL DOCH GAR NICH, MEISTER!"]},{"type":"narration","text":"Nach dem langen Abstieg erreichen die Forscher die kunstvoll verkleidete Schatzkammer. Steinplatten, zwei rote Banner, Fackeln und grüne Pflanzen geben dem Raum einen feierlichen Charakter. Vor der Wand steht die große Truhe."},{"type":"dialogue","speaker":"leader","lines":["Schaut euch das noch einmal an. Wisst ihr noch, wie lange es gedauert hat, diesen Raum auszuhöhlen und danach Stein für Stein zu verkleiden? Das war wirklich Arbeit."]},{"type":"dialogue","speaker":"roehrig","lines":["JAWOLL! DAT WAR NOCH RICHTIGE HANDWERKSARBEIT!"]},{"type":"dialogue","speaker":"werner","lines":["Jou. Erst den halben Berg ausräumen und dann alles hübsch machen. Aber guck einer an, wat draus geworden is."]},{"type":"narration","text":"Über der Truhe steht auf dem Holzschild, wer die Schatzkammer errichtet hat: Eckart, Werner und Röhrich sowie Dr. Doofenshmirtz."},{"type":"dialogue","speaker":"doofen","lines":["Ich bestehe darauf, dass mein Name noch in hundert Jahren lesbar ist!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! MEINER STEHT AUCH DRAUF!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! WEIL DU MITGEBAUT HAST!"]},{"type":"dialogue","speaker":"casper","lines":["Das habt ihr alles zusammen gemacht? Es ist wunderschön."]},{"type":"narration","text":"Für einen Augenblick betrachtet die Gruppe schweigend die Mauern. In diesem Raum stecken nicht nur Steine, sondern viele gemeinsame Stunden."}]},{"chapter":"Kapitel 10 · Ein neuer Schatz für Hui Buh","title":"Vier goldene Stücke in der königlichen Truhe","subtitle":"Die Glowstone-Rüstung erhält ihren Platz in Hui Buhs Sammlung","blocks":[{"type":"narration","text":"Der Forschungsleiter tritt an die große Truhe. Links und rechts rahmen Pflanzen den sorgfältig hergerichteten Aufbewahrungsort ein. Hui Buh schwebt erwartungsvoll daneben."},{"type":"dialogue","speaker":"leader","lines":["So, Hui Buh! Ein weiteres vollständiges Rüstungsset für deine Sammlung. Ich sortiere alles ordentlich ein. Dann kannst du wieder schön darauf aufpassen."]},{"type":"narration","text":"KLACK! Die Truhe öffnet sich. In der oberen Reihe liegen bereits die verschiedenfarbigen Rüstungsstücke früherer Versuche: dunkelblaue und grüne Teile, jeweils ordentlich verstaut. Nun kommt das neue Glowstone-Set hinzu."},{"type":"narration","text":"Der Forschungsleiter legt Helm, Brustpanzer, Beinschutz und Stiefel nacheinander in die freien Fächer. Kein Teil fehlt. Die neue goldgelbe Rüstung ist vollständig eingelagert."},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rasselnden Ketten! Welch herrliche Erweiterung meiner königlichen Rüstungssammlung! Ich nehme diesen Schatz mit größtem Vergnügen in meine Obhut."]},{"type":"dialogue","speaker":"kupferstein","lines":["Damit ist der letzte Schritt dokumentiert: alle vier Teile erfolgreich hergestellt, die Statuseffekte in Einzel- und Gesamtprüfung getestet und das vollständige Set anschließend in der Schatzkammer archiviert."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Und diesmal müssen wa keinen einzigen Bruchstein mehr kloppen. Zumindest nicht für diese Rüstung."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DARF HUI BUH DIE RÜSTUNG JETZT AUCH ANZIEHEN?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! ER SOLL SIE BEWACHEN, NICH DAMIT SPAZIEREN GEHEN!"]},{"type":"dialogue","speaker":"casper","lines":["Darf ich sie mir manchmal anschauen?"]},{"type":"dialogue","speaker":"huibuh","lines":["Natürlich, mein lieber Casper. Und vielleicht zeige ich dir sogar, wie man eine richtige königliche Schatzkammer bewacht."]},{"type":"dialogue","speaker":"casper","lines":["Auch ... auch wenn ich niemanden erschrecken möchte?"]},{"type":"dialogue","speaker":"huibuh","lines":["Manchmal genügt es völlig, wenn jemand gut auf etwas aufpasst."]},{"type":"narration","text":"Casper lächelt. Eckart schaut von den beiden Gespenstern zu dem Schild über der Truhe."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! Wenn Casper hier später auch aufpasst ... kriegt er dann 'n eigenes Namensschild?"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Ein Nachwuchsgeist mit einem eigenen Türschild! Dat wäre doch was."]},{"type":"dialogue","speaker":"huibuh","lines":["Darüber können wir zu gegebener Zeit nachdenken."]},{"type":"narration","text":"Der Forschungsleiter schließt die Truhe behutsam. KLACK! Hui Buh schwebt stolz vor seiner Sammlung."},{"type":"dialogue","speaker":"huibuh","lines":["Meine Herren! Die Glowstone-Rüstung ist hiermit ein ehrenwerter Bestandteil meiner königlichen Schätze!"]},{"type":"dialogue","speaker":"doofen","lines":["Und mein SCHATZKAMMER-BEWACHUNGS-INATOR könnte ..."]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER, ICH HAB DOCH GAR NIX GESAGT!"]},{"type":"narration","text":"Die Forschungskollegen lachen, und Caspers helles Kichern mischt sich darunter. Die Glowstone-Rüstung ist sicher verstaut. Die heutige Forschungsreihe endet dort, wo frühere Abenteuer ihre Spuren hinterlassen haben: in Hui Buhs Schatzkammer."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Nachtsicht, Schleim und nun ein Regenbogen","subtitle":"Eine neue Forschungsreihe beginnt in Hui Buhs Schatzkammer","blocks":[{"type":"narration","text":"Die Glowstone-Rüstung liegt sicher verwahrt. Der Forschungsleiter öffnet das Slimefun-Handbuch und überfliegt die bereits untersuchten Rüstungsreihen: Ender, Schleim und Glowstone. Dann bleibt sein Blick auf einem neuen Eintrag hängen."},{"type":"dialogue","speaker":"leader","lines":["Meine lieben Forscherfreunde, als Nächstes wartet die Regenbogen-Rüstung auf uns. Was meint ihr: Welche Eigenschaften könnte sie haben?"]},{"type":"dialogue","speaker":"werner","lines":["Jou! Vielleicht glitzert die in allen Farben. Oder die wechselt einfach ihre Farbe."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DIE WECHSELT BESTIMMT DIE FARBE! DANN BRAUCH ICH NUR NOCH EINE RÜSTUNG FÜR ALLE FESTE!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! ERST MAL ABWARTEN, WAT IM HANDBUCH STEHT!"]},{"type":"dialogue","speaker":"casper","lines":["Vielleicht wird sie schön bunt. Ich mag Farben ... besonders, wenn niemand erschrecken muss."]},{"type":"dialogue","speaker":"doofen","lines":["Ein Regenbogen-Farbwechsel-INATOR! Genau so etwas wollte ich schon immer erfinden."]},{"type":"narration","text":"Die Vermutungen sind notiert. Noch hat niemand die tatsächliche Wirkung überprüft."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Eckart trifft ins Schwarze. Oder ins Bunte.","subtitle":"Das Handbuch verrät etwas, aber der Versuch steht noch aus","blocks":[{"type":"narration","text":"Der Forschungsleiter schaltet die Forschung im Handbuch frei. Der zuvor gesperrte Regenbogen-Helm zeigt nun seine Beschreibung: Er durchläuft alle Farben des Regenbogens. Als Rüstungswert ist plus eins angegeben."},{"type":"dialogue","speaker":"leader","lines":["Oho! Das ist interessant. Eckart, herzlichen Glückwunsch! Deine Vermutung scheint genau in die richtige Richtung gegangen zu sein."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH HAB'S GEWUSST! ICH HAB DAS BUNTE GEFÜHL IM BAUCH GEHABT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dat kommt vielleicht vom Ketchup aus der Pause."]},{"type":"dialogue","speaker":"kupferstein","lines":["Wir müssen sauber unterscheiden: Der Hinweistext beschreibt einen Farbwechsel. Ob dieser technisch stattfindet, können wir erst mit einer hergestellten und angelegten Rüstung bestätigen."]},{"type":"dialogue","speaker":"huibuh","lines":["Sollte die Sache funktionieren, bekommt meine Schatzkammer ein weiteres äußerst ungewöhnliches Stück."]},{"type":"narration","text":"Die Runde beschließt, zuerst das Rezept zu prüfen. Ein Tooltip allein gilt nicht als Funktionstest."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Vierundzwanzigmal Regenbogenleder","subtitle":"Die bewusste Abkürzung bei bereits geprüften Komponenten","blocks":[{"type":"narration","text":"Im Rezeptbuch erscheint ein alter Bekannter: Regenbogenleder. Diese Komponente wurde in früheren Versuchen bereits erfolgreich hergestellt. Für den geplanten vollständigen Satz werden vierundzwanzig Stück benötigt."},{"type":"dialogue","speaker":"leader","lines":["Wir hatten Regenbogenleder bereits erfolgreich gefertigt. Ein bekanntes Rezept müssen wir nicht bloß zur Wiederholung noch einmal durchspielen. Ich gebe mir deshalb administrativ 24 Regenbogenleder."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine klare und sinnvolle Trennung: Die Komponente wurde früher getestet; die nun folgende Herstellung der Rüstung ist der eigentliche neue Versuch."]},{"type":"dialogue","speaker":"werner","lines":["Jou. Sonst kleben wir hier morgen noch jedes Lederstück einzeln zusammen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! VIERUNDZWANZIG! DAS SIND MEHR ALS BEIM LETZTEN POMMESABEND!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU HAST DAMALS AUCH MEHR ALS VIERUNDZWANZIG POMMES GEGESSEN!"]},{"type":"narration","text":"Die Ausgabe über die Administratorfunktionen wird im Chat bestätigt: 24 Regenbogenleder. Die Forschungsgruppe macht sich auf den Weg zurück in die Werkstatt."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Vier Rüstungsteile in leuchtendem Magenta","subtitle":"Der erfolgreiche Herstellungstest in der Rüstungsschmiede","blocks":[{"type":"narration","text":"In der Werkstatt liegen Regenbogenleder und die benötigten bereits erforschten Komponenten bereit. Der Forschungsleiter legt die Zutaten nach den Rezeptanzeigen in die Rüstungsschmiede und betätigt den Amboss."},{"type":"dialogue","speaker":"leader","lines":["Wir gehen wie gewohnt vor und stellen jedes Teil einzeln her. Zuerst der Helm."]},{"type":"narration","text":"Die Rüstungsschmiede liefert einen Regenbogen-Helm. Der Forschungsleiter nimmt ihn heraus und bereitet das nächste Rezept vor."},{"type":"dialogue","speaker":"leader","lines":["Als Nächstes der Beinschutz. Und wieder auf den Amboss klicken."]},{"type":"narration","text":"Auch der Regenbogen-Beinschutz wird erfolgreich hergestellt."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAT SIND SCHON ZWEI BUNTE TEILE!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ICH HAB MITGEZÄHLT!"]},{"type":"narration","text":"Es folgen der Brustpanzer und zuletzt die Regenbogen-Stiefel. Jedes der vier Teile erscheint wie vorgesehen im Inventar."},{"type":"dialogue","speaker":"kupferstein","lines":["Herstellungsprüfung abgeschlossen: Helm, Beinschutz, Brustpanzer und Stiefel erfolgreich gefertigt. Jetzt fehlen noch Beobachtungen beim Tragen."]},{"type":"dialogue","speaker":"casper","lines":["Die sehen sogar im Inventar fröhlich aus."]},{"type":"narration","text":"Die vier Teile sind vollständig. Ob die Farben wirklich wechseln, wird als Nächstes getestet."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Die wandelnde Farbpalette","subtitle":"Der Regenbogeneffekt zeigt sich auf den Rüstungsteilen","blocks":[{"type":"narration","text":"Der Forschungsleiter beginnt mit dem Anprobieren. Schon beim einzeln angelegten Helm zeigt sich nach kurzer Zeit ein Farbwechsel. Später zieht er weitere Teile und schließlich den Satz zusammen an."},{"type":"dialogue","speaker":"leader","lines":["Achtet genau auf meine Rüstung. Ich ziehe sie jetzt an. Moment ... schaut euch das an!"]},{"type":"narration","text":"Vor den Augen der Forschungsgruppe wechselt die Rüstung tatsächlich ihre Farbe. Grün, Türkis, Violett und Rot sind auf den festgehaltenen Bildern zu sehen. Der Farbwechsel ist keine bloße Behauptung der Beschreibung."},{"type":"dialogue","speaker":"eckart","lines":["MEEEEISTER! DER CHEF IST 'NE LAUFENDE FARBKARTE!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Wenn der so weitermacht, können wir an ihm die Wandfarbe fürs nächste Zimmer aussuchen."]},{"type":"dialogue","speaker":"huibuh","lines":["Welch prächtige Erscheinung! Meine Schatzkammer wird sich an diesen wechselnden Farben außerordentlich erfreuen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Wichtig für das Protokoll: Der Farbwechsel wurde schon beim einzelnen Helm beobachtet. Ein vollständiges Rüstungsset ist dafür nicht Voraussetzung."]},{"type":"dialogue","speaker":"leader","lines":["Genau! Wir brauchen dafür keine zusätzlichen Einzeltests zu erfinden. Das haben wir bereits gesehen."]},{"type":"dialogue","speaker":"casper","lines":["Jetzt ist sie grün ... und gleich wieder anders. Wie schön."]},{"type":"narration","text":"Die bestätigte Beobachtung lautet: Die Regenbogen-Rüstung ändert sichtbar ihre Farbe. Zusätzliche Statuseffekte wurden in dieser Untersuchung nicht berichtet."}]},{"chapter":"Kapitel 11 · Ein Regenbogen im Labor","title":"Ein Schatz, der seine Farbe nicht behält","subtitle":"Hui Buh nimmt auch die Regenbogen-Rüstung in Empfang","blocks":[{"type":"narration","text":"Nach dem Versuch legt der Forschungsleiter die vier Rüstungsteile wieder ab und bringt sie in die unterirdische Schatzkammer zurück."},{"type":"dialogue","speaker":"leader","lines":["So, Hui Buh! Lass dich nicht von der Farbe täuschen. Sie sieht jetzt anders aus als eben, aber es ist immer noch dieselbe Regenbogen-Rüstung."]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen rasselnden Ketten! Dann muss ich ja künftig nicht nur nachzählen, sondern auch geduldig auf den nächsten Farbwechsel warten!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! UND WENN DIE RÜSTUNG MORGEN GANZ ANDERS AUSSIEHT?!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN IST SIE IMMER NOCH DIESELBE RÜSTUNG, ECKAT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dat is mal ein Schatz, der sein eigenes Outfit wechselt."]},{"type":"narration","text":"Das vollständige Regenbogen-Set wird zur Sammlung gelegt. Die geprüfte Farbwechselfunktion ist dokumentiert."},{"type":"dialogue","speaker":"kupferstein","lines":["Drei zuvor untersuchte magische Rüstungsreihen und nun auch die Regenbogen-Reihe. Wir können zur nächsten Forschung übergehen."]}]},
