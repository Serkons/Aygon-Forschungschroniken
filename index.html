<script>
const PAGES = [{"chapter":"Prolog","title":"Ein ungewöhnlich ruhiger Morgen","subtitle":"Wenn sechs Fachleute eine Forschungsanlage betreten ...","blocks":[{"type":"narration","text":"Tief unter der Minecraft-Welt, verborgen zwischen mächtigen Gesteinsschichten, liegt eine Forschungsanlage, in der Wissenschaft, Magie und handwerklicher Einfallsreichtum aufeinandertreffen."},{"type":"narration","text":"Es ist ein ungewöhnlich ruhiger Morgen. Die Maschinen stehen still, die Öfen knistern leise, und irgendwo tropft Wasser in einen Eimer. Professor Kupferstein sitzt an seinem Schreibtisch und blättert in den Aufzeichnungen der letzten Forschungsarbeiten."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, ich möchte daran erinnern, dass wissenschaftlicher Fortschritt auf sorgfältiger Dokumentation beruht.","Unser Cobblestone-Generator funktioniert, Fäden und Eisengitter wurden beschafft. Als weitere Arbeitspunkte stehen Netherziegel und der Erzbrecher auf unseren Unterlagen."]},{"type":"narration","text":"Ein lautes metallisches Scheppern unterbricht ihn. Aus Richtung der Werkstatt ertönt eine Stimme, die selbst durch drei Steinwände noch deutlich zu hören wäre."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAAAART! Sach ma, wo haste denn meinen großen Schraubenschlüssel hingelegt?! Ich hab dir doch gesacht, dat Werkzeug gehört ordentlich an die Wand!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch selber inne Hand!"]},{"type":"narration","text":"Kurze Stille. Dann noch längere Stille."},{"type":"dialogue","speaker":"eckart","lines":["Meister?","Soll ich Ihnen trotzdem einen suchen?"]},{"type":"narration","text":"Professor Kupferstein nimmt seine Brille ab, putzt sie langsam und schreibt wortlos etwas in sein Notizbuch."}]},{"chapter":"Prolog","title":"Der Alles-wird-ordentlich-INATOR","subtitle":"Über Ordnung lässt sich streiten. Über Erfindungen erst recht.","blocks":[{"type":"narration","text":"In diesem Augenblick schlendert Werner in die Werkstatt. Er betrachtet das Durcheinander, grinst und lehnt sich an eine Werkbank."},{"type":"dialogue","speaker":"werner","lines":["Mensch, Röhrig! Wat brüllste denn hier so rum? Is doch noch früh am Tach!","Und du, Eckart, lass den Meister man suchen. Bewegung hält jung, nä?"]},{"type":"narration","text":"Plötzlich ertönt aus dem angrenzenden Forschungstrakt ein triumphierender Ruf."},{"type":"dialogue","speaker":"doofen","lines":["BEHOLD! Meine neueste Erfindung! Der absolut revolutionäre, wissenschaftlich nahezu perfekte ...","Ähm ... Moment. Wie hatte ich ihn noch mal genannt?"]},{"type":"narration","text":"Er dreht einen zerknitterten Zettel um."},{"type":"dialogue","speaker":"doofen","lines":["AH, JA! Der Alles-wird-endlich-ordentlich-sortiert-INATOR!","Mit diesem genialen Apparat werde ich sämtliche Unordnung in dieser Forschungsanlage beseitigen! Und danach erobere ich natürlich die gesamte Tri-State-Area! HAHAHA!"]},{"type":"narration","text":"Meister Röhrig schaut Werner an. Werner schaut Eckart an. Eckart schaut auf den Schraubenschlüssel in Röhrigs Hand. Professor Kupferstein legt seinen Füllfederhalter zur Seite. Niemand sagt ein Wort."},{"type":"narration","text":"Dann kommt aus einer dunklen Ecke des Labors ein tiefes, theatralisches Räuspern."},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei sämtlichen rostigen Ritterrüstungen meiner Ahnen! Ein Gerät, das Ordnung schafft? In DIESEM Labor?","Mein lieber Doktor, da wäre selbst die königliche Schlossverwaltung überfordert!","Und ich hoffe INSTÄNDIG, dass dieses Ding nicht wieder explodiert. Meine letzte Geisterrobe riecht noch immer nach verkohltem Redstone!"]},{"type":"narration","text":"Dr. Doofenshmirtz öffnet empört den Mund. Werner beginnt zu lachen. Eckart versucht unauffällig, den Schraubenschlüssel aus Meister Röhrigs Hand zu nehmen. Der Meister bemerkt es."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! NU LASS DOCH MAL MEIN WERKZEUG IN RUHE!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, Sie ham doch gerade ...","Ja, Meister."]}]},{"chapter":"Prolog","title":"Ein Augenblick der Ruhe","subtitle":"Die wissenschaftliche Disziplin hält vier Sekunden.","blocks":[{"type":"narration","text":"Professor Kupferstein steht auf. Er geht langsam zum großen Forschungstisch, legt sein Notizbuch darauf und schaut der Reihe nach in die Gesichter seiner Kollegen."},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren."]},{"type":"narration","text":"Niemand reagiert."},{"type":"dialogue","speaker":"kupferstein","lines":["MEINE HERREN!"]},{"type":"narration","text":"Schlagartig verstummen alle."},{"type":"dialogue","speaker":"kupferstein","lines":["Wir haben hier eine bemerkenswerte Forschungsanlage. Wir haben Materialien, Werkzeuge, Maschinen und eine ganze Welt voller ungelöster Fragen.","Was wir allerdings dringend benötigen, ist ein Mindestmaß an wissenschaftlicher Disziplin."]},{"type":"narration","text":"Doofenshmirtz hebt vorsichtig einen Finger."},{"type":"dialogue","speaker":"doofen","lines":["Gilt das auch für meine Inatoren?"]},{"type":"dialogue","speaker":"kupferstein","lines":["GANZ BESONDERS für Ihre Inatoren!"]},{"type":"narration","text":"Hui Buh beginnt lautlos zu kichern. Werner setzt sich auf eine Kiste. Eckart findet endlich einen freien Platz für seinen Schraubenschlüssel. Meister Röhrig kontrolliert misstrauisch, ob dieser auch ordentlich liegt."},{"type":"narration","text":"Professor Kupferstein schlägt das Forschungsbuch auf der nächsten freien Seite auf. Mit sorgfältiger Handschrift setzt er eine neue Überschrift darunter: „Aygon-Forschungschroniken: Die nächsten Entdeckungen“."},{"type":"narration","text":"Sechs höchst unterschiedliche Gestalten versammeln sich um den Tisch. Und zum ersten Mal an diesem Morgen herrscht tatsächlich Stille. Jedenfalls für ungefähr vier Sekunden."},{"type":"dialogue","speaker":"eckart","lines":["Meister?"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN NU SCHON WIEDER, ECKART?!"]},{"type":"dialogue","speaker":"eckart","lines":["Wer macht eigentlich Kaffee?"]},{"type":"end","text":"Fortsetzung folgt ..."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Das große Trockenlegen","subtitle":"Teil 1: Regen, eine heimliche Idee und eine sehr stille Werkstatt","blocks":[{"type":"narration","text":"Ein neuer Tag beginnt im unterirdischen Aygon-Forschungslabor. Über der Minecraft-Welt hängen schwere Regenwolken. Bald trommelt der Regen auf den Boden, während tief darunter sechs Kollegen noch friedlich schlafen. Nur der Forschungsleiter ist schon wach."},{"type":"narration","text":"Er steht am Treppenabgang zur Werkstatt und betrachtet das Ergebnis der letzten Umbauarbeiten. Es ist nicht alles schlecht, aber die Wege sind eng, die Arbeitsplätze ungünstig verteilt und das viele Wasser stört. Vor allem aber hatte man bereits Ärger mit Endermen gehabt. Deshalb soll die Werkstatt niedriger und übersichtlicher werden."},{"type":"dialogue","speaker":"leader","lines":["Nein, meine lieben Freunde. Wir wollen hier forschen und keine Unterwasserexpedition veranstalten. Und auf unerwartete Besuche von Endermen kann ich ebenfalls verzichten."]},{"type":"narration","text":"Der Forschungsleiter lässt den Blick über die Wände wandern. Dann bleibt er gedankenverloren vor dem altbekannten Erzwäscher stehen. Das charakteristische Gesicht an der Maschine blickt ihn an, als wollte es fragen, weshalb sie schon wieder umziehen muss."},{"type":"dialogue","speaker":"leader","lines":["Warte mal ... wenn ich den Raum niedriger halte und den Kessel ein Stück in den Boden einlasse, bleibt der Erzwäscher benutzbar, ohne so hoch in den Raum zu ragen. Ja, genau so machen wir das!"]},{"type":"narration","text":"Die Idee gefällt ihm. Während draußen der Regen zunimmt und seine Kollegen immer noch schlafen, holt er Werkzeug und beginnt mit der Arbeit."},{"type":"narration","text":"Steinblöcke werden herausgenommen und neu gesetzt. Ein heller, engerer Zugang entsteht; eine Holztür trennt die Treppe von der Werkstatt. Die Decke bleibt bewusst niedrig, denn die früheren Schwierigkeiten mit den Endermen sollen sich nicht wiederholen."},{"type":"narration","text":"Das Wasser wird aus den störenden Bereichen entfernt. Der Forschungsleiter gestaltet die trockenen Laufwege neu, passt die Beleuchtung an und verteilt die Arbeitsstationen so, dass sie trotz der geringeren Raumhöhe gut erreichbar bleiben."},{"type":"narration","text":"Besondere Aufmerksamkeit erhält der Erzwäscher. Sein Kessel wird tiefer in den Boden eingesetzt. Das auffällige Gesicht der Maschine bleibt sichtbar, aber die gesamte Konstruktion wirkt nun deutlich weniger hoch."},{"type":"dialogue","speaker":"leader","lines":["So. Du bist immer noch unser Erzwäscher und kein geheimnisvoller Wächter. Aber wenigstens stehst du jetzt nicht mehr mitten im Weg."]},{"type":"narration","text":"Anschließend kontrolliert er den angrenzenden Bereich. Der Cobblestone-Generator steht weiterhin im hinteren, separaten Raum. Auch der Schmelzkessel hat seinen festen Platz. Hier wird heute nichts erforscht oder neu ausprobiert; es geht ausschließlich darum, die Werkstatt vernünftig einzurichten."},{"type":"narration","text":"Als er schließlich fertig ist, leuchten die Fackeln auf helle Steinwände und einen trockenen Boden. Der Forschungsleiter tritt zurück und nickt zufrieden."},{"type":"dialogue","speaker":"leader","lines":["Na also. Geht doch! Und diesmal hat mir niemand erklärt, dass ein zusätzlicher Hebel die Lösung für sämtliche Probleme wäre."]},{"type":"narration","text":"Er löscht sein Arbeitslicht am Gang, lässt die Werkstatt in Ruhe und beschließt, die Überraschung bis zum nächsten Morgen für sich zu behalten."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Die Überraschung hinter der Tür","subtitle":"Teil 2: Sechs Kollegen, eine neue Werkstatt und die große Wasserfrage","blocks":[{"type":"narration","text":"Am nächsten Morgen ist im Forschungslabor die gewohnte Geräuschkulisse zurückgekehrt. Werner sitzt mit einer Tasse Kaffee am Tisch. Professor Kupferstein blättert in seinen Notizen. Hui Buh schwebt verschlafen über den Stühlen, während Dr. Doofenshmirtz bereits eine neue Erfindung skizziert."},{"type":"narration","text":"Meister Röhrich durchsucht seinen Werkzeugkasten. Eckart steht in sicherem Abstand daneben."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WO IS MEIN SCHRAUBENSCHLÜSSEL?!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch gestern selbst weggelegt!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ABER WO?!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Vielleicht hat er sich aus Angst vor dir versteckt, Röhrich!"]},{"type":"narration","text":"In diesem Moment kommt der Forschungsleiter herein. Sein zufriedenes Lächeln macht die Kollegen sofort misstrauisch."},{"type":"dialogue","speaker":"leader","lines":["Guten Morgen, meine lieben Freunde! Ich habe eine Überraschung für euch. Wenn ihr mir bitte folgen würdet?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Mir sind in der vergangenen Nacht ungewöhnliche Arbeitsgeräusche aufgefallen. Nun bin ich allerdings gespannt."]},{"type":"dialogue","speaker":"eckart","lines":["Ich hab gedacht, dat sind wieder Monster!"]},{"type":"dialogue","speaker":"huibuh","lines":["Monster? In unserem Labor? Eine Unverschämtheit! Für gepflegte Schreckensauftritte bin immer noch ich zuständig!"]},{"type":"dialogue","speaker":"doofen","lines":["Eine Überraschung! Ist es eine neue Maschine? Ein Geheimlabor? Vielleicht mein lang ersehnter Selbstzerstörungs-Inator?"]},{"type":"dialogue","speaker":"roehrig","lines":["DOOFENSHMIRTZ! HIER ZERSTÖRT SICH HEUTE ÜBERHAUPT NIX!"]},{"type":"narration","text":"Der Forschungsleiter führt die Gruppe zur Holztür am Treppenabgang. Er öffnet sie, und die Kollegen steigen hintereinander hinunter. Unten angekommen bleiben alle wie angewurzelt stehen."},{"type":"narration","text":"Ein trockener Steinboden, helle Wände, mehrere Fackeln und übersichtliche Arbeitsplätze liegen vor ihnen. Nichts erinnert mehr an die störenden Wasserflächen."},{"type":"dialogue","speaker":"eckart","lines":["Äh, Meister? WO IS DAT GANZE WASSER HIN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN FÜR WASSER, ECKAT? DAT IS DOCH NICH MEHR DA!"]},{"type":"dialogue","speaker":"werner","lines":["Hömma! Hier kann man ja plötzlich laufen, ohne Schwimmflügel anzuziehen!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen dreizehn rostigen Rasselketten! Welch eine Verwandlung! Das ist ja beinahe eine ehrwürdige Forschungsanstalt!"]},{"type":"dialogue","speaker":"leader","lines":["Genau das war der Plan. Ich habe das Wasser entfernt, die Zugänge verbessert und die Werkstatt neu angeordnet."]},{"type":"dialogue","speaker":"eckart","lines":["Ja, aber ... WOHIN haben Sie dat Wasser gebracht?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT WASSER HAT NICH GEKÜNDIGT UND AUCH KEINE NEUE ADRESSE HINTERLASSEN!"]},{"type":"narration","text":"Werner lacht so laut, dass er sich am nächsten Arbeitstisch festhalten muss. Professor Kupferstein geht inzwischen langsam durch den Raum und begutachtet die Umbauten."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Arbeitswege sind deutlich übersichtlicher. Und die geringere Raumhöhe ist offenbar eine bewusste Entscheidung."]},{"type":"dialogue","speaker":"leader","lines":["Richtig. Wir hatten schließlich schon Probleme mit Endermen. Deshalb habe ich den Raum verkleinert und die Maschinen möglichst platzsparend angeordnet."]},{"type":"narration","text":"Eckart starrt an die niedrige Decke."},{"type":"dialogue","speaker":"eckart","lines":["Meister, heißt dat, die Endermen müssen jetzt draußen bleiben?"]},{"type":"dialogue","speaker":"werner","lines":["Na, Eckat, vielleicht müssen sie an der Tür erst den Kopf einziehen!"]},{"type":"dialogue","speaker":"roehrig","lines":["UND DU ZIEHST JETZT MAL DEINEN EIGENEN KOPF EIN, WERNER!"]},{"type":"narration","text":"Der Forschungsleiter kann sich ein Lachen nicht verkneifen. So ordentlich der Raum nun auch aussieht: Seine Kollegen haben sich kein bisschen verändert."}]},{"chapter":"Kapitel 1 · Das große Trockenlegen","title":"Der Erzwäscher und die große Wasserfrage","subtitle":"Teil 3: Eine tiefergelegte Maschine und sechs sehr unterschiedliche Meinungen","blocks":[{"type":"narration","text":"Dann fällt Hui Buhs Blick auf das große, bekannte Gesicht einer Maschine in der Werkstatt. Er bleibt davor schweben und legt den Kopf schief."},{"type":"dialogue","speaker":"huibuh","lines":["Moment! Dieses Gesicht kenne ich doch! Aber ... stand das nicht vorher ein wenig höher?"]},{"type":"dialogue","speaker":"doofen","lines":["Eine schrecklich geniale Idee! Ein tiefergelegter Maschinenwächter! Daraus könnte ich einen Alles-beobachten-und-den-Nachbarn-erschrecken-Inator entwickeln!"]},{"type":"dialogue","speaker":"leader","lines":["Nein, Herr Doktor. Das ist nach wie vor unser altbekannter Erzwäscher. Ich habe lediglich seinen Kessel ein Stück in den Boden eingesetzt, damit die gesamte Maschine bei der niedrigen Decke weniger weit nach oben ragt."]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine vernünftige bauliche Anpassung. Die Maschine bleibt dieselbe; nur ihre Aufstellung wurde verändert."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER ERZWÄSCHER IS TIEFERGELEGT!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT HAM WA GERADE GEHÖRT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Fehlen bloß noch die breiten Reifen und 'n Auspuff!"]},{"type":"dialogue","speaker":"doofen","lines":["Ein Erzwäscher mit Sportfahrwerk! Hervorragend! Das könnte sogar mein nächster Inator werden!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU MACHST AN DEM DING GAR NIX!"]},{"type":"narration","text":"Der Forschungsleiter zeigt den Kollegen anschließend den Weg in den hinteren Raum. Dort befindet sich weiterhin der Cobblestone-Generator, ordentlich vom übrigen Werkstattbereich getrennt."},{"type":"dialogue","speaker":"leader","lines":["Hier hinten steht unser Cobblestone-Generator. An ihm habe ich jetzt keinen neuen Versuch durchgeführt. Es geht nur darum, dass wir besser an alles herankommen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Sehr gut. Wir trennen also die bauliche Verbesserung von den eigentlichen Funktionstests. Das sollte auch in unseren Aufzeichnungen so stehen."]},{"type":"dialogue","speaker":"eckart","lines":["Und wenn hier wieder Wasser auftaucht?"]},{"type":"dialogue","speaker":"werner","lines":["Denn kriegt's 'n eigenes Zimmer, Eckat!"]},{"type":"narration","text":"Als Nächstes geht es zum Schmelzkessel. Sein dunkler, oben offener Kessel steht an seinem vorgesehenen Platz im trockenen Arbeitsbereich."},{"type":"dialogue","speaker":"leader","lines":["Und hier haben wir unseren Schmelzkessel. Auch der gehört natürlich weiterhin zur Werkstatt. Ich habe die Umgebung freigeräumt, damit wir uns bei der Arbeit nicht gegenseitig auf die Füße treten."]},{"type":"dialogue","speaker":"huibuh","lines":["Wie wohltuend! Eine Werkstatt, in der man umhergeistern kann, ohne plötzlich in einem Wasserbecken gespiegelt zu werden!"]},{"type":"dialogue","speaker":"doofen","lines":["Ich könnte den Schmelzkessel mit einem automatischen Konfettiwerfer kombinieren. Für besonders feierliche Metallverarbeitung!"]},{"type":"dialogue","speaker":"roehrig","lines":["WENN DU DA KONFETTI REINWIRFST, SCHMELZ ICH DIR DEINEN INATOR GLEICH MIT EIN!"]},{"type":"narration","text":"Eckart entdeckt unterdessen die Eisentür und ihren Knopf. Er nähert sich langsam, als wäre er einem kostbaren wissenschaftlichen Fundstück auf der Spur."},{"type":"dialogue","speaker":"eckart","lines":["Meister?"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber ich hab doch noch gar nix gesagt!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU STEHST VOR 'NEM KNOPF, ECKAT! DAT REICHT MIR SCHON!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Pass auf, Eckat, dat is bestimmt die Klingel vom Finanzamt!"]},{"type":"dialogue","speaker":"eckart","lines":["Echt jetzt?!"]},{"type":"dialogue","speaker":"roehrig","lines":["WERNER! HÖR AUF, DEM JUNGEN SO 'N BLÖDSINN ZU ERZÄHLEN!"]},{"type":"narration","text":"Schließlich versammelt der Forschungsleiter seine Kollegen wieder in der Werkstatt. Der Regen draußen hat nachgelassen, und die Fackeln werfen warmes Licht auf den frisch geordneten Steinboden."},{"type":"dialogue","speaker":"leader","lines":["Nun, meine lieben Freunde. Was sagt ihr zu unserer neuen Werkstatt?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Eine sehr gelungene Verbesserung. Für unsere kommenden Versuche haben wir jetzt wesentlich übersichtlichere Arbeitsbedingungen."]},{"type":"dialogue","speaker":"huibuh","lines":["Ein prachtvolles unterirdisches Refugium! Ich bin begeistert!"]},{"type":"dialogue","speaker":"werner","lines":["Jo, saubere Arbeit. Endlich keine Schwimmwesten mehr beim Handwerken!"]},{"type":"dialogue","speaker":"doofen","lines":["Großartig! Und ich habe schon siebenundvierzig Vorschläge, wie man alles wieder umbauen könnte!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN!"]},{"type":"dialogue","speaker":"doofen","lines":["Aber Sie kennen die Vorschläge doch noch gar nicht!"]},{"type":"dialogue","speaker":"roehrig","lines":["DAT MACHT'S JA GERADE SO GEFÄHRLICH!"]},{"type":"narration","text":"Meister Röhrich betrachtet die niedrige Decke, den tiefer eingesetzten Erzwäscher und die ordentlich verteilten Arbeitsplätze. Schließlich nickt er anerkennend."},{"type":"dialogue","speaker":"roehrig","lines":["Also, Herr Forschungsleiter, dat muss ich Ihnen lassen: Dat ham Sie ordentlich hingekriegt. Hier kann man endlich wieder vernünftig arbeiten."]},{"type":"dialogue","speaker":"leader","lines":["Vielen Dank, Meister Röhrich. Dann können wir ja bald unsere nächsten Experimente beginnen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER!"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT DENN NU NOCH?!"]},{"type":"dialogue","speaker":"eckart","lines":["Wenn die Werkstatt jetzt ganz trocken is ... wo sollen wir denn dann die Fische halten?"]},{"type":"narration","text":"Absolute Stille. Professor Kupferstein lässt sein Notizbuch sinken. Hui Buh bleibt mitten in der Luft stehen. Werner prustet los."},{"type":"dialogue","speaker":"doofen","lines":["Fische? Natürlich! Mein neuer Fisch-auf-Knopfdruck-Inator!"]},{"type":"dialogue","speaker":"roehrig","lines":["EEEECKAAAAAT!!!"]},{"type":"narration","text":"Und während Werner vor Lachen kaum noch stehen kann, ist eines sicher: Die neue Aygon-Werkstatt ist trocken, niedriger, besser organisiert und bereit für die nächste Forschung. Gegen das Chaos ihrer Bewohner hilft allerdings auch der beste Umbau nicht."},{"type":"end","text":"Ende des ersten Werkstattkapitels"}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Wozu hatten wir eigentlich den Steingenerator gebaut?","subtitle":"Teil 1: Ein Forschungsleiter sucht den roten Faden","blocks":[{"type":"narration","text":"In der neu eingerichteten Aygon-Werkstatt ist wieder Ruhe eingekehrt. Der Erzwäscher steht tiefer im Boden, der Schmelzkessel an seinem Platz und der Cobblestone-Generator wartet im hinteren Raum auf Arbeit. Doch der Forschungsleiter steht nachdenklich vor seinen Kollegen."},{"type":"dialogue","speaker":"leader","lines":["Nun gut, meine Herren! Der Umbau ist gelungen. Aber ich habe eine Frage: Wo waren wir eigentlich mit unserer Forschung stehen geblieben? Ich erinnere mich noch an den Cobblestone-Generator, nur nicht mehr daran, weshalb wir ihn gebaut haben."]},{"type":"narration","text":"Professor Kupferstein legt seinen Stift zur Seite. Werner stellt die Kaffeetasse ab. Eckart reißt die Augen auf."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER CHEF HAT VERGESSEN, WARUM WIR STEINE MACHEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU VERGISST DOCH SELBER MANCHMAL, WARUM DU 'N RAUM BETRETEN HAST!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hol mal die Forschungsakten, Kupferstein, bevor Eckat anfängt, jeden Bruchstein einzeln zu verhören!"]},{"type":"narration","text":"Professor Kupferstein zieht das Forschungsjournal heran und schlägt die Seiten über die letzten Arbeiten auf."},{"type":"dialogue","speaker":"kupferstein","lines":["Der Cobblestone-Generator wurde gebaut, damit wir Bruchstein fortlaufend gewinnen können, ohne jedes Mal neue Vorkommen suchen zu müssen. Das Auffangsystem hatten wir bereits erprobt: Bei einem dokumentierten Test wurden siebzehn Bruchsteine abgebaut und alle siebzehn eingesammelt."]},{"type":"dialogue","speaker":"leader","lines":["Ach ja! Und die Steine waren nicht einfach nur für die Bauarbeiten gedacht."]},{"type":"dialogue","speaker":"kupferstein","lines":["Richtig. Wir brauchten eine dauerhafte Rohstoffquelle für weitere Verarbeitungsschritte und schließlich für unseren geplanten Erzbrecher. Dafür fehlten uns noch bestimmte Bauteile."]},{"type":"dialogue","speaker":"doofen","lines":["Ein Erzbrecher? Ich hätte da auch einen ALLES-ZU-KIESELZERKLEINER-INATOR! Er besitzt sogar einen Hebel, der absolut nichts bewirkt!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN LASS DEN HEBEL AUCH IN RUHE!"]},{"type":"narration","text":"Der Professor blättert weiter. In den Notizen stehen bereits hergestellte Eisengitter, die beschafften Fäden und die noch offenen Netherziegel-Bauteile."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Eisengitter wurden bereits hergestellt. Auch unsere Spinnenexpedition zur Beschaffung weiterer Fäden ist abgeschlossen. Der nächste Engpass war die Netherziegelverarbeitung. Wir sollten also zuerst die dafür benötigten Rohstoffe herstellen."]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen rostigen Rasselketten! Ein Forschungsjournal, das gegen Gedächtnislücken hilft. Welch vortreffliche Erfindung!"]},{"type":"dialogue","speaker":"werner","lines":["Jo, solange Eckat dat Buch nich aus Versehen in den Ofen steckt!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WER STECKT DENN 'N BUCH IN DEN OFEN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WENN DU SCHON SO FRAGST, KRIEG ICH ANGST!"]},{"type":"narration","text":"Der Forschungsleiter betrachtet den Gang zum Generator und muss grinsen. Der rote Faden ist wiedergefunden. Es fehlt jetzt nicht an Ideen, sondern an Material."},{"type":"dialogue","speaker":"leader","lines":["Dann wissen wir ja wieder, weshalb wir so viel Bruchstein brauchen. An die Arbeit, meine Freunde!"]},{"type":"narration","text":"Professor Kupferstein trägt das nächste Vorhaben sorgfältig ein: Bruchstein zu Stein brennen, den Stein wie vorgesehen im Komposter zu Netherrack verarbeiten und daraus die benötigten Netherziegel gewinnen."}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Fünfundzwanzig Steine und eine zerbrochene Spitzhacke","subtitle":"Teil 2: Der Ofen glüht, der Generator liefert und der Komposter überrascht","blocks":[{"type":"narration","text":"Wenig später brennt in der Forschungswerkstatt der Ofen. Der Forschungsleiter hat fünfundzwanzig Bruchsteine hineingelegt. Kohle sorgt für die nötige Hitze."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren! Während die Steine brennen, kann ich gleich neuen Bruchstein beschaffen. Wir wollen die Wartezeit ja nicht vertrödeln."]},{"type":"dialogue","speaker":"werner","lines":["Joa! Der Ofen arbeitet, du arbeitest, und Eckat ... na, der könnte vielleicht mal das Arbeiten beobachten!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH KANN AUCH ARBEITEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN HÖR AUF ZU BRÜLLEN UND LASS DEN GENERATOR IN RUHE LAUFEN!"]},{"type":"narration","text":"Der Forschungsleiter geht in den hinteren Raum zum Cobblestone-Generator. Immer wieder baut er nachwachsenden Bruchstein ab, während der Ofen in der Werkstatt weiterglüht. Die Zeit vergeht. Schließlich gibt die Spitzhacke ihren letzten Schlag ab und zerbricht."},{"type":"dialogue","speaker":"leader","lines":["Na wunderbar. Die Spitzhacke ist hinüber. Dann schauen wir doch einmal, was unser Generator in der Zwischenzeit geliefert hat."]},{"type":"narration","text":"In der Auffangtruhe liegen siebenundfünfzig Bruchsteine. Der Forschungsleiter sieht zufrieden auf den Vorrat."},{"type":"dialogue","speaker":"kupferstein","lines":["Siebenundfünfzig Bruchsteine in der Truhe. Das ist ein erfreulicher Zwischenstand. Die Werkzeughaltbarkeit sollten wir für spätere Arbeitsabläufe allerdings im Blick behalten."]},{"type":"dialogue","speaker":"doofen","lines":["Werkzeughaltbarkeit? Genau dafür habe ich meinen NIE-WIEDER-EINE-SPITZHACKE-ANFASSEN-INATOR entworfen!"]},{"type":"dialogue","speaker":"werner","lines":["Und wat macht der?"]},{"type":"dialogue","speaker":"doofen","lines":["Das weiß ich noch nicht. Aber der Name ist hervorragend!"]},{"type":"dialogue","speaker":"roehrig","lines":["ERST MAL BRAUCHEN WIR 'NE NORMALE NEUE SPITZHACKE!"]},{"type":"narration","text":"Als der Forschungsleiter zum Ofen zurückkehrt, müssen nur noch fünf der ursprünglich fünfundzwanzig Bruchsteine gebrannt werden. Kurz darauf ist der Durchlauf vollständig abgeschlossen. Fünfundzwanzig Steine sind fertig."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön. Alle fünfundzwanzig Steine sind durchgebrannt. Jetzt folgt unser nächster Verarbeitungsschritt im Komposter."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! STEINE IN 'N KOMPOSTER? DAT IS DOCH KEIN GEMÜSE!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IS UNSERE FORSCHUNG, NICH DEIN SALATBEET!"]},{"type":"narration","text":"Der Forschungsleiter verarbeitet die fünfundzwanzig Steine im Komposter. Am Ende liegen sechs Netherrack vor ihm. Ein weiterer tatsächlich durchgeführter Schritt ist erfolgreich dokumentiert."},{"type":"dialogue","speaker":"kupferstein","lines":["Ergebnis des Versuchs: fünfundzwanzig gebrannte Steine eingesetzt, sechs Netherrack erhalten. Ein Stein bleibt bei der rechnerischen Zuordnung von vier Steinen pro Netherrack übrig. Die Ausbeute dieses Durchlaufs ist bestätigt."]},{"type":"dialogue","speaker":"huibuh","lines":["Welch wundersame Verwandlung! Erst ein grauer Stein, dann ein gebrannter Stein, und nun etwas, das nach einem Ausflug in die Unterwelt aussieht!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hauptsache, Eckat steckt nicht als Nächstes seinen Stiefel in den Komposter!"]},{"type":"dialogue","speaker":"eckart","lines":["Wieso sollte ich dat denn machen?"]},{"type":"dialogue","speaker":"roehrig","lines":["FRAG DAT LIEBER NICH, ECKAT!"]},{"type":"narration","text":"Professor Kupferstein notiert die Zahlen sorgfältig: fünfundzwanzig Steine verarbeitet, sechs Netherrack gewonnen, eine Spitzhacke beim Nachschubabbau verschlissen. Die eigentliche Herstellung der Netherziegel steht noch aus."}]},{"chapter":"Kapitel 2 · Zurück zur Forschung","title":"Werner, die Kohle und die vier fehlenden Netherrack","subtitle":"Teil 3: Materialrechnung statt Inator, der nächste Ofendurchlauf ist vorbereitet","blocks":[{"type":"narration","text":"Noch ehe jemand den nächsten Ofen beschickt, hebt der Forschungsleiter die Hand. Er erinnert seine Kollegen an eine Rechnung, die längst im Forschungsjournal stehen müsste."},{"type":"dialogue","speaker":"leader","lines":["Mein lieber Herr Doktor Kupferstein, wir hatten den Materialbedarf doch schon früher nachgeschaut! Für den Erzbrecher brauchen wir einen Netherziegelzaun, einen Dispenser und zwei Eisengitter."]},{"type":"narration","text":"Professor Kupferstein sieht nach und nickt. Die Angaben für den Netherziegelzaun sind ebenfalls bereits festgehalten."},{"type":"dialogue","speaker":"leader","lines":["Für den Zaun brauchen wir zwei einzelne Netherziegel und zwei Netherziegelblöcke. In jedem Block stecken vier Netherziegel. Das macht insgesamt zehn."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ganz richtig. Zwei plus zweimal vier ergibt zehn Netherziegel. Da wir bisher sechs Netherrack hergestellt haben, fehlen uns noch vier Stück für diese Materialplanung."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DEM CHEF FEHLEN VIER STEINE!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN, ECKAT! VIER NETHERRACK! DAT IS NICHT DATSELBE!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Und du brauchst auch nich versuchen, die vier aus dem Boden zu schütteln!"]},{"type":"narration","text":"Der Forschungsleiter betrachtet seinen neuen Bruchsteinvorrat. Er hat fünfundfünfzig Blöcke für den nächsten Ofendurchlauf vorgesehen. Im Ofen sind noch vier Stück Kohle vorhanden."},{"type":"dialogue","speaker":"leader","lines":["Dann würde ich jetzt die fünfundfünfzig Bruchsteine in den Ofen geben. Mal sehen, ob die vier Kohle wenigstens genug Stein für die fehlenden vier Netherrack liefern. Werner, du bist doch unser Rechengenie!"]},{"type":"narration","text":"Werner zieht einen Bleistift hervor und malt vier große Kreise auf ein Stück Papier."},{"type":"dialogue","speaker":"werner","lines":["Na, Chef, dat is einfach: Ein Netherrack kostet vier Steine. Vier Netherrack mal vier Steine macht sechzehn. Dafür brauchen wir sechzehn gebrannte Steine."]},{"type":"dialogue","speaker":"kupferstein","lines":["Und ein Stück Kohle reicht im gewöhnlichen Ofen für acht Schmelzvorgänge. Zwei Kohle genügen also für sechzehn Bruchsteine. Vier Kohle könnten insgesamt zweiunddreißig Bruchsteine schmelzen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DANN REICHT DAT JA!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND WAT FÜR 'N WUNDER: WIR HABEN HEUTE SOGAR OHNE EXPLOSION GERECHNET!"]},{"type":"dialogue","speaker":"doofen","lines":["Ohne Explosion? Wie enttäuschend. Ich könnte den Ofen mit meinem UNENDLICH-KOHLE-AUS-DEM-NICHTS-INATOR verbessern!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dann lass uns erst mal gucken, ob du überhaupt Kohle von Konfetti unterscheiden kannst!"]},{"type":"dialogue","speaker":"huibuh","lines":["Wie beruhigend! Ein gewaltiger Vorrat Bruchstein, ein planvoller Forschungsleiter und ein Ofen, der nur noch angefeuert werden muss. Ich halte mich vorsichtshalber trotzdem in der Nähe des Ausgangs auf!"]},{"type":"narration","text":"Professor Kupferstein notiert die Rechnung unter dem letzten Versuch: vier weitere Netherrack erfordern bei der besprochenen Umwandlung sechzehn gebrannte Steine. Vier Stück Kohle hätten dafür genügend Brenndauer. Ein neuer Schmelz- oder Komposterdurchlauf wurde an dieser Stelle aber noch nicht als abgeschlossen gemeldet."},{"type":"dialogue","speaker":"kupferstein","lines":["Damit sind unsere nächsten Handgriffe klar. Zuerst die fehlenden sechzehn Steine bereitstellen und in vier weitere Netherrack umwandeln. Erst danach prüfen wir die Herstellung der Netherziegel und schließlich des Netherziegelzauns."]},{"type":"dialogue","speaker":"leader","lines":["Ausgezeichnet, meine Freunde! Dann haben wir endlich wieder einen vernünftigen Arbeitsplan."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! UND WER MACHT DIE NÄCHSTE SPITZHACKE?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT IST JETZT DEINE ERSTE VERNÜNFTIGE FRAGE!"]},{"type":"narration","text":"Werner lacht, Professor Kupferstein lächelt zufrieden, und irgendwo hinter der Werkstatt wartet der Cobblestone-Generator geduldig auf seinen nächsten Einsatz. Der Forschungsfaden ist wieder aufgenommen."},{"type":"end","text":"Fortsetzung folgt: Die fehlenden Netherziegel"}]},{"chapter":"Kapitel 3 · Der Erzbrecher rückt näher","title":"Der Zaun, der keiner werden wollte","subtitle":"Teil 1: Zwölf Netherziegel, ein Rechenfehler und ein fehlender Brennstoffvorrat","blocks":[{"type":"narration","text":"In der unterirdischen Aygon-Werkstatt glüht der Ofen. Endlich sind die zuvor vorbereiteten Netherrack vollständig gebrannt. Der Forschungsleiter holt zwölf Netherziegel heraus und legt sie vor seinen Kollegen auf die Werkbank."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren! Zwölf Netherziegel sind erfolgreich hergestellt worden. Jetzt wollen wir daraus den Netherziegelzaun für unseren Erzbrecher fertigen!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ZWÖLF ZIEGEL! DAT MUSS DOCH REICHEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! WENN KUPFERSTEIN RICHTIG GERECHNET HAT!"]},{"type":"narration","text":"Der Forschungsleiter legt die bereits vorbereiteten Netherziegelblöcke und einzelne Netherziegel in die Werkbank. Doch das Ausgabefeld bleibt leer. Kein Zaun. Nicht einmal ein einzelnes Zaunstück."},{"type":"dialogue","speaker":"leader","lines":["Moment mal ... da stimmt etwas nicht. Wir haben uns offenbar verrechnet."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Da ham wa zwölf Ziegel, aber keinen Zaun. Dat is 'ne ziemlich luftige Grundstücksgrenze!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Einen Augenblick. Ich überprüfe unsere bisherige Materialrechnung ... Tatsächlich! Wir haben zwei Netherziegelblöcke unterschlagen."]},{"type":"narration","text":"Professor Kupferstein rückt seine Brille zurecht und schreibt die richtige Anordnung auf: Vier Netherziegelblöcke und zwei einzelne Netherziegel ergeben in der Werkbank sechs Netherziegelzäune. Jeder Block besteht aus vier einzelnen Netherziegeln."},{"type":"dialogue","speaker":"kupferstein","lines":["Vier mal vier plus zwei ergibt achtzehn Netherziegel. Nicht zehn, wie wir zunächst angenommen hatten. Unsere frühere Rechnung war falsch."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER PROFESSOR KANN NICH RECHNEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WIR HABEN ALLE NICH RICHTIG HINGEGUCKT!"]},{"type":"dialogue","speaker":"doofen","lines":["Für solche Fälle habe ich einen RECHENFEHLER-VERHINDERUNGS-INATOR entworfen!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Der zählt bestimmt bis hundert und vergisst dabei die achtzehn!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen klappernden Ketten! Welch ein Drama! Wir haben genug Material für eine halbe Festungsmauer, aber nicht für einen winzigen Zaun!"]},{"type":"dialogue","speaker":"leader","lines":["Dann fehlen uns nach den zwölf bereits hergestellten Netherziegeln eben noch sechs. Dafür brauchen wir erneut Netherrack."]},{"type":"narration","text":"Alle blicken zum Ofen. Doch der Brennstoffvorrat ist inzwischen erschöpft. Meister Röhrich stützt die Hände in die Hüften."},{"type":"dialogue","speaker":"roehrig","lines":["NA HERRLICH! ERST FEHLEN ZIEGEL, UND NU HAM WA KEINE KOHLE MEHR!"]},{"type":"dialogue","speaker":"leader","lines":["Dann lösen wir das nächste Problem. Eckart, schnapp dir deine Axt und besorg uns Holz!"]},{"type":"dialogue","speaker":"eckart","lines":["ICH?! HOLZ?! ABER MEISTER ..."]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! AB NACH DRAUSSEN!"]},{"type":"narration","text":"Damit ist die Arbeit für den Tag überraschend klar verteilt: Der Professor hält die richtige Rechnung fest, Werner grinst, und Eckart soll die Brennstoffversorgung retten."}]},{"chapter":"Kapitel 3 · Der Erzbrecher rückt näher","title":"Eckarts nächtliche Holzexpedition","subtitle":"Teil 2: Acht Birkenstämme, ein Zombiegeräusch und ein Phantom","blocks":[{"type":"narration","text":"Vor dem Aufbruch kontrolliert der Forschungsleiter noch einmal Eckarts Ausrüstung. Dabei fällt ihm etwas Entscheidendes auf: Im Inventar ist überhaupt keine Axt."},{"type":"dialogue","speaker":"leader","lines":["Eckart, Moment! Du hast ja gar keine Axt. Kein Problem, ich stelle dir schnell eine her. Schließlich sollst du nicht mit leeren Händen nach oben gehen."]},{"type":"dialogue","speaker":"eckart","lines":["Ja, Herr Forschungsleiter! Aber dat hätt ich fast vergessen!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! HOLZ HOLEN OHNE AXT! WAT KOMMT DENN ALS NÄCHSTES?!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Vielleicht wollte er die Bäume freundlich fragen, ob sie freiwillig umfallen!"]},{"type":"narration","text":"Der Forschungsleiter reicht Eckart eine frisch hergestellte Axt. Mit seinem Werkzeug in der Hand steigt der Forschungsassistent die steinerne Treppe hinauf. Diesmal ist es draußen Nacht."},{"type":"narration","text":"Zwischen den hohen Erdwänden des Eingangs schimmert ein fremdartig schöner Sternenhimmel. Ein schmaler Mond steht über dem Wald, und die Fackeln werfen ihr warmes Licht auf die Gräser."},{"type":"dialogue","speaker":"eckart","lines":["Na, dat sieht ja friedlich aus. Keine Gefahr in Sicht. Gut ... denn wollen wir mal!"]},{"type":"narration","text":"Eckart nähert sich vorsichtig einer Birke. Er schaut nach links, dann nach rechts und duckt sich probehalber, obwohl zwischen den Blättern niemand zu erkennen ist. Schließlich hebt er die Axt."},{"type":"narration","text":"KLOCK! KLOCK! KLOCK! Holzblock um Holzblock verschwindet. Gerade nimmt Eckarts Mut wieder zu, da ertönt irgendwo aus dem dunklen Wald ein lang gezogenes, unheimliches Stöhnen."},{"type":"dialogue","speaker":"eckart","lines":["WAT WAR DAT DENN?! ... Hallo?"]},{"type":"narration","text":"Ein Zombie ist zu hören. Doch aus welcher Richtung das Geräusch kommt, kann Eckart nicht feststellen. Er schaut angespannt zwischen die Bäume und hält die Axt fester."},{"type":"dialogue","speaker":"eckart","lines":["Na, vielleicht bleibt dat Viech ja da, wo's is. Ich brauch doch bloß 'n bisschen Holz ..."]},{"type":"narration","text":"Dann fällt sein Blick nach oben. Über den Baumkronen entdeckt er eine dunkle, geflügelte Gestalt. Ein Phantom!"},{"type":"dialogue","speaker":"eckart","lines":["NEEEEIN! DAT IS JA SO 'N FLIEGENDES VIECH! RÜÜÜCKZUUUUG!"]},{"type":"narration","text":"Eckart lässt von den Bäumen ab und rennt zum Eingang. Die Treppe verschluckt seine hastigen Schritte. Kurz darauf poltert er zurück in die sichere Werkstatt."},{"type":"dialogue","speaker":"eckart","lines":["MEIIIISTER! DA WAR 'N ZOMBIE! UND DANN AUCH NOCH 'N PHANTOM!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! ERST MAL RUHIG ATMEN! HASTE WENIGSTENS HOLZ MITGEBRACHT?!"]},{"type":"narration","text":"Eckart richtet sich auf und präsentiert voller Stolz seine Beute: acht Birkenstämme. Auch seine Axt hat er sicher zurückgebracht."},{"type":"dialogue","speaker":"eckart","lines":["ACHT BIRKENSTÄMME, MEISTER!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Acht Stück und noch beide Beine dran! Dat nenn ich 'ne erfolgreiche Expedition!"]},{"type":"dialogue","speaker":"huibuh","lines":["Welch heldenhafter Rückzug! Acht erbeutete Stämme, ein schauriges Stöhnen und ein geflügelter Nachtbewohner!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Angesichts der nächtlichen Gefahren war der Rückzug vernünftig. Die acht Stämme sind für unseren Brennstoffversuch nun jedenfalls verfügbar."]},{"type":"dialogue","speaker":"leader","lines":["Gut gemacht, Eckart. Wir werden daraus Holzkohle herstellen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ABER HEUTE NACHT GEH ICH DA NICH NOCHMAL RAUS!"]},{"type":"dialogue","speaker":"roehrig","lines":["DANN BLEIBSTE JETZT ERST MAL HIER, ECKAT!"]},{"type":"narration","text":"Der Forschungsleiter befüllt den Ofen mit Birkenholz; weiteres Holz wird als Brennstoff verwendet. Die Flammen fangen an zu lodern. Was aus dem Holz wird, steht erst nach dem Brennvorgang fest."}]},{"chapter":"Kapitel 3 · Der Erzbrecher rückt näher","title":"Fünf Holzkohle und dreißig gebrannte Steine","subtitle":"Teil 3: Endlich Feuer im Ofen und sieben neue Netherrack","blocks":[{"type":"narration","text":"Nach einiger Zeit verstummt das Knistern im Ofen. Der Forschungsleiter öffnet die Ofenoberfläche und zeigt den anderen das Ergebnis."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, schaut her! Der Brennvorgang ist abgeschlossen. Wir haben genau fünf Stück Holzkohle hergestellt!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! AUS MEINEM BIRKENHOLZ IS KOHLE GEWORDEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT WAR JA AUCH DER SINN DER GANZEN AKTION!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Na, siehste! Birkenstämme mit ordentlich Sonnenbrand!"]},{"type":"dialogue","speaker":"doofen","lines":["Fünf schwarze Wunderstücke! Eine ausgezeichnete Grundlage für meinen KOHLENVERDOPPELUNGS-INATOR!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Herr Doktor, wir haben bereits einen funktionierenden Ofen. Und vor allem ist der Vorrat jetzt ausreichend, um unsere Bruchsteine weiterzuverarbeiten."]},{"type":"narration","text":"Der Forschungsleiter nimmt die fünf Holzkohle aus dem Ergebnisfeld, legt fünfundzwanzig Bruchsteine in den Ofen und setzt die Holzkohle als Brennstoff ein. Sofort schlagen die Flammen wieder hoch."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön. Jetzt brennen wir unsere fünfundzwanzig Bruchsteine. Das dauert wieder ein wenig."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! JETZT VERBRENNEN WIR SCHON WIEDER STEINE!"]},{"type":"dialogue","speaker":"roehrig","lines":["WIR BRENNEN SIE, ECKAT! DAT SIND WICHTIGE FORSCHUNGSSCHRITTE!"]},{"type":"narration","text":"Als die fünfundzwanzig Steine fertig sind, entdeckt der Forschungsleiter noch fünf weitere Steine aus einem vorherigen Brennvorgang. Damit liegen insgesamt dreißig gebrannte Steine bereit."},{"type":"dialogue","speaker":"leader","lines":["Moment mal! Fünfundzwanzig von jetzt und fünf aus dem Rest vom letzten Mal. Das sind dreißig! Achtung, meine Herren, jetzt kommt alles in den Komposter!"]},{"type":"narration","text":"Klick um Klick verarbeitet der Forschungsleiter die Steine. Der Komposter wirft dunkelrote Netherrack-Stücke auf den frisch angelegten Werkstattboden. Einige landen beim Schmelzkessel, andere in der Nähe des Ofens."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAT DING SPUCKT DIE STEINE ÜBERALL HIN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DENN HEB SIE EBEN WIEDER AUF!"]},{"type":"dialogue","speaker":"leader","lines":["Einsammeln, Männer! Jeder nimmt sich ein Stück!"]},{"type":"narration","text":"Sofort setzt ein munteres Durcheinander ein. Werner greift nach seinem Netherrack, Professor Kupferstein hebt ein Stück vorsichtig auf, und Hui Buh beschreibt die ganze Aktion als großartige geologische Schatzsuche."},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen rostigen Ketten! Welch faszinierende Gesteinsbrocken! Und sie liegen so hübsch über die Werkstatt verstreut!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! So ordentlich war dat hier gestern noch. Heute ham wa schon wieder 'ne Steinsammlung auf'm Boden!"]},{"type":"dialogue","speaker":"doofen","lines":["Mit meinem ALLES-AUTOMATISCH-EINSAMMEL-INATOR wäre das natürlich viel eindrucksvoller!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU SAMMELST JETZT ERST MAL DEINEN EIGENEN STEIN EIN!"]},{"type":"narration","text":"Nach dem Einsammeln bestätigt der Forschungsleiter die Ausbeute: sieben Netherrack aus dem Durchlauf mit dreißig gebrannten Steinen. Damit ist die nötige weitere Rohstoffmenge endlich vorhanden."},{"type":"dialogue","speaker":"kupferstein","lines":["Sieben Netherrack, erfolgreich gewonnen. Die benötigten sechs zusätzlichen Stücke sind damit abgedeckt. Unser Erzbrecher rückt näher."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DANN KRIEGEN WIR DEN ZAUN ENDLICH FERTIG!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ABER DIESES MAL GUCKEN WIR VORHER GENAU AUF DAT REZEPT!"]}]},{"chapter":"Kapitel 3 · Der Erzbrecher rückt näher","title":"Sechs Zäune und endlich ein Bogen","subtitle":"Teil 4: Das richtige Rezept funktioniert und das nächste Bauteil wartet","blocks":[{"type":"narration","text":"Die neu gewonnenen Netherrack werden ebenfalls zu Netherziegeln gebrannt. Der Forschungsleiter meldet das Ergebnis: Sieben neue Netherziegel sind hergestellt. Jetzt muss die Zaunrechnung endlich aufgehen."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, die sieben Netherziegel sind da! Vier Netherziegelblöcke habe ich vorbereitet. Und jetzt wird der Zaun gebaut!"]},{"type":"narration","text":"Vorsichtig legt der Forschungsleiter vier Netherziegelblöcke und zwei einzelne Netherziegel in die Werkbank. Diesmal erscheinen rechts tatsächlich sechs Netherziegelzäune."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! SECHS ZÄUNE! WIR WOLLTEN DOCH NUR EINEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT REZEPT GIBT EBEN SECHS! FÜNF BLEIBEN AUF RESERVE!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Damit kannste schon fast 'n eigenes Gehege bauen, Eckat!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH BIN DOCH KEIN SCHAF!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Die Herstellung ist bestätigt. Der Netherziegelzaun ist fertig, und wir haben den früheren Rechenfehler erfolgreich korrigiert."]},{"type":"dialogue","speaker":"leader","lines":["Sehr gut. Für den noch fehlenden Dispenser brauchen wir auch einen Bogen. Schaut bitte genau zu."]},{"type":"narration","text":"Der Forschungsleiter nimmt drei Stöcke und drei Fäden und ordnet sie in der Werkbank an. Wenig später liegt ein fertiger Bogen im Ergebnisfeld."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DARF ICH DEN BOGEN MAL AUSPROBIEREN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN, ECKAT! DAT IS FÜR DEN DISPENSER, NICH FÜR DICH!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Sonst steckt nachher 'n Pfeil in Kupfersteins Forschungsjournal!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Der Bogen ist hergestellt und für den Dispenser vorgesehen. Damit fehlt uns unter anderem noch ein einzelnes Stück Redstone."]},{"type":"dialogue","speaker":"leader","lines":["Das besorgen wir uns aus Hui Buhs Schatzkammer. Auf geht's, meine Freunde!"]},{"type":"narration","text":"Hui Buh schwebt bereits voraus. Seine Miene verrät, dass er über jeden Besucher seiner Schätze ein ganz persönliches Urteil zu fällen pflegt."}]},{"chapter":"Kapitel 3 · Der Erzbrecher rückt näher","title":"Hui Buhs Schatzkammer und der verschwundene Bruchstein","subtitle":"Teil 5: Ein Redstone, viele Treppen und eine ernüchternde Entdeckung","blocks":[{"type":"narration","text":"Die Forschungskollegen steigen gemeinsam die lange Steintreppe hinab. Die Fackeln werfen Licht auf die Wände, während sich der Gang Windung um Windung tiefer in den Berg zieht."},{"type":"dialogue","speaker":"leader","lines":["Eckart, pass auf die Stufen auf. Nicht, dass du stolperst und am Ende die ganze Treppe hinunterkullerst!"]},{"type":"dialogue","speaker":"eckart","lines":["Keine Sorge, Chef! Ich kann Treppen laufen!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dat hat er beim letzten Mal auch gesagt!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! GUCK NACH VORN, NICH NACH HINTEN!"]},{"type":"narration","text":"Schließlich öffnet sich der Gang zu Hui Buhs prächtiger Schatzkammer. Zwischen Steinsäulen und grünen Pflanzen führt ein roter Teppich zu einer großen Truhe."},{"type":"dialogue","speaker":"leader","lines":["Hallo, Hui Buh! Grüß dich! Bewachst du schön unsere Schätze?"]},{"type":"dialogue","speaker":"huibuh","lines":["Aber selbstverständlich, Herr Forschungsleiter! Kein unbefugter Besucher entgeht den Augen des ehrwürdigen Schlossgespenstes!"]},{"type":"dialogue","speaker":"leader","lines":["Das weiß ich. Ich bin stolz auf dich, mein Freund. Wir brauchen jetzt nur ein einziges Stück Redstone aus deiner Truhe, für unseren Dispenser."]},{"type":"narration","text":"Hui Buh richtet sich sichtbar auf. Das Lob hat den sonst so theatralischen Schatzmeister für einen Moment beinahe sprachlos gemacht."},{"type":"dialogue","speaker":"huibuh","lines":["Nun ... äh ... selbstverständlich! Eine so sorgsam beaufsichtigte Entnahme kann ich nur gutheißen. Aber wirklich nur ein Stück!"]},{"type":"dialogue","speaker":"doofen","lines":["Und falls hier zufällig etwas Gold für meinen SCHATZ-VERVIELFACHUNGS-INATOR liegt ..."]},{"type":"dialogue","speaker":"huibuh","lines":["UNTERSTEHEN SIE SICH!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Jetzt wird der Bettlaken-Tresor aber laut!"]},{"type":"narration","text":"Der Forschungsleiter öffnet die Truhe und nimmt genau einen Redstone heraus. Er bedankt sich bei Hui Buh, der sich wieder seiner Schatzmeisterpflicht widmet."},{"type":"dialogue","speaker":"leader","lines":["So, Männer. Zurück nach oben. Ich weiß, schon wieder Treppen! Aber jeder Gang hält schlank, jeder Schritt hält fit!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! MÜSSEN WIR ECHT SCHON WIEDER HOCH?!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DER ERZBRECHER BAUT SICH NICH VON ALLEINE!"]},{"type":"dialogue","speaker":"doofen","lines":["Mit meinem TREPPEN-VON-SELBST-LAUF-INATOR wäre das gar kein Problem!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU LÄUFST JETZT SELBER!"]},{"type":"narration","text":"Nach dem langen Aufstieg kehrt die Gruppe durch die Holztür in die helle Werkstatt zurück. Der Forschungsleiter legt Zaun, Bogen und Redstone bereit und prüft sein Inventar."},{"type":"dialogue","speaker":"leader","lines":["So, jetzt schauen wir mal: Haben wir überhaupt noch Bruchstein für den Dispenser? ... Nein? Ups. Tatsächlich kein Bruchstein mehr!"]},{"type":"narration","text":"Er durchsucht die Taschen ein zweites Mal. Auch eine brauchbare Spitzhacke fehlt. Die letzte ist beim Arbeiten am Generator zerbrochen."},{"type":"dialogue","speaker":"leader","lines":["Tja, meine Freunde. Und nun? Keine Spitzhacke, kein Bruchstein, um eine neue Steinspitzhacke herzustellen. Wir brauchen aber sieben Bruchsteine für den Spender."]},{"type":"narration","text":"Einen Moment lang herrscht absolute Stille."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WIR HAM 'NEN STEINGENERATOR, ABER KÖNNEN KEINE STEINE ABBAUEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT IS MIR AUCH SCHON AUFGEFALLEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Sach ma, Röhrich, warum bauen wa nich einfach 'ne Holzspitzhacke?"]},{"type":"narration","text":"Professor Kupferstein hält inne. Dann hebt er langsam den Zeigefinger."},{"type":"dialogue","speaker":"kupferstein","lines":["Natürlich! Drei Holzbretter und zwei Stöcke ergeben eine Holzspitzhacke. Damit können wir am vorhandenen Cobblestone-Generator die sieben benötigten Bruchsteine gewinnen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WIR BRAUCHEN ALSO KEINE STEINE, UM WIEDER STEINE ZU KRIEGEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT HAT WERNER GERADE GESAGT!"]},{"type":"dialogue","speaker":"doofen","lines":["Darf ich alternativ meinen SPITZHACKEN-AUS-DEM-NICHTS-INATOR vorstellen? Er ist allerdings noch nicht gebaut."]},{"type":"dialogue","speaker":"roehrig","lines":["DENN HAM WA DAMIT GENAU GAR NIX GEWONNEN!"]},{"type":"dialogue","speaker":"leader","lines":["Dann ist unsere nächste Aufgabe klar. Erst die Holzspitzhacke, dann die sieben Bruchsteine. Den Dispenser haben wir noch nicht fertig, aber wir wissen jetzt, wie wir weitermachen."]},{"type":"narration","text":"Werner grinst breit. Hui Buh kichert, Eckart schaut vorsichtshalber nach, ob seine Axt noch da ist, und Professor Kupferstein schreibt den neuen Arbeitsauftrag in sein Buch. So nah war der Erzbrecher seiner Fertigstellung noch nie."},{"type":"end","text":"Fortsetzung folgt: Sieben Bruchsteine für den Dispenser"}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Wenn der Chef selbst zum Holzfäller wird","subtitle":"Teil 1: Ein Waldausflug, eine neue Spitzhacke und der unermüdliche Steingenerator","blocks":[{"type":"narration","text":"In der unterirdischen Forschungswerkstatt ist der Dispenser zum Greifen nah. Der Bogen liegt bereit, der Redstone stammt aus Hui Buhs Schatzkammer. Nur der Bruchstein und eine brauchbare Spitzhacke fehlen. Der Forschungsleiter betrachtet sein Inventar und trifft eine Entscheidung."},{"type":"dialogue","speaker":"leader","lines":["Männer, bleibt unten. Ich hole mal ein bisschen Holz von oben. Bin gleich zurück, zwei, drei Minuten höchstens! Und macht mir da unten keinen Unsinn!"]},{"type":"narration","text":"Seine Stimme hallt noch durch die Gänge, als er bereits die lange, fackelbeleuchtete Treppe zur Oberfläche hinaufsteigt."},{"type":"dialogue","speaker":"roehrig","lines":["HABT IHR GEHÖRT?! KEINEN UNSINN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Röhrich, dat war bestimmt auch an dich gerichtet!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WAT MACHEN WIR DENN, WENN WIR KEINEN UNSINN MACHEN DÜRFEN?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! SETZ DICH EINFACH HIN!"]},{"type":"narration","text":"Oben erwartet den Forschungsleiter heller Tag. Wolken treiben über die Baumkronen, der Wald liegt friedlich da. Keine Spinne ist zu sehen, kein Zombie und erst recht keine grüne wandelnde Sprengstoffzündung."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön. Keine Gefahr in Sicht. Dann wollen wir doch mal! Hier hat Eckart neulich aufgehört. Ich mache seine Holzarbeit jetzt fertig."]},{"type":"narration","text":"Er nähert sich dem dichten Laub und setzt die Axt an. KLOCK! KLOCK! Ein Stamm nach dem anderen verschwindet. Doch die Baumkrone erweist sich als höher, als es zunächst aussah."},{"type":"dialogue","speaker":"leader","lines":["Mann, ist das hoch hier! Da muss ich mich ja richtig hocharbeiten. Aber schwebende Blätter will ich auch nicht zurücklassen!"]},{"type":"narration","text":"Der Forschungsleiter klettert vorsichtig weiter hinauf, sucht verborgene Holzblöcke zwischen dem Grün und arbeitet sich Stück für Stück durch die Äste."},{"type":"narration","text":"Währenddessen geht in der Werkstatt eine kleine Diskussion los."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WIE LANGE IS DER CHEF SCHON WEG?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! ER HAT GESAGT, ER KOMMT GLEICH WIEDER!"]},{"type":"dialogue","speaker":"doofen","lines":["Bei Bedarf könnte mein SONNENUNTERGANG-VERHINDERUNGS-INATOR die Zeit anhalten, bis er wiederkommt!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Denn halt lieber erst mal deinen Mund an!"]},{"type":"dialogue","speaker":"huibuh","lines":["Als ehrwürdiges Schlossgespenst muss ich anmerken, dass gerade die Nacht doch einen ganz eigenen Reiz besitzt!"]},{"type":"narration","text":"Im Wald verfliegt die Zeit. Als der Forschungsleiter endlich wieder freien Himmel zwischen den Blättern erblickt, steht die Sonne bereits tiefer. Die Dämmerung kündigt sich an."},{"type":"dialogue","speaker":"leader","lines":["Nein, jetzt wird es schon wieder dunkel. Bevor die unnützen Nachtgestalten auftauchen, gehe ich lieber zurück!"]},{"type":"narration","text":"Er verlässt die Baumkrone und eilt zur unterirdischen Werkstatt. Kurz darauf öffnet sich die Holztür."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren, da bin ich wieder. Habt ihr auch keinen Unsinn gemacht?"]},{"type":"dialogue","speaker":"kupferstein","lines":["Wir haben zumindest keine Maschine verändert, Herr Forschungsleiter."]},{"type":"dialogue","speaker":"doofen","lines":["Aber ich habe über drei neue Inatoren nachgedacht!"]},{"type":"dialogue","speaker":"roehrig","lines":["DOOFENSHMIRTZ!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Willkommen zurück, Chef. War dat 'n schöner Ausflug in die Baumkrone?"]},{"type":"narration","text":"Der Forschungsleiter verarbeitet seine gewonnenen Stämme zu Brettern und stellt mit drei Brettern und zwei Stöcken eine Holzspitzhacke her."},{"type":"dialogue","speaker":"leader","lines":["So, jetzt haben wir wenigstens wieder eine Spitzhacke. Damit werde ich erst einmal ein bisschen Bruchstein am Generator abbauen. Mal sehen, was dabei herauskommt."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WIE LANGE HÄLT DENN SO 'NE HOLZSPITZHACKE?"]},{"type":"dialogue","speaker":"roehrig","lines":["BIS SIE KAPUTT IS, ECKAT!"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! DAT IS JA 'NE WISSENSCHAFTLICHE MEISTERLEISTUNG!"]},{"type":"narration","text":"Wenig später hallt das regelmäßige Klopfen des Werkzeugs durch den Nebenraum. Wasser und Lava sorgen im bereits erprobten Cobblestone-Generator für frischen Bruchstein, der in die Auffangtruhe gelangt. Wie groß die Ausbeute wird, zeigt sich erst am Ende dieses Arbeitsdurchlaufs."}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Sieben Bruchsteine und endlich ein Werfer","subtitle":"Teil 2: Die letzte Zutat für den Dispenser und ein neues Platzproblem","blocks":[{"type":"narration","text":"Nach dem Abbauversuch am Cobblestone-Generator ruft der Forschungsleiter seine Kollegen zur Auffangtruhe. Der Generator hat erneut einen ansehnlichen Bruchsteinvorrat geliefert."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren! Schaut doch bitte mal in die Truhe. Das Ergebnis kann sich sehen lassen!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DA SIND JA WIEDER STEINE DRIN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT IS SCHLIESSLICH 'N STEINGENERATOR!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Und diesmal wissen wa sogar wieder, wofür wir die Steine brauchen!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Unsere Materialversorgung ist vorerst gesichert. Für den Dispenser benötigen wir genau sieben Bruchsteine."]},{"type":"narration","text":"Der Forschungsleiter entnimmt der Truhe sieben Bruchsteine und geht zurück zur Werkbank. Die Kollegen folgen ihm voller Erwartung."},{"type":"dialogue","speaker":"leader","lines":["So, sieben Stück. Und daraus machen wir jetzt endlich den Werfer, den wir für unseren Erzbrecher brauchen."]},{"type":"narration","text":"Er legt sieben Bruchsteine rund um die Werkbank, setzt den zuvor hergestellten Bogen in die Mitte und platziert darunter den einzelnen Redstone aus Hui Buhs Schatzkammer. Das Ergebnisfeld zeigt den fertigen Werfer."},{"type":"dialogue","speaker":"leader","lines":["Geschafft, meine Freunde! Der Werfer ist fertig!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAT DING KANN WAT WERFEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DESWEGEN HEISST DAT JA AUCH WERFER!"]},{"type":"dialogue","speaker":"doofen","lines":["Ein hervorragender Ausgangspunkt für meinen ALLES-DURCH-DIE-GEGEND-WERF-INATOR!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Bloß nich. Sonst wirft der nachher Kupfersteins Forschungsjournal durchs ganze Labor!"]},{"type":"dialogue","speaker":"huibuh","lines":["Ich bitte eindringlich darum, mein Schatzgewölbe von solchen Wurfexperimenten auszunehmen!"]},{"type":"narration","text":"Professor Kupferstein überprüft seine Notizen. Netherziegelzaun, Eisengitter und Werfer: Sämtliche bislang beschafften Bauteile liegen nun vor. Doch der Forschungsleiter lässt seinen Blick durch die Werkstatt schweifen."},{"type":"dialogue","speaker":"kupferstein","lines":["Die Materialliste ist vollständig. Nun können wir uns mit dem eigentlichen Aufbau beschäftigen."]},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir haben allerdings ein neues Problemchen. Schaut euch einmal alle Räume an. Hier der Cobblestone-Generator, dort unsere Maschinen, die Schmelzanlage und der Schmelzkessel. Wo soll unser Erzbrecher eigentlich hin?"]},{"type":"narration","text":"Alle schweigen. Die unterirdische Werkstatt ist durch den jüngsten Umbau zwar ordentlicher geworden, aber eben auch dichter eingerichtet. Der Erzwäscher steht platzsparend im Boden, der Generator hat sein eigenes Auffangsystem, und die Schmelzgeräte benötigen freien Zugang."},{"type":"dialogue","speaker":"roehrig","lines":["HIER STELLEN WIR NICH EINFACH IRGENDWAT OBENDRAUF! DAT HAM WA DOCH GERADE ERST ORDENTLICH GEMACHT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Wenn wa noch 'ne Maschine dazwischenquetschen, muss Eckat bald seitwärts durch den Raum!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH KANN SEITWÄRTS LAUFEN!"]},{"type":"dialogue","speaker":"huibuh","lines":["Und bitte keine erneute Überschwemmung! Meine ehrwürdigen Ketten sind noch vom letzten Umbau beleidigt!"]},{"type":"dialogue","speaker":"doofen","lines":["Eine Maschine an der Decke wäre doch schön. Mit meinem SCHWEBE-MASCHINEN-INATOR ..."]},{"type":"dialogue","speaker":"roehrig","lines":["NEIN! NIX AN DIE DECKE!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Dann schlage ich eine eigene kleine Kammer möglichst nah am Cobblestone-Generator vor. So sparen wir lange Wege zwischen der Rohstoffquelle und dem neuen Erzbrecher."]},{"type":"dialogue","speaker":"leader","lines":["Damit kann ich mich anfreunden. Wir prüfen, ob sich an der Wand neben dem Generator Platz für einen weiteren Raum schaffen lässt."]},{"type":"narration","text":"Noch ist die Kammer nur ein Vorhaben. Doch der Werfer ist tatsächlich hergestellt, und der nächste Abschnitt der Forschungsarbeiten kann beginnen."}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Freiwillige vor! Oder: Der Professor misst durch Wände","subtitle":"Teil 3: Werners Skizze, eine Baukolonne und eine logische Korrektur","blocks":[{"type":"narration","text":"Die Kollegen versammeln sich vor der Wand nahe dem Cobblestone-Generator. Werner hat einen anschaulichen Plan für die neue Maschinenkammer gezeichnet. Der Forschungsleiter schlägt einen fünf mal fünf Blöcke großen Grundriss mit zunächst zwei Blöcken Raumhöhe vor."},{"type":"dialogue","speaker":"leader","lines":["Ich würde hier einen kleinen Raum beginnen: fünf mal fünf mal zwei. Wernerchen, kannst du das einmal zeichnen, damit wir sehen, ob der Platz für unseren Erzbrecher ausreichen könnte?"]},{"type":"dialogue","speaker":"werner","lines":["Joa, Chef! Hier haste 'nen Plan. Schön nah am Generator, mit einem Eingang und genug Platz, um nicht gleich über die Maschine zu stolpern."]},{"type":"narration","text":"Werner breitet die Skizze aus. Die Gruppe beugt sich darüber. Das Bild zeigt einen denkbaren Grundriss, ist aber noch keine vor Ort überprüfte Konstruktion."},{"type":"dialogue","speaker":"leader","lines":["Das sieht doch hervorragend aus! Alle haben den Plan gesehen? Dann fehlt nur noch jemand, der den Raum aushöhlt. Freiwillige vor!"]},{"type":"narration","text":"Absolute Stille. Werner inspiziert seine Fingernägel. Professor Kupferstein blättert im Notizbuch. Hui Buh schwebt langsam rückwärts. Eckart schaut verblüfft in die Runde."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WARUM MELDET SICH DENN KEINER?!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT FRAG ICH MICH AUCH!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Na, Röhrich, du bist doch hier der Meister!"]},{"type":"dialogue","speaker":"roehrig","lines":["WERNER! ICH BIN KLEMPNERMEISTER, KEIN BERGARBEITER!"]},{"type":"dialogue","speaker":"doofen","lines":["Mein ALLES-WAS-IM-WEG-IST-WEGSPRENG-INATOR könnte den Aushub in einer einzigen Sekunde erledigen!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU SPRENGST HIER ÜBERHAUPT NIX!"]},{"type":"dialogue","speaker":"huibuh","lines":["Ich würde ja überaus gerne helfen, doch als Schlossgespenst bin ich für derlei körperliche Mühen äußerst unpassend ausgestattet."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dann verwalteste eben die Baukosten, du Sparkasse mit Bettlaken!"]},{"type":"dialogue","speaker":"huibuh","lines":["WERNER! ICH VERBITTE MIR DAS!"]},{"type":"narration","text":"Schließlich schlägt Meister Röhrich mit der Hand auf den Tisch."},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU UND ICH, WIR MACHEN DAT!"]},{"type":"dialogue","speaker":"eckart","lines":["W-WIR BEIDE?! ICH HAB MICH DOCH GAR NICH FREIWILLIG GEMELDET!"]},{"type":"dialogue","speaker":"roehrig","lines":["DU HAST DICH FREIWILLIG GEMELDET, ALS DU GEFRAGT HAST, WARUM SICH KEINER MELDET!"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! 'NE FREIWILLIGE ZWANGSMELDUNG!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Ich übernehme die Vermessung. Wir sollten vor dem Aushub den Raum sorgfältig abmessen."]},{"type":"narration","text":"Der Forschungsleiter hebt die Augenbrauen und deutet auf die massive Felswand."},{"type":"dialogue","speaker":"leader","lines":["Herr Doktor Kupferstein, wie wollen Sie denn einen Raum abmessen, wenn er noch vollständig aus Stein besteht? Wir können die Innenmaße doch erst kontrollieren, sobald wir etwas ausgehöhlt haben."]},{"type":"narration","text":"Professor Kupferstein betrachtet die Wand, anschließend sein Maßblatt und dann den Forschungsleiter. Er räuspert sich verlegen."},{"type":"dialogue","speaker":"kupferstein","lines":["Sie haben recht. Das war unpraktisch gedacht. Wir markieren zunächst den Eingang, tragen schrittweise Stein ab und messen die Breite, Tiefe und Höhe während des Aushubs nach."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Kupferstein wollte den Zollstock schon durch die Wand schieben!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DER PROFESSOR MISST STEINE, DIE ER GAR NICH SEHEN KANN!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ABER JETZT KLÄREN WIR ERST MAL, WER HIER WIRKLICH KLOPPT!"]},{"type":"dialogue","speaker":"leader","lines":["Also gut. Meister Röhrich und Eckart übernehmen den Aushub. Professor Kupferstein misst nach und nach. Werner hilft mit Planung und guten Ratschlägen."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Gute Ratschläge hab ich genug!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DARF ICH JETZT ENDLICH LOSKLOPPEN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["GLEICH, ECKAT! ERST WIRD DER EINGANG FESTGELEGT!"]},{"type":"narration","text":"Damit steht die Aufgabenverteilung fest. Die beiden Bauarbeiter greifen zu den Spitzhacken, der Professor macht sich für die Kontrolle bereit, und Werner übernimmt die inoffizielle Leitung der guten Laune."}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Die große Aushöhlung und das blaue Geheimnis","subtitle":"Teil 4: Fünf mal fünf Blöcke Fels, wenige Fackeln und Eckarts Entdeckung","blocks":[{"type":"narration","text":"Vor der festen Steinwand gibt der Forschungsleiter das Startsignal. Die geplante Kammer liegt unmittelbar bei dem Raum des Cobblestone-Generators. Eckart und Meister Röhrich sollen den Fels Stück für Stück abtragen."},{"type":"dialogue","speaker":"leader","lines":["Na denn, Eckart und Röhrich, macht euch ans Werk! Herr Kupferstein, Sie messen immer wieder nach. Wir haben zunächst drei Fackeln. Eine vierte nehmen wir von der vorhandenen Wand ab."]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! SPITZHACKE IN DIE HAND! JETZT WIRD GEARBEITET!"]},{"type":"dialogue","speaker":"eckart","lines":["JA, MEISTER! ABER ICH HAB MICH DOCH GAR NICH FREIWILLIG ..."]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! KLOPP!"]},{"type":"narration","text":"KLOCK! KLOCK! KRACK! Die ersten Blöcke brechen heraus. Der Durchgang öffnet sich, dann entstehen links und rechts die ersten freigelegten Wandflächen."},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Na, Röhrich! Dat sieht ja schon fast nach 'nem Raum aus!"]},{"type":"dialogue","speaker":"roehrig","lines":["WERNER! HIER WIRD ORDENTLICH AUSGEHÖHLT, NICH NUR ZUM SPASS GEKLOPPT!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DIE STEINE SIND ALLE ECKIG!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT IS MINECRAFT!"]},{"type":"narration","text":"Professor Kupferstein überprüft die bereits sichtbaren Abstände und zeigt an, welche Seiten noch freigelegt werden müssen. Die Kammer wächst, ohne dass vorher durch die unberührte Wand gemessen werden müsste."},{"type":"dialogue","speaker":"kupferstein","lines":["Jetzt ist der Platz freigelegt, um sinnvoll nachzumessen. Bitte die Seitenteile noch etwas weiter ausarbeiten."]},{"type":"narration","text":"Während der Arbeit bleibt Eckart plötzlich stehen. An der linken Wand erkennt er kräftige blaue Einschlüsse im Stein."},{"type":"dialogue","speaker":"eckart","lines":["MEEEEISTER! HIER IS WAT BLAUES!"]},{"type":"dialogue","speaker":"roehrig","lines":["WAT IS DENN NUN SCHON WIEDER?!"]},{"type":"dialogue","speaker":"eckart","lines":["HIER! BLAU! GANZ BLAU! WAT IS DAT?!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Dat leuchtet zwar nich von alleine, aber schön blau sieht's aus!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Das sind Lapislazuli-Einschlüsse. Wir lassen sie vorerst in der Wand, bis entschieden ist, ob und wann sie abgebaut werden."]},{"type":"dialogue","speaker":"huibuh","lines":["Welch prächtige Edelsteinfarbe! Geradezu vornehm für eine unterirdische Maschinenkammer!"]},{"type":"narration","text":"In der Decke entdecken die Forscher weitere, bräunliche Erzeinschlüsse. Zunächst wird über die genaue Sorte spekuliert. Der Forschungsleiter will diese Frage später mit einem genauen Blick auf die Texturen klären."},{"type":"dialogue","speaker":"doofen","lines":["Ich hätte einen ERZ-ERKENNUNGS-INATOR, aber dafür brauche ich noch ein Erz, das er erkennen kann!"]},{"type":"dialogue","speaker":"roehrig","lines":["LASS DAS ERZ EINFACH IN RUHE!"]},{"type":"narration","text":"Die Arbeit geht weiter. Schwere Felsbrocken verschwinden aus der Wand, die Bodenfläche wird eben, und der Bauaushub füllt Stück für Stück das Inventar. Zwischendurch werden Fackeln umgehängt, damit der neue Bereich nicht im Dunkeln bleibt."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WO SOLL ICH MIT ALL DEM BRUCHSTEIN HIN?!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Vielleicht können wa mit dem Aushub gleich die nächste Werkstatt bauen!"]},{"type":"dialogue","speaker":"roehrig","lines":["WERNER! ERST MAL WIRD DIESE HIER FERTIG!"]},{"type":"narration","text":"Schließlich ist aus dem massiven Felsen eine erkennbare kleine Kammer geworden. Die Wände sind noch roh, aber Boden und Zugang stehen bereit. Die Fackeln tauchen den neuen Raum in warmes Licht."},{"type":"dialogue","speaker":"leader","lines":["Sehr schön, meine Herren. Jetzt haben wir endlich einen Bereich, den wir auch tatsächlich ausmessen können."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! UND WER MUSS DEN RAUM JETZT PUTZEN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! NICHT SCHON WIEDER!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen klappernden Ketten! Ich könnte immerhin für eine angemessen staubige Atmosphäre sorgen!"]},{"type":"dialogue","speaker":"roehrig","lines":["HIER WIRD NIX MEHR EINGESTAUBT!"]},{"type":"narration","text":"Der Raum ist ausgehöhlt und beleuchtet. Seine endgültigen Maße sowie die Aufstellung des Erzbrechers werden als nächste Schritte überprüft."}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Eisenerz, Lapislazuli und die letzte Vermessung","subtitle":"Teil 5: Die Wand ist endlich offen, und Professor Kupferstein kann nachzählen","blocks":[{"type":"narration","text":"Nach den Ausgrabungsarbeiten tritt der Forschungsleiter zusammen mit seinen Kollegen in die neue Kammer. Die Fackeln beleuchten die frischen Steinflächen. Oben in der Decke stecken noch immer die bräunlichen Erzeinschlüsse, und an der Wand schimmert das blaue Lapislazuli."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, zuerst eine Korrektur. Das Erz oben in der Decke ist kein Kupfer. Kupfer sieht mit unserem Ressourcenpaket leicht grünlich aus. Was wir hier sehen, ist Eisenerz. Das lassen wir vorerst stehen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Danke für die Korrektur, Herr Forschungsleiter. Dann notiere ich: Eisenerz in der Decke, Lapislazulierz an der Wand. Beides bleibt zunächst unangetastet."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! KUPFERSTEIN HAT EISEN MIT KUPFER VERWECHSELT!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! DAT KANN PASSIEREN! ABER DU BRAUCHST DAT NICH DURCHS GANZE LABOR BRÜLLEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hauptsache, er hält den Zollstock diesmal nich wieder gegen die falsche Wand!"]},{"type":"dialogue","speaker":"doofen","lines":["Ich würde das sofort mit meinem KUPFER-AUS-EISEN-MACH-INATOR korrigieren!"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen ehrwürdigen Ketten! Wir lassen die hübschen Einschlüsse doch wohl in Ruhe, bis wir wirklich etwas damit anfangen wollen!"]},{"type":"narration","text":"Jetzt stellt sich der Forschungsleiter an den Rand der freigelegten Kammer und zählt sorgfältig die Blockabstände."},{"type":"dialogue","speaker":"leader","lines":["Eins, zwei, drei, vier, fünf! Und in die andere Richtung ebenfalls eins, zwei, drei, vier, fünf. Jawoll, unser fünf mal fünf Grundriss stimmt!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Die tatsächliche Nachmessung ist damit erfolgt. Jetzt haben wir eine geprüfte Grundfläche und nicht mehr bloß die Zeichnung auf dem Papier."]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Na, Röhrich, dat hast du mit Eckat zusammen ja schön hinbekommen!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WIR HABEN 'NEN FÜNF-MAL-FÜNF-RAUM!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND JETZT LASS DEN CHEF DIE MASCHINE AUFSTELLEN!"]},{"type":"narration","text":"Die Kollegen versammeln sich im Raum. Die Materialien für den Erzbrecher liegen bereit: Werfer, zwei Eisengitter und ein Netherziegelzaun. Nun muss sich zeigen, ob die neue Kammer die Konstruktion tatsächlich aufnehmen kann."}]},{"chapter":"Kapitel 4 · Der Gerät bekommt ein Zuhause","title":"Der Gerät ist fertig!","subtitle":"Teil 6: Der große Aufbau und die grüne Erfolgsmeldung des Erzbrechers","blocks":[{"type":"narration","text":"Es ist so weit. Nach all den Abbauarbeiten, der nächtlichen Holzbeschaffung, dem Brennen zahlloser Steine und dem korrigierten Netherziegelzaun steht die Forschungstruppe in der neuen Maschinenkammer."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren! Jetzt bauen wir unser Gerät auf. Oder besser gesagt: DER GERÄT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Wat für 'n Gerät?"]},{"type":"dialogue","speaker":"leader","lines":["Na, der Gerät! Der Gerät hat ein Gerät vom der Gerät!"]},{"type":"narration","text":"Einen Augenblick lang herrscht vollkommene Verwirrung."},{"type":"dialogue","speaker":"kupferstein","lines":["Verzeihen Sie, Herr Forschungsleiter. Welches Gerät soll denn nun welches Gerät besitzen?"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH VERSTEH DEN CHEF NICH MEHR!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DAT GEHT MIR GERADE GENAUSO!"]},{"type":"dialogue","speaker":"doofen","lines":["DER GERÄT! Das ist genial! Vielleicht sollte ich meine Inatoren künftig auch so nennen!"]},{"type":"dialogue","speaker":"werner","lines":["HÖHÖHÖ! DOOFENSHMIRTZ-GERÄT! DAT WIRD JA IMMER BESSER!"]},{"type":"dialogue","speaker":"huibuh","lines":["Eine wahrhaft majestätisch rätselhafte Bezeichnung. Fast so schön wie ein ehrwürdiger Gespenstertitel!"]},{"type":"dialogue","speaker":"leader","lines":["Meine Freunde, ich wollte euch nur ein wenig verwirren. Das war Absicht! Aber jetzt bauen wir der Gerät wirklich auf."]},{"type":"dialogue","speaker":"roehrig","lines":["NA DENN! ABER NICH NOCH MEHR VERWIRREN, SONDERN LOSLEGEN!"]},
