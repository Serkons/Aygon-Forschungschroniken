{"chapter":"Kapitel 12 · Das Rätsel des Schleimstahls","title":"Schleimstahl: Das nächste Rätsel","subtitle":"Die Forschungsgruppe sammelt ihre Vermutungen","blocks":[{"type":"narration","text":"Im Slimefun-Handbuch wartet bereits die nächste Rüstung: Schleimstahl. Der Name klingt ungewöhnlich und lässt die Forscher sofort spekulieren."},{"type":"dialogue","speaker":"leader","lines":["Was meint ihr? Welche Fähigkeiten könnte ein Schleimstahl-Helm haben? Und brauchen wir wohl Schleim für die Herstellung? Noch ist das nur eine Vermutung."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! BESTIMMT KANN MAN DAMIT HÜPFEN! UND WENN WIR DAFÜR IN DEN SUMPF MÜSSEN, BLEIB ICH HIER!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU BIST JA NOCH GAR NICH LOSGELAUFEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Federndes Stahlblech wär doch was."]},{"type":"dialogue","speaker":"casper","lines":["Vielleicht fängt es einen auf, wenn man hinfällt? Das wäre freundlich."]},{"type":"dialogue","speaker":"doofen","lines":["Eine federnde Stahlrüstung! Warum hat mein HÜPF-UND-HALT-INATOR noch keine Konkurrenz bekommen?"]},{"type":"narration","text":"Die Vermutungen werden als solche notiert. Dann zeigt der Forschungsleiter die Beschreibungen der einzelnen Teile."}]},{"chapter":"Kapitel 12 · Das Rätsel des Schleimstahls","title":"Federndes Gefühl auf vier Rüstungsteilen","subtitle":"Was die Schleimstahl-Beschreibungen tatsächlich verraten","blocks":[{"type":"narration","text":"Die vier Infotexte zeigen eine verstärkte Rüstung mit Schutz II und Haltbarkeit IV. Auf allen vier Teilen steht der Hinweis Federndes Gefühl. Das sind zunächst Beschreibungen, keine praktischen Testergebnisse."},{"type":"dialogue","speaker":"kupferstein","lines":["Helm: plus zwei Rüstung. Brustpanzer: plus sechs. Beinschutz: plus fünf. Stiefel: plus zwei."]},{"type":"dialogue","speaker":"leader","lines":["Beim Beinschutz steht außerdem Geschwindigkeit. Und bei den Stiefeln Sprungkraft sowie kein Fallschaden."]},{"type":"dialogue","speaker":"werner","lines":["Jou! Dat klingt nach ordentlichen Beinen."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! KEIN FALLSCHADEN?! DANN KANN ICH JA ÜBERALL RUNTERSPRINGEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU SPRINGST ERST, WENN WIR DAS GEPRÜFT HABEN!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Genau. Schutz II, Haltbarkeit IV und die Zusatzangaben sind sichtbare Item-Eigenschaften im Handbuch. Ob und wie sie sich im Spiel auswirken, ist noch ungeprüft."]},{"type":"dialogue","speaker":"casper","lines":["Das mit dem sanften Landen gefällt mir. Trotzdem sollten wir vorsichtig sein."]},{"type":"narration","text":"Eine neue Prüfung zeichnet sich ab. Doch bevor jemand springen darf, muss das Materialproblem gelöst werden."}]},{"chapter":"Kapitel 12 · Das Rätsel des Schleimstahls","title":"Vier Stahlplatten für vier Rüstungsteile","subtitle":"Das Schleimstahl-Rezept führt zu einer neuen Maschine","blocks":[{"type":"narration","text":"Der Forschungsleiter öffnet das Rezept des Schleimstahl-Helms. Vier Schleimbälle sind zu erkennen. Zusätzlich benötigt das Rezept eine Stahlplatte, die zunächst gesperrt angezeigt wird."},{"type":"dialogue","speaker":"leader","lines":["Da haben wir es: vier Schleimbälle beim Helm und außerdem eine Stahlplatte. Diese müssen wir erst freischalten und uns ansehen."]},{"type":"narration","text":"Nach dem Freischalten zeigt das Handbuch den Herstellungsweg. Acht Stahlbarren ergeben im Kompressor eine Stahlplatte. Ein solcher Kompressor steht noch nicht in der Werkstatt."},{"type":"dialogue","speaker":"kupferstein","lines":["Für jedes der vier geplanten Rüstungsteile brauchen wir nach unserer Rezeptprüfung eine Stahlplatte. Das macht insgesamt vier Stahlplatten."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! UND WIE VIELE STAHLBARREN SIND DAT?! VIERUNDZWANZIG?"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! RECHNE MAL ALLE VIER PLATTEN!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Vier mal acht sind zweiunddreißig. Wir brauchen also genau 32 Stahlbarren."]},{"type":"dialogue","speaker":"werner","lines":["Jou! Dat ist 'ne größere Ladung, aber immerhin kennen wir den Weg."]},{"type":"narration","text":"Stahlbarren lassen sich in der Schmelzerei aus bereits erforschten Zutaten herstellen: Eisenstaub, Kohlenstoff und Eisenbarren. Die neue Aufgabe ist deshalb vor allem der Aufbau des Kompressors."}]},{"chapter":"Kapitel 13 · Ein Raum für den Kompressor","title":"Zwei Kolben, ein Werfer und ein Zaun","subtitle":"Das Multiblock-Rezept des Kompressors","blocks":[{"type":"narration","text":"Das Handbuch zeigt die Struktur der neuen Maschine: zwei Kolben, ein Werfer und ein Netherziegelzaun. Die nötigen Bauteile müssen zuerst besorgt oder gebaut werden."},{"type":"dialogue","speaker":"leader","lines":["Meine Herren, wir benötigen also zwei Kolben, einen Werfer und wieder einen Netherziegelzaun. Sehen wir nach, welche Materialien noch vorhanden sind."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! SCHON WIEDER EIN ZAUN AUS DEM NETHER!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! ABER WIR HABEN NOCH NETHERZIEGEL!"]},{"type":"narration","text":"Der Forschungsleiter stellt einen weiteren Netherziegelzaun bereit. Für die Kolben müssen Eisen, Redstone, Holz und Bruchstein zusammenkommen; für den Werfer weitere Materialien."},{"type":"dialogue","speaker":"werner","lines":["Jou. Erst den Zaun, dann die Kolben, dann den Werfer. Dat wird 'ne richtige kleine Baustelle."]},{"type":"dialogue","speaker":"doofen","lines":["Ich würde noch ein riesiges Warnschild anbringen: Vorsicht, hier wird gedrückt!"]},{"type":"dialogue","speaker":"huibuh","lines":["Solange nicht auf meine Schatztruhe gedrückt wird, habe ich nichts dagegen."]},{"type":"narration","text":"Die Materialsuche führt durch die Vorräte und wiederholt über die langen Treppen der Anlage."}]},{"chapter":"Kapitel 13 · Ein Raum für den Kompressor","title":"Der falsche Bruchstein","subtitle":"Ein Rezept, das eine kleine Korrektur verlangt","blocks":[{"type":"narration","text":"Bei den Vorräten entdeckt der Forschungsleiter eine Schiefervariante des Bruchsteins und versucht, diese für den Kolben zu verwenden. Das normale Kolbenrezept akzeptiert sie in diesem Versuch jedoch nicht."},{"type":"dialogue","speaker":"leader","lines":["Ach, Mist. Bruchsteinschiefer geht nicht. Dann holen wir eben normalen Bruchstein."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DAS IS DOCH AUCH 'N STEIN! WARUM STELLT DER SICH SO AN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WEIL DIE REZEPTUR DEN ANDERN BRAUCHT!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Der eine Stein darf rein, der andere muss draußen bleiben."]},{"type":"narration","text":"Der Forschungsleiter baut normalen Bruchstein ab und kontrolliert noch einmal die Zutaten. Holz und Eisen sind bereits vorbereitet, Redstone wird ergänzt. Damit können die Kolben und der Werfer hergestellt werden."},{"type":"dialogue","speaker":"kupferstein","lines":["Gut, dass wir den Unterschied direkt festgestellt haben. Entscheidend ist das tatsächlich angenommene Rezept, nicht die Ähnlichkeit der Blocknamen."]},{"type":"dialogue","speaker":"casper","lines":["Ich glaube, die Steine finden unsere Arbeit heute ziemlich aufregend."]},{"type":"narration","text":"Die erforderlichen Maschinenteile stehen bereit. Nur ein geeigneter Raum fehlt noch."}]},{"chapter":"Kapitel 13 · Ein Raum für den Kompressor","title":"Die Steine gründen eine Gewerkschaft","subtitle":"Ein kurzer Zwischenfall an der Baustelle","blocks":[{"type":"narration","text":"Neben dem Erzbrecher soll ein zweiter kleiner Maschinenraum entstehen. Eckart betrachtet die Wand mit wachsendem Argwohn. Seit den letzten Scherzen ist jeder Stein für ihn ein möglicher Gesprächspartner."},{"type":"dialogue","speaker":"eckart","lines":["LOS, STEIN! LOS! GEH KAPUTT!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU MUSST DEN STEIN ABBAUEN, NICH ANFEUERN!"]},{"type":"dialogue","speaker":"eckart","lines":["KANNST DU DICH JETZT MAL ZUSAMMENREISSEN UND KAPUTTGEHEN?!"]},{"type":"narration","text":"In der scherzhaften Vorstellung der Forscher bekommt der Stein plötzlich zwei Augen und sieht Eckart äußerst verwundert an."},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Jetzt weiß der Stein gar nich mehr, ob er zusammenbleiben oder auseinanderfallen soll!"]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! WENN ICH IHN ANFEUERE, GIBT ER MIR NUR WIDERWORTE!"]},{"type":"dialogue","speaker":"doofen","lines":["Mein STEIN-DISKUSSIONS-INATOR würde das Problem sofort lösen! Vermutlich."]},{"type":"dialogue","speaker":"casper","lines":["Vielleicht sollten wir höflich fragen, ob wir hier bauen dürfen?"]},{"type":"dialogue","speaker":"huibuh","lines":["Bei meinen königlichen Fundamenten! Ich hoffe, die Mauern meiner Schatzkammer bleiben wenigstens schweigsam."]},{"type":"narration","text":"Die scherzhafte Steinversammlung endet mit Gelächter. In der tatsächlichen Werkstatt wird weiter mit der Spitzhacke gearbeitet."}]},{"chapter":"Kapitel 13 · Ein Raum für den Kompressor","title":"Licht für einen zweiten Maschinenraum","subtitle":"Die neue Kammer neben dem Erzbrecher entsteht","blocks":[{"type":"narration","text":"Der Forschungsleiter legt neben dem vorhandenen Erzbrecherraum einen zwei mal zwei großen Durchgang frei. Dahinter beginnt er, eine neue Kammer von derselben Größe wie die vorherige auszuheben."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren, hier kommt unser Kompressor hin. Zuerst der Durchgang, dann höhlen wir den Raum aus."]},{"type":"narration","text":"Hinter der ersten Öffnung ist es dunkel. Der Forschungsleiter beschafft Kohle und sorgt mit Fackeln für ausreichendes Licht. Stein für Stein wird die Kammer fertiggestellt."},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DA HINTEN IST'S STOCKDUNKEL!"]},{"type":"dialogue","speaker":"roehrig","lines":["DESWEGEN GIBT'S JA FACKELN, ECKAT!"]},{"type":"dialogue","speaker":"werner","lines":["Jou. Und schön nebeneinander, die Maschinen. Dat wird 'ne richtige Forschungsstraße."]},{"type":"dialogue","speaker":"kupferstein","lines":["Zwei Maschinenbereiche, verbunden mit dem Werkstattgang. So können wir Rohstoffe und Ausgaben künftig sauber trennen."]},{"type":"dialogue","speaker":"casper","lines":["Hier ist es jetzt viel gemütlicher. Vorher war die Ecke ganz finster."]},{"type":"narration","text":"Der neue Raum ist ausgehöhlt und beleuchtet. Nun folgt der Aufbau der Multiblock-Maschine."}]},{"chapter":"Kapitel 13 · Ein Raum für den Kompressor","title":"Der Kompressor wird erkannt!","subtitle":"Ein neuer Arbeitsplatz ist betriebsbereit","blocks":[{"type":"narration","text":"Im fertig ausgehobenen Raum ordnet der Forschungsleiter die Maschinenteile an: zwei Kolben, ein Werfer und den Netherziegelzaun. Beim Setzen eines Bauteils muss er die Position noch einmal korrigieren."},{"type":"dialogue","speaker":"leader","lines":["Moment, das war etwas verkehrt. Ich springe noch einmal hoch, setze alles richtig und schließe die Stelle wieder."]},{"type":"narration","text":"Dann sitzt der Werfer an seinem Platz. Im Chat erscheint die grüne Bestätigung: Zusammengebaut: Kompressor."},{"type":"dialogue","speaker":"kupferstein","lines":["Ausgezeichnet! Slimefun hat den Kompressor als gültige Multiblock-Maschine erkannt. Der Aufbau ist damit erfolgreich geprüft."]},{"type":"dialogue","speaker":"eckart","lines":["MEEEEISTER! WIR HABEN EINEN KOMPRESSOR!"]},{"type":"dialogue","speaker":"roehrig","lines":["JA, ECKAT! UND JETZT MUSS ER NUR NOCH WAS ZUSAMMENPRESSEN!"]},{"type":"dialogue","speaker":"werner","lines":["Höhöhö! Hauptsache, keiner steckt seine Finger rein."]},{"type":"dialogue","speaker":"huibuh","lines":["Eine weitere Errungenschaft für unser Forschungslabor!"]},{"type":"dialogue","speaker":"casper","lines":["Es sieht ein bisschen unheimlich aus ... aber auch sehr beeindruckend."]},{"type":"narration","text":"Der erfolgreiche Aufbau ist dokumentiert. Eine Verarbeitung mit acht Stahlbarren ist bis hierhin noch nicht durchgeführt."}]},{"chapter":"Kapitel 14 · Stahl für die nächste Prüfung","title":"Zweiunddreißig Barren für vier Platten","subtitle":"Die Schmelzerei übernimmt ihren Teil der Arbeit","blocks":[{"type":"narration","text":"Nach der Maschinenmontage kehrt die Gruppe zu den Rohstoffen zurück. Der Forschungsleiter erinnert sich an die errechnete Menge: vier Stahlplatten, jeweils acht Barren, insgesamt 32 Stahlbarren."},{"type":"dialogue","speaker":"leader","lines":["Dann legen wir los! Wir brauchen 32 Eisenstaub, 32 Kohlenstoff und 32 Eisenbarren. Die Rohstoffe kennen wir bereits."]},{"type":"dialogue","speaker":"kupferstein","lines":["Richtig. Für diese Forschungsreihe ist die Stahlherstellung kein unbekanntes Rezept mehr. Wir prüfen aber natürlich, ob die gewünschte Menge tatsächlich gelingt."]},{"type":"narration","text":"Die Zutaten werden vorbereitet und in der Schmelzerei verarbeitet. Der Forschungsleiter kontrolliert den Bestand und meldet schließlich 32 fertige Stahlbarren."},{"type":"dialogue","speaker":"leader","lines":["So, die 32 Stahlbarren sind fertig!"]},{"type":"dialogue","speaker":"werner","lines":["Jou! Dann fehlt jetzt bloß noch der erste richtige Einsatz vom Kompressor."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! ICH HÄTTE DOCH DEN STEIN VORHIN PRESSEN KÖNNEN!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! WIR PRESSEN STAHLBARREN!"]},{"type":"dialogue","speaker":"doofen","lines":["Aber mein Stahl-Verstahlungs-INATOR hätte sicher ebenfalls eine beeindruckende Vorstellung geboten."]},{"type":"dialogue","speaker":"casper","lines":["Ich bin gespannt, wie so eine Stahlplatte am Ende aussieht."]},{"type":"narration","text":"Bestand bestätigt: 32 Stahlbarren erfolgreich hergestellt. Die Herstellung der vier Stahlplatten im Kompressor steht noch aus."}]},{"chapter":"Kapitel 14 · Stahl für die nächste Prüfung","title":"Feierabend im unterirdischen Labor","subtitle":"Eine herzliche Verabschiedung und ein offener nächster Versuch","blocks":[{"type":"narration","text":"Der Forschungsleiter betrachtet die Werkstatt. Der Erzbrecher steht an seinem Platz, gleich daneben der neu errichtete Kompressor. Die 32 Stahlbarren sind fertig. Für heute ist genug geschafft."},{"type":"dialogue","speaker":"leader","lines":["So, meine Herren, hiermit endet mein heutiger Besuch. Wir haben wieder viel geschafft. Unsere Erlebnisse kommen ins Forschungsbuch, und dann widme ich mich wieder dem anderen Projekt. Das muss schließlich ebenfalls vorankommen."]},{"type":"dialogue","speaker":"kupferstein","lines":["Ein guter Schlusspunkt. Ich vermerke den erfolgreichen Kompressoraufbau und die 32 Stahlbarren. Die Stahlplatten bleiben für den nächsten Forschungstag offen."]},{"type":"dialogue","speaker":"werner","lines":["Jou, Chef! War wieder 'ne schöne Zeit. Und mit den Steinen hatten wir heute auch unseren Spaß."]},{"type":"dialogue","speaker":"eckart","lines":["MEISTER! DARF ICH MICH JETZT VERABSCHIEDEN, ODER MUSS ICH ERST DEN STEIN FRAGEN?!"]},{"type":"dialogue","speaker":"roehrig","lines":["ECKAT! DU DARFST JETZT FEIERABEND MACHEN!"]},{"type":"dialogue","speaker":"huibuh","lines":["Ich werde währenddessen über die bereits erforschten Rüstungsschätze wachen. In meiner Schatzkammer ist alles wohlverwahrt."]},{"type":"dialogue","speaker":"doofen","lines":["Und ich ... werde meinen Kompressor-Verbesserungs-INATOR nur auf Papier entwickeln. Versprochen. Vorerst."]},{"type":"dialogue","speaker":"casper","lines":["Danke für den schönen Tag. Ich freue mich, wenn wir wieder zusammen forschen dürfen."]},{"type":"narration","text":"Die Forschungsgruppe verabschiedet sich. In der stiller werdenden Werkstatt bleiben die frisch eingerichteten Maschinen zurück. Kein Versuch wird vorweggenommen. Das nächste Kapitel wartet geduldig auf seine tatsächliche Entdeckung."},{"type":"end","text":"Fortsetzung folgt: Vier Stahlplatten für die Schleimstahl-Rüstung."}]},{"chapter":"Hörspiel-Test","title":"Die Sache mit dem Schraubenschlüssel","subtitle":"Ein kurzer Stimmtest mit unserem Forschungsteam · keine neue Forschung","blocks":[{"type":"narration","text":"Ein leises Klirren hallt durch die Werkstatt. Meister Röhrig starrt auf den Arbeitstisch. Eckart steht neben ihm und versucht, möglichst unschuldig auszusehen."},{"type":"dialogue","speaker":"roehrig","lines":["ECKART! Wo is denn nu schon wieder mein Schraubenschlüssel?!"]},{"type":"dialogue","speaker":"eckart","lines":["Aber Meister, den ham Sie doch inner Hand!"]},{"type":"narration","text":"Werner lehnt sich grinsend gegen eine Kiste. Professor Kupferstein hebt langsam den Blick von seinen Unterlagen."},{"type":"dialogue","speaker":"werner","lines":["Jau, Röhrig. Manchmal is dat Werkzeug näher als man denkt!"]},{"type":"dialogue","speaker":"kupferstein","lines":["Meine Herren, könnten wir wenigstens einen einzigen Morgen ohne Werkzeugdiskussion beginnen?"]},{"type":"dialogue","speaker":"doofen","lines":["Ausgezeichnet! Dann stelle ich euch meinen völlig neuen Schraubenschlüssel-Such-INATOR vor!"]},{"type":"dialogue","speaker":"huibuh","lines":["HÖHÖHÖ! Bei meinen klappernden Ritterrüstungen! Hier braucht man wahrlich keine Geister, um Dinge verschwinden zu lassen!"]},{"type":"narration","text":"Eckart betrachtet den Schlüssel in der Hand des Meisters. Werner lacht leise. Für einen Augenblick herrscht Frieden im Labor."},{"type":"end","text":"Ende der Hörspielprobe"}]}];
const CAST = {"kupferstein":{"name":"Prof. Kupferstein","img":"bilder/prof_kupferstein.webp"},"roehrig":{"name":"Meister Röhrig","img":"bilder/meister_roehrig.webp"},"eckart":{"name":"Eckart","img":"bilder/eckart.webp"},"werner":{"name":"Werner","img":"bilder/werner.webp"},"doofen":{"name":"Dr. Doofenshmirtz","img":"bilder/dr_doofenshmirtz.webp"},"huibuh":{"name":"Hui Buh","img":"bilder/hui_buh.webp"},"casper":{"name":"Casper","img":null}};

function elt(tag, cls, text) { const el=document.createElement(tag); if(cls)el.className=cls; if(text!==undefined)el.textContent=text;return el; }

function portraitModal(key){const person=CAST[key];if(!person)return; const div=elt('div','lightbox');const img=elt('img');img.src=person.img;img.alt='Originalporträt von '+person.name;add(div,img,elt('p','',person.name));openModal(div)}
function addNarration(parent,text){parent.appendChild(elt('p','narration',text))}
function addDialogue(parent,block){const person=CAST[block.speaker]||(block.speaker==='leader'?{name:'Forschungsleiter',img:null}:null);if(!person)return;
 const card=elt('section','dialogue'+(person.img?'':' dialogue-textonly'));
 if(person.img){const btn=elt('button','portrait-button');btn.type='button';btn.setAttribute('aria-label','Porträt von '+person.name+' vergrößern');const img=elt('img','portrait');img.src=person.img;img.alt=person.name;img.width=252;img.height=252;img.loading='eager';img.decoding='async';btn.appendChild(img);btn.addEventListener('click',()=>portraitModal(block.speaker));card.appendChild(btn)}
 const right=elt('div');add(right,elt('div','speaker',person.name));const speech=elt('div','speech');block.lines.forEach(line=>speech.appendChild(elt('p','',line)));right.appendChild(speech);card.appendChild(right);parent.appendChild(card);
}
function updateChrome(){ document.getElementById('progress-bar').style.width=((current+1)/(PAGES.length+1)*100)+'%';document.getElementById('prev').disabled=current<0;document.getElementById('next').disabled=current>=PAGES.length-1;document.getElementById('next').textContent=current===-1?'Buch öffnen →':current===PAGES.length-1?'Ende des Buchs':'Weiter →';document.getElementById('page-count').textContent=current===-1?'Titelblatt':`Seite ${current+1} von ${PAGES.length}`;}
function render(){root.replaceChildren();
 if(current===-1){const cover=elt('section','cover');const wrap=elt('div');add(wrap,elt('div','cover-mark','✧'),elt('span','ribbon','BAND I  ·  DER PROLOG'),elt('h1','', 'Aygon'),elt('div','cover-sub','Forschungschroniken'),elt('div','ornament','✦'),elt('p','deck','Sechs Spezialisten. Ein unterirdisches Labor. Eine Sammlung höchst ungewöhnlicher Forschungsabenteuer, bei denen wissenschaftliche Disziplin manchmal nur vier Sekunden hält.'));const b=elt('button','big-button','Die Geschichte beginnen');b.onclick=()=>go(0);wrap.appendChild(b);wrap.appendChild(elt('small','','Interaktives Leseexemplar · Alle Bilder lokal · Keine Internetverbindung nötig'));cover.appendChild(wrap);root.appendChild(cover);}
 else {const page=PAGES[current];add(root,elt('div','eyebrow',page.chapter+'  /  Seite '+(current+1)),elt('h1','chapter-title',page.title),elt('p','subtitle',page.subtitle),elt('div','ornament','✦'));
 for(const b of page.blocks){if(b.type==='narration')addNarration(root,b.text);else if(b.type==='dialogue')addDialogue(root,b);else if(b.type==='end')root.appendChild(elt('div','finish',b.text));}
 const footer=elt('div','page-foot');add(footer,elt('span','','AYGON · EINE REISE DURCH DIE ZEIT'),elt('span','','Fiktive Rahmenszene · Keine neuen Versuchsergebnisse'));root.appendChild(footer);
 }
 updateChrome();window.scrollTo({top:0,behavior:'smooth'});
}
function go(page){stopReading();current=Math.min(PAGES.length-1,Math.max(-1,page));render();updateAudioButtons();}
document.getElementById('prev').onclick=()=>go(current-1);
document.getElementById('next').onclick=()=>current<PAGES.length-1&&go(current+1);
document.getElementById('home').onclick=()=>go(-1);
document.getElementById('toc').onclick=()=>{const list=elt('div','index-list');const cover=elt('button','index-item');add(cover,elt('span','index-num','0'),elt('span','','Titelblatt'));cover.onclick=()=>{closeModal();go(-1)};list.appendChild(cover);PAGES.forEach((p,i)=>{const b=elt('button','index-item');const t=elt('span');add(t,elt('strong','',p.title),elt('small','',p.subtitle));add(b,elt('span','index-num',String(i+1)),t);b.onclick=()=>{closeModal();go(i)};list.appendChild(b)});const out=elt('div');add(out,elt('h2','','Inhaltsverzeichnis'),list);openModal(out)};
document.getElementById('cast').onclick=()=>{const out=elt('div');out.appendChild(elt('h2','','Unsere Forschungsgruppe'));const grid=elt('div','cast-grid');for(const [key,p]of Object.entries(CAST)){const card=elt('button','cast-card');if(p.img){const img=elt('img');img.src=p.img;img.alt=p.name;img.loading='lazy';card.appendChild(img);card.onclick=()=>portraitModal(key)}else{const placeholder=elt('div','cast-placeholder','👻');placeholder.setAttribute('aria-label','Kein Porträt hinterlegt');card.appendChild(placeholder);card.disabled=true}card.appendChild(elt('strong','',p.name));grid.appendChild(card)}out.appendChild(grid);openModal(out)};
textToggle.onclick=()=>{portraitsVisible=!portraitsVisible;document.body.classList.toggle('view-text',!portraitsVisible);textToggle.textContent=portraitsVisible?'🖼 Bilder: an':'▤ Bilder: aus';textToggle.setAttribute('aria-pressed',String(!portraitsVisible));};
settingsSize.onclick=()=>{fontScale=fontScale===1?1.15:fontScale===1.15?1.3:1;document.documentElement.style.setProperty('--font-scale',fontScale);settingsSize.textContent='A± Schrift '+Math.round(fontScale*100)+'%';};
document.getElementById('modal-close').onclick=closeModal;
overlay.addEventListener('click',ev=>{if(ev.target===overlay)closeModal()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){closeModal();return}if(overlay.classList.contains('open'))return;if(ev.key==='ArrowRight'&&current<PAGES.length-1)go(current+1);if(ev.key==='ArrowLeft'&&current>=0)go(current-1)});
render();

// Vorlesefunktion: Browser-Sprachausgabe, keine externe Bibliothek.
const synthesisSupported=('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
const speakEngine=synthesisSupported?window.speechSynthesis:null;
const readButton=document.getElementById('read-start');
const pauseButton=document.getElementById('read-pause');
const stopButton=document.getElementById('read-stop');
const voiceChoice=document.getElementById('voice-choice');
const speedChoice=document.getElementById('speed-choice');
const autoNext=document.getElementById('auto-next');
const speechStatus=document.getElementById('audio-status');
// Lokaler Hörspielmodus: vorhandene deutsche Stimmen, pro Rolle unterschiedliche Klangfarben.
const CAST_PROFILES={
 narrator:{name:'Erzähler',pitch:1,rate:.92,prefer:'warm',gender:'neutral'},
 kupferstein:{name:'Prof. Kupferstein',pitch:.93,rate:.91,prefer:'m',gender:'male'},
 roehrig:{name:'Meister Röhrig',pitch:.81,rate:1.02,prefer:'m',gender:'male'},
 eckart:{name:'Eckart',pitch:1.17,rate:1.07,prefer:'m',gender:'male'},
 werner:{name:'Werner',pitch:.92,rate:1.12,prefer:'m',gender:'male'},
 doofen:{name:'Dr. Doofenshmirtz',pitch:1.23,rate:1.12,prefer:'m',gender:'male'},
 huibuh:{name:'Hui Buh',pitch:.84,rate:.88,prefer:'m',gender:'male'},
 casper:{name:'Casper',pitch:1.26,rate:.91,prefer:'warm',gender:'neutral'}
};
const roleChoices={};
const roleHints={narrator:'Warm, ruhig',kupferstein:'Sachlich, bedacht',roehrig:'Kernig und laut',eckart:'Jugendlich, etwas nervös',werner:'Locker und flott',doofen:'Aufgedreht und exzentrisch',huibuh:'Tief und theatralisch',casper:'Sanft und schüchtern'};
const castMode=document.getElementById('cast-mode');
function germanVoices(){return lastVoiceList.filter(v=>/^de(?:-|$)/i.test(v.lang))}
function voiceForRole(key){
 const available=germanVoices();const chosen=lastVoiceList.find(v=>v.voiceURI===roleChoices[key]);
 if(chosen)return chosen;
 const basic=lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(!available.length)return basic||null;
 const idx={narrator:0,kupferstein:1,roehrig:2,eckart:3,werner:4,doofen:5,huibuh:6,casper:7}[key]||0;
 return available[idx%available.length];
}
function openCasting(){
 const modal=elt('div');add(modal,elt('h2','','🎭 Rollenbesetzung'),elt('p','','Für jede Figur kannst du eine verfügbare deutsche Browserstimme wählen. Auch bei nur einer Stimme unterscheiden sich Tonhöhe und Tempo. Das sind keine aufgenommenen Synchronstimmen.'));
 const voices=germanVoices();
 if(!voices.length)modal.appendChild(elt('p','','Keine deutschen Stimmen erkannt. Die Systemstimme wird verwendet.'));
 const list=elt('div','casting-grid');
 for(const [key,profile] of Object.entries(CAST_PROFILES)){
  const row=elt('div','casting-row'); const left=elt('div');add(left,elt('strong','',profile.name),elt('small','',roleHints[key]));
  const sel=elt('select');sel.setAttribute('aria-label','Stimme für '+profile.name);
  sel.appendChild(new Option('Automatische Besetzung',''));
  for(const voice of voices)sel.appendChild(new Option(`${voice.name} (${voice.lang})`,voice.voiceURI));
  sel.value=roleChoices[key]||'';
  sel.addEventListener('change',()=>{roleChoices[key]=sel.value});
  const preview=elt('button','audio-btn','▶ Test');preview.type='button';preview.onclick=()=>{
    if(!speakEngine)return;stopReading();
    const ut=new SpeechSynthesisUtterance(key==='narrator'?'Tief unter der Minecraft-Welt liegt das Aygon-Forschungslabor.':key==='roehrig'?'Eckart! Wo ist denn mein Schraubenschlüssel?':key==='eckart'?'Aber Meister, den ham Sie doch in der Hand!':key==='huibuh'?'Bei meinen klappernden Ritterrüstungen!':`Guten Morgen! Hier spricht ${profile.name}.`);
    const picked=voiceForRole(key);if(picked){ut.voice=picked;ut.lang=picked.lang}else ut.lang='de-DE';
    ut.pitch=profile.pitch;ut.rate=profile.rate*(parseFloat(speedChoice.value)||1);
    speakEngine.speak(ut);
  };
  add(row,left,sel,preview);list.appendChild(row)
 }
 modal.appendChild(list);openModal(modal);
}
document.getElementById('cast-settings').onclick=openCasting;
document.getElementById('jump-demo').onclick=()=>go(PAGES.length-1);
let speechSession=0, speechItems=[], speechCursor=0, speechRunning=false, speechPaused=false, lastVoiceList=[];
function setAudioStatus(text){speechStatus.textContent=text}
function clearSpeaking(){document.querySelectorAll('.speaking-block').forEach(el=>el.classList.remove('speaking-block'))}
function updateAudioButtons(){
 readButton.disabled=!synthesisSupported||current<0;
 pauseButton.disabled=!synthesisSupported||!speechRunning;
 stopButton.disabled=!synthesisSupported||!speechRunning;
 pauseButton.textContent=speechPaused?'▶ Fortsetzen':'⏸ Pause';
 readButton.textContent=speechRunning?'↻ Neu vorlesen':'▶ Vorlesen';
}
function stopReading(){
 speechSession++; speechRunning=false;speechPaused=false;speechItems=[];speechCursor=0;
 if(speakEngine){try{speakEngine.cancel()}catch(error){}}
 clearSpeaking();setAudioStatus(synthesisSupported?'Bereit zum Vorlesen':'Keine Sprachausgabe verfügbar');updateAudioButtons();
}
function populateVoices(){
 if(!speakEngine)return;
 const all=speakEngine.getVoices();
 if(!all.length){voiceChoice.replaceChildren(new Option('Systemstimme (automatisch)',''));return}
 lastVoiceList=all;
 const prev=voiceChoice.value;
 const sorted=[...all].sort((a,b)=>{const aDe=a.lang.toLowerCase().startsWith('de')?0:1;const bDe=b.lang.toLowerCase().startsWith('de')?0:1;return aDe-bDe||a.name.localeCompare(b.name)});
 voiceChoice.replaceChildren(...sorted.map(v=>new Option(`${v.name} (${v.lang})`,v.voiceURI)));
 let chosen=sorted.find(v=>v.voiceURI===prev) || sorted.find(v=>v.lang.toLowerCase()==='de-de') || sorted.find(v=>v.lang.toLowerCase().startsWith('de')) || sorted[0];
 voiceChoice.value=chosen.voiceURI;
}
function collectSpeechItems(){
 const out=[];
 // Die visuellen Abschnitte liefern die Reihenfolge. Jedes Sprecherporträt bleibt im Text sichtbar.
 for(const el of root.querySelectorAll('.narration,.dialogue')){
   if(el.classList.contains('narration')){out.push({element:el,text:el.textContent.trim(),role:"narrator"})}
   else{
     const who=el.querySelector('.speaker')?.textContent.trim()||'';
     const words=[...el.querySelectorAll('.speech p')].map(x=>x.textContent.trim()).filter(Boolean).join(' ');
     out.push({element:el,text:words,role:el.querySelector(".speaker")?.textContent.trim()===CAST.kupferstein.name?"kupferstein":Object.keys(CAST).find(key=>CAST[key].name===who)||"narrator",who});
   }
 }
 return out.filter(item=>item.text);
}
function speakNext(session){
 if(session!==speechSession||!speechRunning)return;
 clearSpeaking();
 if(speechCursor>=speechItems.length){
    const shouldContinue=autoNext.checked&&current<PAGES.length-1;
    speechRunning=false; speechPaused=false;
    if(shouldContinue){go(current+1);playReading();return}
    setAudioStatus('Seite vollständig vorgelesen');updateAudioButtons();return;
 }
 const item=speechItems[speechCursor];
 item.element.classList.add('speaking-block');
 // Leseabschnitt nur dann sichtbar machen, wenn er außerhalb des Fensters liegt.
 const rect=item.element.getBoundingClientRect();
 if(rect.bottom>window.innerHeight-40||rect.top<85)item.element.scrollIntoView({behavior:'smooth',block:'center'});
 const utterance=new SpeechSynthesisUtterance(item.text);
 utterance.lang='de-DE';utterance.rate=parseFloat(speedChoice.value)||1;utterance.pitch=1;utterance.volume=1;
 const profile=CAST_PROFILES[item.role]||CAST_PROFILES.narrator;
 const chosen=castMode.checked?voiceForRole(item.role):lastVoiceList.find(v=>v.voiceURI===voiceChoice.value);
 if(castMode.checked){utterance.pitch=profile.pitch;utterance.rate=(parseFloat(speedChoice.value)||1)*profile.rate;}
 if(chosen){utterance.voice=chosen;utterance.lang=chosen.lang;}
 utterance.onstart=()=>{if(session!==speechSession)return;setAudioStatus(`Abschnitt ${speechCursor+1} von ${speechItems.length}`)};
 utterance.onend=()=>{if(session!==speechSession)return;speechCursor++;speakNext(session)};
 utterance.onerror=(event)=>{
   if(session!==speechSession)return;
   if(event.error==='canceled'||event.error==='interrupted')return;
   speechRunning=false;speechPaused=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe fehlgeschlagen: '+(event.error||'unbekannter Fehler'));
 };
 try{speakEngine.speak(utterance)}catch(err){speechRunning=false;clearSpeaking();updateAudioButtons();setAudioStatus('Sprachausgabe konnte nicht starten')}
}
function playReading(){
 if(!synthesisSupported){setAudioStatus('Dieser Browser unterstützt keine Vorlesefunktion');return}
 if(current<0){go(0)}
 stopReading();
 // Eine deutsche Stimme kann auch erst nach dem Laden des Buchs erscheinen.
 populateVoices();
 speechItems=collectSpeechItems();speechCursor=0;
 if(!speechItems.length){setAudioStatus('Auf dieser Seite gibt es keinen Vorlesetext');return}
 speechRunning=true;speechPaused=false;const session=speechSession;
 updateAudioButtons();setAudioStatus('Vorlesen wird gestartet …');speakNext(session);
}
readButton.addEventListener('click',playReading);
pauseButton.addEventListener('click',()=>{
 if(!speechRunning||!speakEngine)return;
 if(speechPaused){speakEngine.resume();speechPaused=false;setAudioStatus('Vorlesen fortgesetzt')}
 else{speakEngine.pause();speechPaused=true;setAudioStatus('Vorlesen pausiert')}
 updateAudioButtons();
});
stopButton.addEventListener('click',stopReading);
if(speakEngine){populateVoices();if(speakEngine.addEventListener)speakEngine.addEventListener('voiceschanged',populateVoices)}
else{setAudioStatus('Sprachausgabe hier nicht verfügbar');voiceChoice.disabled=true;speedChoice.disabled=true;autoNext.disabled=true}
updateAudioButtons();

</script>
</body>
</html>
